  --c2:#111111;
  --c3:#0050b3;
  --c4:#5c5c5c;
  --c5:#a33c00;
  --fill-mix:8%;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --display-weight:800;
  --display-case:none;
  --display-tracking:-.035em;
  --display-leading:.94;
  --sans:"Archivo","Helvetica Neue",Arial,sans-serif;
  --mono:"Geist Mono",ui-monospace,Consolas,monospace;
  --label-case:uppercase;
  --label-tracking:.12em;
  --radius:0px;
  --marker-radius:0%;
  --rule:2px;
  /* motion: crisp */
  --motion:crisp;
  --ease:cubic-bezier(.4,0,.2,1);
  --ease-out:cubic-bezier(.2,0,0,1);
  --t-reveal:.36s;
  --t-fade:.22s;
  --stagger:.06s;
  --rise:0px;
  --travel:0;
  --from-scale:1;
  --wipe-from:100%;
  --title-anim:none;
  --ambient-opacity:.14;
  --ambient-scale:1.6;
  --ambient-period:3.2s;
  --camera-t:.8s;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--outside);color:var(--ink);font-family:var(--sans);overflow:hidden}
/* not tidiness: a UA 1em margin offsets absolutely-positioned elements from
   where top/bottom says, which makes every number in the CSS a lie */
p,h1,h2,h3,ul,ol,figure{margin:0}
a{color:inherit}
img{display:block;max-width:100%}
.display{font-family:var(--display);font-weight:var(--display-weight);
  text-transform:var(--display-case);letter-spacing:var(--display-tracking);
  line-height:var(--display-leading)}
.meta{font-family:var(--mono);font-weight:500;text-transform:var(--label-case);
  letter-spacing:var(--label-tracking)}

/* ---- the stage: one logical canvas, scaled once ---- */
#viewport{position:fixed;inset:0}
#stage{width:1920px;height:1080px;position:absolute;left:50%;top:50%;
       background:var(--paper);overflow:hidden;transform-origin:center}

.slide{position:absolute;inset:0;opacity:0;visibility:hidden;
       transition:opacity var(--t-fade) var(--ease),visibility var(--t-fade)}
.slide.is-active{opacity:1;visibility:visible}

/* ---- title ---- */
#title{padding:0 120px;display:flex;flex-direction:column;justify-content:center}
.kicker{display:flex;align-items:center;gap:14px;font-weight:700;font-size:21px;
        letter-spacing:.34em;color:var(--ink-3)}
.kicker::before{content:"";width:15px;height:15px;border-radius:var(--marker-radius);
                background:var(--accent)}
#title h1{margin-top:26px;font-size:112px;max-width:16ch}
#title .lede{margin-top:26px;max-width:60ch;font-size:21px;line-height:1.55;color:var(--ink-2)}
/* the scene's own heading, small and out of the way */
.scene-head{position:absolute;left:120px;top:80px;z-index:5}
.scene-head .kicker{font-size:17px}
.scene-head h2{margin-top:14px;font-size:52px}

/* ---- the stepped scene: options as columns, criteria as rows ---- */
#scene{position:absolute;inset:0}

/* everything that reveals shares one treatment, so the motion style applies to all of it */
.rv{opacity:0;clip-path:inset(0 var(--wipe-from) 0 0);transform:translateY(var(--rise));
    transition:opacity var(--t-fade) var(--ease),transform var(--t-reveal) var(--ease),
               clip-path var(--t-reveal) var(--ease)}
.rv.on{opacity:1;clip-path:inset(0 0 0 0);transform:none;transition-delay:var(--d,0s)}

.head{position:absolute;top:260px;width:280px}
.head h3{font-size:33px}
.head .nm{position:relative}
.head p{margin-top:10px;font-size:18px;line-height:1.4;color:var(--ink-2)}
/* an option that misses a bar is struck through where it failed, then quietly steps back */
.head h3,.head p,.cell>*{transition:opacity var(--t-fade) var(--ease)}
.head .strike{position:absolute;left:-4px;right:-4px;top:52%;height:4px;background:var(--accent);
              transform:scaleX(0);transform-origin:left;transition:transform var(--t-reveal) var(--ease)}
.out .strike{transform:scaleX(1)}
.head.out h3,.head.out p,.cell.out>*{opacity:.32}

.rule{position:absolute;left:120px;right:120px;height:var(--rule);background:var(--ink);
      transform:scaleX(0);transform-origin:left;transition:transform var(--t-reveal) var(--ease)}
.rule.on{transform:scaleX(1)}
.crit{position:absolute;left:120px;width:400px}
.crit h4{margin:0;font-family:var(--sans);font-weight:700;font-size:26px;letter-spacing:-.01em}
.crit p{margin-top:8px;font-size:14px;color:var(--ink-3)}

.cell{position:absolute;width:280px;display:grid;grid-template-columns:18px 1fr;gap:4px 16px}
.cell i{grid-row:span 2;width:18px;height:18px;margin-top:8px;border:2px solid var(--ink);
        border-radius:var(--marker-radius)}
.cell i.good{background:var(--ink)}
.cell i.ok{background:linear-gradient(90deg,var(--ink) 50%,transparent 50%)}
.cell b{font-family:var(--display);font-weight:var(--display-weight);font-size:30px;
        letter-spacing:var(--display-tracking)}
.cell span{font-size:15px;color:var(--ink-2)}
.cell.fail b,.cell.fail span{color:var(--accent)}
.cell.fail i{border-color:var(--accent)}

/* the winner gets a frame, and the verdict says why in one sentence */
.frame{position:absolute;border:3px solid var(--accent);pointer-events:none}
.verdict{position:absolute;left:120px;right:120px;top:902px;display:flex;gap:40px;
         align-items:baseline}
.verdict .meta{font-size:15px;color:var(--accent);flex:none;font-weight:700}
.verdict p{font-family:var(--display);font-weight:var(--display-weight);font-size:44px;
           letter-spacing:var(--display-tracking);line-height:1.08}

/* ---- presenter chrome: on hover, readable over any theme ---- */
#progress{position:fixed;left:0;bottom:0;height:2px;background:var(--accent);width:0;
          transition:width var(--t-fade) var(--ease);z-index:50}
#chrome{position:fixed;left:0;right:0;bottom:16px;display:flex;justify-content:center;gap:9px;
        opacity:0;transition:opacity .25s;z-index:50}
#viewport:hover~#chrome,#chrome:hover{opacity:1}
#chrome button{font-family:var(--mono);font-size:12px;color:var(--ink-2);cursor:pointer;
  background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:7px 13px}

/* ---- ?still: a frozen position, used by the presenter previews and print ---- */
.still *,.still *::before,.still *::after{transition:none!important;animation:none!important}
.still #chrome,.still #progress{display:none}

/* ---- ?presenter: notes, next step, timer. Drives the audience window ---- */
#presenter{display:none}
.presenter body{overflow:auto;background:#16171c;color:#e9e8e4}
.presenter #viewport,.presenter #chrome,.presenter #progress{display:none}
.presenter #presenter{display:grid;grid-template-columns:3fr 2fr;gap:20px;padding:20px;
  min-height:100vh;font-family:system-ui,sans-serif}
#presenter iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:6px;background:#000}
#presenter .side{display:flex;flex-direction:column;gap:14px}
#presenter .tag{font:600 11px/1 ui-monospace,monospace;letter-spacing:.2em;
  text-transform:uppercase;color:#8d8c88;margin-bottom:6px}
#pNotes{font-size:22px;line-height:1.5;white-space:pre-wrap;margin-top:6px}
#pClock{display:flex;gap:18px;font:600 30px/1 ui-monospace,monospace}
#pClock span{cursor:pointer}

/* ---- ?print: one page per position, then the browser's Save as PDF ---- */
#print{display:none}
.print body{overflow:visible;background:#fff}
.print #chrome,.print #progress{display:none}
/* not display:none: the live stage is what layout() measures before it is cloned */
.print #viewport{position:absolute;width:0;height:0;overflow:hidden;visibility:hidden}
.print #print{display:block}
/* contain:paint as well as overflow:hidden: a camera track wider than the canvas must not
   widen the printed document, or the browser shrinks every page to fit it */
.page{position:relative;width:1920px;height:1080px;overflow:hidden;contain:paint;break-after:page}
.page.notes{height:1440px}
.page #stage{position:relative;left:0;top:0;transform:none!important}
.page .note{position:absolute;left:0;right:0;top:1080px;bottom:0;padding:44px 120px;
  font:24px/1.5 var(--sans);color:#222;white-space:pre-wrap;border-top:1px solid #ddd}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition-duration:.001s!important}

}
</style>
</head>
<body>
<div id="viewport"><div id="stage">

  <section class="slide is-active" id="title">
    <p class="kicker meta">Decision · booking</p>
    <h1 class="display">Where should booking live?</h1>
    <p class="lede">Four ways to give customers online booking. Four bars each one has to
      clear. One option is left at the end, and you will see exactly where the others fell out.</p>
  </section>

  <section class="slide" id="s-scene">
    <div class="scene-head"><p class="kicker meta">Four options, four bars</p>
      <h2 class="display">Narrowing it down</h2></div>
    <div id="scene"></div>
  </section>

</div></div>

<div id="chrome">
  <button id="bPrev" type="button">← back</button>
  <button id="bNext" type="button">next →</button>
  <button id="bReset" type="button">reset (R)</button>
  <button id="bAll" type="button">show all (F)</button>
  <button id="bNotes" type="button">presenter (P)</button>
</div>
<div id="progress"></div>

<div id="presenter">
  <div><p class="tag">Now</p><iframe id="pNow" title="Current"></iframe></div>
  <div class="side">
    <div id="pClock"><span id="pElapsed" title="Click to restart">00:00</span><span id="pTime"></span>
      <span id="pCount"></span></div>
    <div><p class="tag">Next</p><iframe id="pNext" title="Next"></iframe></div>
    <div><p class="tag">Notes</p><div id="pNotes"></div></div>
  </div>
</div>
<div id="print"></div>

<script>
/* ── modes: ?still freezes a position, ?presenter and ?print build their own views ─ */
const Q = new URLSearchParams(location.search);
const MODE = Q.has('print') ? 'print' : Q.has('presenter') ? 'presenter' : Q.has('still') ? 'still' : 'deck';
if (MODE !== 'deck') document.documentElement.classList.add(MODE === 'print' ? 'still' : MODE, MODE);
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const stage = document.getElementById('stage');
const slides = [...document.querySelectorAll('.slide')];

/* ── content: everything on screen comes from here ───────────────────────── */
const TITLE_NOTES = "We are asking for a decision today. Everything on the next slide leads to one answer.";
const SCENE_NOTES = "Four options. The bars are agreed with finance and ops already, they are not up for debate today.";
const OPTIONS = [
  { id:"build",  name:"Build in-house",   desc:"Our own app, our own team" },
  { id:"buy",    name:"Buy off the shelf", desc:"A booking SaaS, configured" },
  { id:"extend", name:"Extend the CRM",   desc:"Add booking to what we already run" },
  { id:"agency", name:"Use an agency",    desc:"They build it, we own the brief" }
];
/* score: good | ok | poor. `fail` marks the cell where an option misses the bar. */
const CRITERIA = [
  { name:"Time to launch", bar:"Bar: live before peak season, 6 months",
    notes:"Peak season starts in April. Building it ourselves cannot make that.",
    cells:{ build:["poor","14 months","Two teams, from scratch",1], buy:["good","3 months","Configure and migrate"],
            extend:["good","4 months","One new module"], agency:["ok","6 months","If the brief holds"] } },
  { name:"Cost over three years", bar:"Bar: inside €400k",
    notes:"Licences are what sink buying. €450k is before any customisation.",
    cells:{ build:["poor","€610k","Salaries dominate"], buy:["poor","€450k","Per-seat licences",1],
            extend:["good","€190k","Mostly build time"], agency:["ok","€360k","Fixed price, then retainer"] } },
  { name:"Control of the roadmap", bar:"Bar: we decide what ships next",
    notes:"With an agency, every change is a change request. That is the real cost.",
    cells:{ build:["good","Full","Ours to change"], buy:["poor","Theirs","Their release cycle"],
            extend:["good","Ours","Same team, same backlog"], agency:["poor","Shared","Change requests",1] } },
  { name:"Risk", bar:"Bar: nothing we cannot undo",
    notes:"Extending is not risk-free: it is one more thing tied to the CRM. But it can be lifted out.",
    cells:{ build:["poor","High","Hiring first"], buy:["poor","Lock-in","Data leaves us"],
            extend:["ok","Low","One more module"], agency:["poor","Handover","Knowledge leaves"] } }
];
const WINNER = "extend";
const VERDICT = "Extend the CRM: live in four months, inside budget, and the roadmap stays ours.";
const VERDICT_NOTES = "The ask: approve €190k and two people from platform for four months.";
/* steps: options, one per criterion, the verdict */
const STEPS = 1 + CRITERIA.length + 1;
const NOTES = ["Here are the four. Each one is a real proposal someone in this room made.",
               ...CRITERIA.map(c => c.notes), VERDICT_NOTES];
/* where each option drops out: the index of the criterion it fails, or Infinity */
const outAt = Object.fromEntries(OPTIONS.map(o =>
  [o.id, CRITERIA.findIndex(c => c.cells[o.id][3]) >= 0 ? CRITERIA.findIndex(c => c.cells[o.id][3]) : Infinity]));

/* ── geometry: named constants, so the reasoning survives ────────────────── */
const COL_X = [600, 910, 1220, 1530];  // left edge of each option column; the last ends at 1810
const COL_W = 280;
const HEAD_TOP = 260;
const ROW_TOP = 420, ROW_H = 112;      // first criteria row, and the pitch between rows
const CELL_PAD = 24;                   // from a row's rule to its text

/* ── build once ──────────────────────────────────────────────────────────── */
const scene = document.getElementById('scene');
const add = html => scene.insertAdjacentHTML('beforeend', html);
OPTIONS.forEach((o, j) => add(
  `<div class="head rv" data-step="0" data-opt="${o.id}" style="left:${COL_X[j]}px;--d:calc(var(--stagger) * ${j})">
     <h3 class="display"><span class="nm">${o.name}<span class="strike"></span></span></h3><p>${o.desc}</p></div>`));
CRITERIA.forEach((c, r) => {
  const top = ROW_TOP + r * ROW_H, s = r + 1;
  add(`<div class="rule" data-step="${s}" style="top:${top}px"></div>
       <div class="crit rv" data-step="${s}" style="top:${top + CELL_PAD}px"><h4>${c.name}</h4><p class="meta">${c.bar}</p></div>`);
  OPTIONS.forEach((o, j) => {
    const [score, value, note, fail] = c.cells[o.id];
    add(`<div class="cell rv${fail ? ' fail' : ''}" data-step="${s}" data-opt="${o.id}" data-row="${r}"
           style="left:${COL_X[j]}px;top:${top + CELL_PAD}px;--d:calc(var(--stagger) * ${j + 1})">
           <i class="${score}"></i><b>${value}</b><span>${note}</span></div>`);
  });
});
const w = OPTIONS.findIndex(o => o.id === WINNER);
add(`<div class="frame rv" data-step="${STEPS - 1}" style="left:${COL_X[w] - 24}px;top:${HEAD_TOP - 24}px;
       width:${COL_W + 48}px;height:${ROW_TOP + CRITERIA.length * ROW_H - HEAD_TOP + 24}px"></div>
     <div class="verdict rv" data-step="${STEPS - 1}" style="--d:var(--stagger)">
       <span class="meta">Recommendation</span><p>${VERDICT}</p></div>`);

function layout(){}                    // nothing here depends on measured text

/* ── the step machine: everything derived from `step`, never incremented ─── */
let step = -1;
function applyStep(n){
  step = Math.max(-1, Math.min(n, STEPS - 1));
  scene.querySelectorAll('[data-step]').forEach(el => el.classList.toggle('on', +el.dataset.step <= step));
  /* an option is out once the row it fails has been shown; the failing cell itself stays loud */
  scene.querySelectorAll('[data-opt]').forEach(el => {
    const failedRow = outAt[el.dataset.opt];
    const out = step - 1 >= failedRow && !(el.classList.contains('cell') && +el.dataset.row === failedRow);
    el.classList.toggle('out', out);
  });
}

/* ── the sequence: every position in the deck, in presenting order ───────────
   The presenter view, print and deep links all speak in positions, so they work
   on any deck that can list its positions and show one. */
const SCENE = 1;
const SEQ = [{ slide:0, step:-1, notes:TITLE_NOTES }];
for (let k = reduced ? STEPS - 1 : -1; k < STEPS; k++)
  SEQ.push({ slide:SCENE, step:k, notes: k < 0 ? SCENE_NOTES : NOTES[k] });

let at = 0, peer = null;
function show(i, fromPeer){
  at = Math.max(0, Math.min(i, SEQ.length - 1));
  const p = SEQ[at];
  slides.forEach((s, k) => s.classList.toggle('is-active', k === p.slide));
  applyStep(p.slide === SCENE ? p.step : -1);
  document.getElementById('progress').style.width = (at / (SEQ.length - 1) * 100) + '%';
  if (MODE === 'deck') history.replaceState(null, '', '#' + at);
  if (MODE === 'presenter') renderPresenter();
  if (!fromPeer && peer && !peer.closed) peer.postMessage({ deck:'show', at }, '*');
}
const first = () => SEQ.findIndex(p => p.slide === SEQ[at].slide);
const last  = () => SEQ.map(p => p.slide).lastIndexOf(SEQ[at].slide);

addEventListener('message', e => {
  if (!e.data || e.data.deck !== 'show') return;
  if (e.source !== parent) peer = e.source;     // a reopened presenter finds us again
  show(e.data.at, true);
});

/* ── keys and buttons ────────────────────────────────────────────────────── */
function openPresenter(){
  peer = open(location.pathname + '?presenter#' + at, 'deck-presenter', 'popup,width=1280,height=760');
}
function openPrint(){ open(location.pathname + '?print' + (SEQ.some(p => p.notes) ? '=notes' : '')); }
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  if (k === 'ArrowRight' || k === ' ' || k === 'PageDown'){ e.preventDefault(); show(at + 1); }
  if (k === 'ArrowLeft' || k === 'PageUp'){ e.preventDefault(); show(at - 1); }
  if (k === 'r' || k === 'R') show(first());
  if (k === 'f' || k === 'F') show(last());
  if (k === 'p' && MODE === 'deck') openPresenter();
  if (k === 'P' && MODE === 'deck') openPrint();
});
bNext.onclick = () => show(at + 1); bPrev.onclick = () => show(at - 1);
bReset.onclick = () => show(first()); bAll.onclick = () => show(last());
bNotes.onclick = openPresenter;

/* ── presenter view ──────────────────────────────────────────────────────── */
let t0 = Date.now();
function renderPresenter(){
  const post = (f, i) => f.contentWindow && f.contentWindow.postMessage({ deck:'show', at:i }, '*');
  post(pNow, at); post(pNext, Math.min(at + 1, SEQ.length - 1));
  pNext.style.opacity = at + 1 < SEQ.length ? 1 : .25;
  pNotes.textContent = SEQ[at].notes || '—';
  pCount.textContent = (at + 1) + ' / ' + SEQ.length;
}
if (MODE === 'presenter'){
  peer = opener;
  const still = location.pathname + '?still#';
  pNow.src = still + at; pNext.src = still + (at + 1);
  pNow.onload = pNext.onload = renderPresenter;
  pElapsed.onclick = () => t0 = Date.now();
  const tick = () => {
    const s = Math.floor((Date.now() - t0) / 1000);
    pElapsed.textContent = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
    pTime.textContent = new Date().toTimeString().slice(0, 5);
  };
  tick(); setInterval(tick, 1000);
}

/* ── print: freeze each position, clone the stage onto its own page ──────── */
/* Chrome counts an element past the canvas edge when it sizes the printed document, even
   though the stage clips it, and then shrinks every page to fit. So each copy leaves out
   what cannot be seen anyway: anything wholly off the canvas, and anything not yet revealed.
   What is left must stay inside the canvas, which verification.md already asks for. */
function dropOffCanvas(live, copy){
  const box = live.getBoundingClientRect(), b = copy.querySelectorAll('*');
  live.querySelectorAll('*').forEach((el, i) => {
    const r = el.getBoundingClientRect();
    const off = r.right <= box.left || r.left >= box.right || r.bottom <= box.top || r.top >= box.bottom;
    if ((r.width && off) || getComputedStyle(el).opacity === '0') b[i].style.display = 'none';
  });
}
function buildPrint(){
  const withNotes = Q.get('print') === 'notes';
  const css = document.createElement('style');
  css.textContent = `@page{size:1920px ${withNotes ? 1440 : 1080}px;margin:0}`;
  document.head.append(css);
  const out = document.getElementById('print');
  SEQ.forEach((p, i) => {
    show(i, true);
    const page = document.createElement('div');
    page.className = 'page' + (withNotes ? ' notes' : '');
    const copy = stage.cloneNode(true);
    dropOffCanvas(stage, copy);
    page.append(copy);
    if (withNotes) page.insertAdjacentHTML('beforeend', '<div class="note"></div>');
    if (withNotes) page.lastChild.textContent = p.notes || '';
    out.append(page);
  });
  document.getElementById('viewport').style.display = 'none';   // measured and cloned; now out of the way
  if (!navigator.webdriver) setTimeout(print, 300);
}

/* ── fit the canvas ──────────────────────────────────────────────────────── */
function fitStage(){
  const k = Math.min(innerWidth / 1920, innerHeight / 1080);
  stage.style.transform = `translate(-50%,-50%) scale(${k})`;
}
addEventListener('resize', fitStage);
fitStage();

layout();
show(+location.hash.slice(1) || 0, true);
/* text-derived measurements are wrong until the real faces are in */
document.fonts.ready.then(() => { layout(); MODE === 'print' ? buildPrint() : show(at, true); });
</script>
</body>
</html>
