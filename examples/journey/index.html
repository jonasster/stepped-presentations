<style>
/* One token block: the theme half from assets/themes, the motion half from assets/motion.
   Keep comments in here free of curly braces; the studio scans this block by text. */
:root{
  /* theme: editorial */
  --theme:editorial;
  --paper:#f6f1e7;
  --ink:#1f1a14;
  --ink-2:#574e44;
  --ink-3:#6a6157;
  --line:#e4dccd;
  --muted:#d3c9b6;
  --outside:#1b1813;
  --accent:#8a2c1d;
  --c1:#8a2c1d;
  --c2:#2d4868;
  --c3:#4f5c22;
  --c4:#6e3f7f;
  --c5:#8a5a12;
  --fill-mix:10%;
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --display-weight:600;
  --display-case:none;
  --display-tracking:-.015em;
  --display-leading:1.04;
  --sans:"Source Serif 4",Georgia,"Times New Roman",serif;
  --mono:"Geist Mono",ui-monospace,Consolas,monospace;
  --label-case:uppercase;
  --label-tracking:.16em;
  --radius:2px;
  --marker-radius:50%;
  --rule:1px;
  /* motion: playful */
  --motion:playful;
  --ease:cubic-bezier(.34,1.45,.64,1);
  --ease-out:cubic-bezier(.16,1,.3,1);
  --t-reveal:.62s;
  --t-fade:.4s;
  --stagger:.16s;
  --rise:0px;
  --travel:1;
  --from-scale:.5;
  --wipe-from:0%;
  --title-anim:none;
  --ambient-opacity:.2;
  --ambient-scale:1.8;
  --ambient-period:4.2s;
  --camera-t:1s;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--outside);color:var(--ink);font-family:var(--sans);overflow:hidden}
/* not tidiness: a UA 1em margin offsets absolutely-positioned elements from
   where top/bottom says, which makes every number in the CSS a lie */
p,h1,h2,h3,ul,ol,figure{margin:0}
a{color:inherit}
img{display:block;max-width:100%}
.display{font-family:var(--display);font-weight:var(--display-weight);
  text-transform:var(--display-case);letter-spacing:var(--display-tracking);
  line-height:var(--display-leading)}
.meta{font-family:var(--mono);font-weight:500;text-transform:var(--label-case);
  letter-spacing:var(--label-tracking)}

/* ---- the stage: one logical canvas, scaled once ---- */
#viewport{position:fixed;inset:0}
#stage{width:1920px;height:1080px;position:absolute;left:50%;top:50%;
       background:var(--paper);overflow:hidden;transform-origin:center}

.slide{position:absolute;inset:0;opacity:0;visibility:hidden;
       transition:opacity var(--t-fade) var(--ease),visibility var(--t-fade)}
.slide.is-active{opacity:1;visibility:visible}

/* ---- title ---- */
#title{padding:0 120px;display:flex;flex-direction:column;justify-content:center}
.kicker{display:flex;align-items:center;gap:14px;font-weight:700;font-size:21px;
        letter-spacing:.34em;color:var(--ink-3)}
.kicker::before{content:"";width:15px;height:15px;border-radius:var(--marker-radius);
                background:var(--accent)}
#title h1{margin-top:26px;font-size:112px;max-width:16ch}
#title .lede{margin-top:26px;max-width:60ch;font-size:21px;line-height:1.55;color:var(--ink-2)}
/* the scene's own heading, small and out of the way */
.scene-head{position:absolute;left:120px;top:80px;z-index:5}
.scene-head .kicker{font-size:17px}
.scene-head h2{margin-top:14px;font-size:52px}

/* ---- the stepped scene: a road wider than the canvas, and a camera ----
   The camera is one registered custom property, --pan. Everything on the road sits at
   its own x plus --pan, and the road's SVG group shifts by the same amount. No element is
   wider than the canvas, so print (one page per step) is never shrunk to fit a long track. */
@property --pan{syntax:"<length>";inherits:true;initial-value:0px}
#scene{position:absolute;inset:0;overflow:hidden;--pan:0px;
       transition:--pan var(--camera-t) var(--ease-out)}
#road{position:absolute;inset:0;width:1920px;height:1080px}
#world{transform:translateX(var(--pan))}
/* the way ahead is a faint dotted line; the way travelled is drawn on in the stop's colour */
.ahead{fill:none;stroke:var(--muted);stroke-width:4;stroke-dasharray:2 14;stroke-linecap:round}
.leg{fill:none;stroke:var(--c);stroke-width:6;stroke-linecap:round;opacity:.7;
     stroke-dasharray:var(--len);stroke-dashoffset:var(--len);
     transition:stroke-dashoffset var(--t-reveal) var(--ease-out)}
.leg.on{stroke-dashoffset:0}

.stop{position:absolute;width:52px;height:52px;border-radius:var(--marker-radius);background:var(--c);
      color:var(--paper);display:grid;place-items:center;font-size:17px;font-weight:600;
      transform:translate(-50%,-50%) scale(.4);opacity:0;z-index:3;
      transition:transform var(--t-reveal) var(--ease),opacity var(--t-fade) var(--ease)}
.stop.on{transform:translate(-50%,-50%) scale(1);opacity:1;transition-delay:var(--stagger)}
.stop.now::after{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--c);
                 z-index:-1;animation:halo var(--ambient-period) var(--ease-out) infinite}
@keyframes halo{0%{transform:scale(1);opacity:var(--ambient-opacity)}
                70%,100%{transform:scale(var(--ambient-scale));opacity:0}}

.card{position:absolute;width:380px;padding:4px 0 0 22px;border-left:3px solid var(--c);
      opacity:0;z-index:2;clip-path:inset(0 var(--wipe-from) 0 0);
      transform:translate(calc(-50% + var(--sx,0px) * var(--travel)),
                          calc(var(--sy,0px) * var(--travel) + var(--rise)))
                scale(var(--from-scale));
      transition:opacity var(--t-fade) var(--ease),transform var(--t-reveal) var(--ease),
                 clip-path var(--t-reveal) var(--ease)}
.card.on{opacity:1;transform:translate(-50%,0) scale(1);clip-path:inset(0 0 0 0);
         transition-delay:calc(var(--stagger) * 2)}
.card .when{font-size:14px;color:var(--c)}
.card h3{margin-top:10px;font-size:46px;color:var(--ink)}
/* longhands: in the shorthand, a --title-anim of none is read as the fill mode */
.card.on h3{animation-name:var(--title-anim);animation-duration:var(--t-reveal);
            animation-timing-function:steps(var(--chars,12));animation-fill-mode:both;
            animation-delay:calc(var(--stagger) * 2)}
@keyframes type{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.card p{margin-top:10px;font-size:21px;line-height:1.45;color:var(--ink-2)}

/* ---- presenter chrome: on hover, readable over any theme ---- */
#progress{position:fixed;left:0;bottom:0;height:2px;background:var(--accent);width:0;
          transition:width var(--t-fade) var(--ease);z-index:50}
#chrome{position:fixed;left:0;right:0;bottom:16px;display:flex;justify-content:center;gap:9px;
        opacity:0;transition:opacity .25s;z-index:50}
#viewport:hover~#chrome,#chrome:hover{opacity:1}
#chrome button{font-family:var(--mono);font-size:12px;color:var(--ink-2);cursor:pointer;
  background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:7px 13px}

/* ---- ?still: a frozen position, used by the presenter previews and print ---- */
.still *,.still *::before,.still *::after{transition:none!important;animation:none!important}
.still #chrome,.still #progress{display:none}

/* ---- ?presenter: notes, next step, timer. Drives the audience window ---- */
#presenter{display:none}
.presenter body{overflow:auto;background:#16171c;color:#e9e8e4}
.presenter #viewport,.presenter #chrome,.presenter #progress{display:none}
.presenter #presenter{display:grid;grid-template-columns:3fr 2fr;gap:20px;padding:20px;
  min-height:100vh;font-family:system-ui,sans-serif}
#presenter iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:6px;background:#000}
#presenter .side{display:flex;flex-direction:column;gap:14px}
#presenter .tag{font:600 11px/1 ui-monospace,monospace;letter-spacing:.2em;
  text-transform:uppercase;color:#8d8c88;margin-bottom:6px}
#pNotes{font-size:22px;line-height:1.5;white-space:pre-wrap;margin-top:6px}
#pClock{display:flex;gap:18px;font:600 30px/1 ui-monospace,monospace}
#pClock span{cursor:pointer}

/* ---- ?print: one page per position, then the browser's Save as PDF ---- */
#print{display:none}
.print body{overflow:visible;background:#fff}
.print #chrome,.print #progress{display:none}
/* not display:none: the live stage is what layout() measures before it is cloned */
.print #viewport{position:absolute;width:0;height:0;overflow:hidden;visibility:hidden}
.print #print{display:block}
/* contain:paint as well as overflow:hidden: a camera track wider than the canvas must not
   widen the printed document, or the browser shrinks every page to fit it */
.page{position:relative;width:1920px;height:1080px;overflow:hidden;contain:paint;break-after:page}
.page.notes{height:1440px}
.page #stage{position:relative;left:0;top:0;transform:none!important}
.page .note{position:absolute;left:0;right:0;top:1080px;bottom:0;padding:44px 120px;
  font:24px/1.5 var(--sans);color:#222;white-space:pre-wrap;border-top:1px solid #ddd}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition-duration:.001s!important}
  .stop.now::after{content:"";position:absolute;inset:-9px;border-radius:inherit;
                   border:2px solid var(--c);background:none;opacity:.5}
}
</style>
</head>
<body>
<div id="viewport"><div id="stage">

  <section class="slide is-active" id="title">
    <p class="kicker meta">Engineering · how we work</p>
    <h1 class="display">The life of a bug report</h1>
    <p class="lede">Seven stops between a customer's email and the reply that closes it.
      Two days, five people, and one test that will catch it next time.</p>
  </section>

  <section class="slide" id="s-scene">
    <div class="scene-head"><p class="kicker meta">One bug, start to finish</p>
      <h2 class="display">From report to reply</h2></div>
    <div id="scene"><svg id="road" viewBox="0 0 1920 1080"><g id="world"></g></svg></div>
  </section>

</div></div>

<div id="chrome">
  <button id="bPrev" type="button">← back</button>
  <button id="bNext" type="button">next →</button>
  <button id="bReset" type="button">reset (R)</button>
  <button id="bAll" type="button">show all (F)</button>
  <button id="bNotes" type="button">presenter (P)</button>
</div>
<div id="progress"></div>

<div id="presenter">
  <div><p class="tag">Now</p><iframe id="pNow" title="Current"></iframe></div>
  <div class="side">
    <div id="pClock"><span id="pElapsed" title="Click to restart">00:00</span><span id="pTime"></span>
      <span id="pCount"></span></div>
    <div><p class="tag">Next</p><iframe id="pNext" title="Next"></iframe></div>
    <div><p class="tag">Notes</p><div id="pNotes"></div></div>
  </div>
</div>
<div id="print"></div>

<script>
/* ── modes: ?still freezes a position, ?presenter and ?print build their own views ─ */
const Q = new URLSearchParams(location.search);
const MODE = Q.has('print') ? 'print' : Q.has('presenter') ? 'presenter' : Q.has('still') ? 'still' : 'deck';
if (MODE !== 'deck') document.documentElement.classList.add(MODE === 'print' ? 'still' : MODE, MODE);
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const stage = document.getElementById('stage');
const slides = [...document.querySelectorAll('.slide')];

/* ── content: everything on screen comes from here ───────────────────────── */
const TITLE_NOTES = "This is one real bug from last spring, lightly edited. Nothing heroic happens, which is the point.";
const SCENE_NOTES = "The road is the bug's life. Watch how many hands it passes through.";
const STOPS = [
  { id:"reported", name:"Reported",   when:"Tuesday 09:12",  color:"var(--c1)",
    desc:"A customer writes in: the export button does nothing at all.",
    notes:"It came in through the normal support form. No escalation, no shouting." },
  { id:"triaged", name:"Triaged",    when:"Tuesday 09:40",  color:"var(--c2)",
    desc:"Support reproduces it on a big account and tags it exports, high.",
    notes:"Twenty-eight minutes. Support can reproduce because they have a test account the size of a real one." },
  { id:"reproduced", name:"Reproduced", when:"Tuesday 11:05",  color:"var(--c3)",
    desc:"An engineer finds it only fails above ten thousand rows.",
    notes:"The real find. Without the row count, this would have been 'works on my machine'." },
  { id:"fixed", name:"Fixed",      when:"Tuesday 15:30",  color:"var(--c4)",
    desc:"The export now streams the file instead of building it in memory.",
    notes:"A small change. The hard part was the morning, not the afternoon." },
  { id:"reviewed", name:"Reviewed",   when:"Wednesday 10:15", color:"var(--c5)",
    desc:"A second pair of eyes, and a test that exports fifty thousand rows.",
    notes:"The test is the lasting value. This bug cannot come back quietly." },
  { id:"shipped", name:"Shipped",    when:"Thursday 08:00", color:"var(--c1)",
    desc:"Out in the morning release, with nothing special about it.",
    notes:"No hotfix. The normal release was soon enough, so we used it." },
  { id:"thanked", name:"Thanked",    when:"Thursday 08:20", color:"var(--c2)",
    desc:"The customer hears back from the person who fixed it.",
    notes:"The engineer wrote the reply. That is the habit I want us to keep." }
];
const STEPS = STOPS.length;
const NOTES = STOPS.map(s => s.notes);

/* ── geometry: named constants, so the reasoning survives ────────────────── */
const TRACK_W = 3690;                // the road's length; the camera never pans past its end
const X0 = 360, GAP = 470;            // stops along the road; the last one sits at 3180
const HIGH = 480, LOW = 640;          // the road weaves between two heights
/* cards sit on the side away from the road: above a high stop, below a low one */
const CARD_GAP = 46;                  // from a stop's centre to its card's nearest edge
const yOf = i => i % 2 ? LOW : HIGH, xOf = i => X0 + i * GAP;
/* the camera follows rather than centres: it moves only when a card would cross the right
   edge, and then parks the previous stop at the left margin, so no card is ever cut in half */
const EDGE_R = 1440, LEAD = 100;

/* ── build once ──────────────────────────────────────────────────────────── */
const scene = document.getElementById('scene'), road = document.getElementById('world');
const NS = 'http://www.w3.org/2000/svg';
/* a soft S between neighbouring stops: horizontal tangents at both ends */
const leg = (i) => { const [x0, y0, x1, y1] = [xOf(i - 1), yOf(i - 1), xOf(i), yOf(i)], h = (x1 - x0) / 2;
  return `M${x0},${y0} C${x0 + h},${y0} ${x1 - h},${y1} ${x1},${y1}`; };
const ahead = document.createElementNS(NS, 'path');
ahead.setAttribute('class', 'ahead');
ahead.setAttribute('d', STOPS.map((s, i) => i ? leg(i).replace(/^M[^C]*/, '') : `M${xOf(0)},${yOf(0)}`).join(' '));
road.append(ahead);
STOPS.forEach((s, i) => {
  if (i) {
    const p = document.createElementNS(NS, 'path');
    p.setAttribute('class', 'leg'); p.setAttribute('d', leg(i)); p.dataset.i = i;
    p.style.setProperty('--c', s.color);
    road.append(p);
  }
  scene.insertAdjacentHTML('beforeend',
    `<div class="stop meta" data-i="${i}" style="left:calc(${xOf(i)}px + var(--pan));top:${yOf(i)}px;--c:${s.color}">${i + 1}</div>
     <div class="card" data-i="${i}" style="left:calc(${xOf(i) + 190}px + var(--pan));--c:${s.color}">
       <p class="when meta">${s.when}</p>
       <h3 class="display" style="--chars:${s.name.length}">${s.name}</h3><p>${s.desc}</p></div>`);
});

function layout(){
  road.querySelectorAll('.leg').forEach(p => p.style.setProperty('--len', p.getTotalLength()));
  scene.querySelectorAll('.card').forEach(el => {
    const i = +el.dataset.i, h = el.offsetHeight;
    const top = i % 2 ? LOW + CARD_GAP : HIGH - CARD_GAP - h;
    el.style.top = top + 'px';
    // Playful's fly-out: each card leaves its own stop
    el.style.setProperty('--sx', (-190) + 'px');
    el.style.setProperty('--sy', (yOf(i) - top - h / 2) + 'px');
  });
}

/* the pan is derived from the step too: replay the follow rule from the start, so
   ←, a deep link and print all land on the same framing as walking forward did */
function panFor(n){
  let pan = 0;
  for (let k = 0; k <= n; k++) {
    const cx = xOf(k) + 190;           // frame the card, not just the dot
    if (cx + pan > EDGE_R) pan = -(xOf(k - 1) - LEAD);
    pan = Math.max(Math.min(pan, 0), -(TRACK_W - 1920));
  }
  return pan;
}

/* ── the step machine: everything derived from `step`, never incremented ─── */
let step = -1;
function applyStep(n){
  step = Math.max(-1, Math.min(n, STEPS - 1));
  scene.querySelectorAll('.stop,.card').forEach(el => {
    el.classList.toggle('on', +el.dataset.i <= step);
    el.classList.toggle('now', +el.dataset.i === step);
  });
  road.querySelectorAll('.leg').forEach(p => p.classList.toggle('on', +p.dataset.i <= step));
  scene.style.setProperty('--pan', panFor(step) + 'px');
}

/* ── the sequence: every position in the deck, in presenting order ───────────
   The presenter view, print and deep links all speak in positions, so they work
   on any deck that can list its positions and show one. */
const SCENE = 1;
const SEQ = [{ slide:0, step:-1, notes:TITLE_NOTES }];
for (let k = reduced ? STEPS - 1 : -1; k < STEPS; k++)
  SEQ.push({ slide:SCENE, step:k, notes: k < 0 ? SCENE_NOTES : NOTES[k] });

let at = 0, peer = null;
function show(i, fromPeer){
  at = Math.max(0, Math.min(i, SEQ.length - 1));
  const p = SEQ[at];
  slides.forEach((s, k) => s.classList.toggle('is-active', k === p.slide));
  applyStep(p.slide === SCENE ? p.step : -1);
  document.getElementById('progress').style.width = (at / (SEQ.length - 1) * 100) + '%';
  if (MODE === 'deck') history.replaceState(null, '', '#' + at);
  if (MODE === 'presenter') renderPresenter();
  if (!fromPeer && peer && !peer.closed) peer.postMessage({ deck:'show', at }, '*');
}
const first = () => SEQ.findIndex(p => p.slide === SEQ[at].slide);
const last  = () => SEQ.map(p => p.slide).lastIndexOf(SEQ[at].slide);

addEventListener('message', e => {
  if (!e.data || e.data.deck !== 'show') return;
  if (e.source !== parent) peer = e.source;     // a reopened presenter finds us again
  show(e.data.at, true);
});

/* ── keys and buttons ────────────────────────────────────────────────────── */
function openPresenter(){
  peer = open(location.pathname + '?presenter#' + at, 'deck-presenter', 'popup,width=1280,height=760');
}
function openPrint(){ open(location.pathname + '?print' + (SEQ.some(p => p.notes) ? '=notes' : '')); }
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  if (k === 'ArrowRight' || k === ' ' || k === 'PageDown'){ e.preventDefault(); show(at + 1); }
  if (k === 'ArrowLeft' || k === 'PageUp'){ e.preventDefault(); show(at - 1); }
  if (k === 'r' || k === 'R') show(first());
  if (k === 'f' || k === 'F') show(last());
  if (k === 'p' && MODE === 'deck') openPresenter();
  if (k === 'P' && MODE === 'deck') openPrint();
});
bNext.onclick = () => show(at + 1); bPrev.onclick = () => show(at - 1);
bReset.onclick = () => show(first()); bAll.onclick = () => show(last());
bNotes.onclick = openPresenter;

/* ── presenter view ──────────────────────────────────────────────────────── */
let t0 = Date.now();
function renderPresenter(){
  const post = (f, i) => f.contentWindow && f.contentWindow.postMessage({ deck:'show', at:i }, '*');
  post(pNow, at); post(pNext, Math.min(at + 1, SEQ.length - 1));
  pNext.style.opacity = at + 1 < SEQ.length ? 1 : .25;
  pNotes.textContent = SEQ[at].notes || '—';
  pCount.textContent = (at + 1) + ' / ' + SEQ.length;
}
if (MODE === 'presenter'){
  peer = opener;
  const still = location.pathname + '?still#';
  pNow.src = still + at; pNext.src = still + (at + 1);
  pNow.onload = pNext.onload = renderPresenter;
  pElapsed.onclick = () => t0 = Date.now();
  const tick = () => {
    const s = Math.floor((Date.now() - t0) / 1000);
    pElapsed.textContent = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
    pTime.textContent = new Date().toTimeString().slice(0, 5);
  };
  tick(); setInterval(tick, 1000);
}

/* ── print: freeze each position, clone the stage onto its own page ──────── */
/* Chrome counts an element past the canvas edge when it sizes the printed document, even
   though the stage clips it, and then shrinks every page to fit. So each copy leaves out
   what cannot be seen anyway: anything wholly off the canvas, and anything not yet revealed.
   What is left must stay inside the canvas, which verification.md already asks for. */
function dropOffCanvas(live, copy){
  const box = live.getBoundingClientRect(), b = copy.querySelectorAll('*');
  live.querySelectorAll('*').forEach((el, i) => {
    const r = el.getBoundingClientRect();
    const off = r.right <= box.left || r.left >= box.right || r.bottom <= box.top || r.top >= box.bottom;
    if ((r.width && off) || getComputedStyle(el).opacity === '0') b[i].style.display = 'none';
  });
}
function buildPrint(){
  const withNotes = Q.get('print') === 'notes';
  const css = document.createElement('style');
  css.textContent = `@page{size:1920px ${withNotes ? 1440 : 1080}px;margin:0}`;
  document.head.append(css);
  const out = document.getElementById('print');
  SEQ.forEach((p, i) => {
    show(i, true);
    const page = document.createElement('div');
    page.className = 'page' + (withNotes ? ' notes' : '');
    const copy = stage.cloneNode(true);
    dropOffCanvas(stage, copy);
    page.append(copy);
    if (withNotes) page.insertAdjacentHTML('beforeend', '<div class="note"></div>');
    if (withNotes) page.lastChild.textContent = p.notes || '';
    out.append(page);
  });
  document.getElementById('viewport').style.display = 'none';   // measured and cloned; now out of the way
  if (!navigator.webdriver) setTimeout(print, 300);
}

/* ── fit the canvas ──────────────────────────────────────────────────────── */
function fitStage(){
  const k = Math.min(innerWidth / 1920, innerHeight / 1080);
  stage.style.transform = `translate(-50%,-50%) scale(${k})`;
}
addEventListener('resize', fitStage);
fitStage();

layout();
show(+location.hash.slice(1) || 0, true);
/* text-derived measurements are wrong until the real faces are in */
document.fonts.ready.then(() => { layout(); MODE === 'print' ? buildPrint() : show(at, true); });
</script>
</body>
</html>
