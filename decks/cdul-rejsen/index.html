<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tre huse, én rolle — CDUL-rejsen</title>
<!-- selvhostede fonte: intet hentes fra nettet, dækket kører offline -->
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/deck.css">
</head>
<body>
<div id="viewport"><div id="stage">
  <div id="meta"><span id="phase"></span><span id="clock"></span><span id="count"></span><button id="bTheme" type="button"

  <div id="deck"></div>
  <div id="index"></div>
</div></div>

<div id="chrome">

  <button id="bFull" type="button">fuldskærm (F)</button>
