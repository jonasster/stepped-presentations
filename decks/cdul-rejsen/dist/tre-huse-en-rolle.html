:root{
  /* de fire epokefarver. Alt andet accentfarvet peger herind */
  --c-hum:#137a5e; --c-ias:#4a2fe0; --c-its:#0c6aa8; --c-nu:#a8327d;

  --shell:#12121a;      /* uden for lærredet */
  --paper:#eff1f5;      /* lærredet */
  --surface:#fff;       /* kort, bobler, kasser i diagrammerne */
  --surface-2:#e8eaf1;  /* chips, taster, serverenheder */
  --face:#fff;          /* bygningsflader i landsbyen på forsiden */
  --quote:#f2f4f8;      /* citater og linkkort på lyse bobler */
  --hairline:#c2c7d4;   /* de tynde streger i diagrammerne */
  --hover:#e3e6ee;      /* rækker i indholdsoversigten */
  /* tekst og flader der ligger OVENPÅ accentfarven. I lyst tema er accenten
     mørk og teksten hvid; i mørkt tema er den lys, og så skal teksten vendes */
  --on-accent:#fff;
  --on-accent-2:rgba(255,255,255,.74);
  --on-accent-veil:rgba(255,255,255,.13);
  --on-accent-edge:rgba(255,255,255,.28);

  --pos:#137a5e;        /* vundet */
  --neg:#b6304b;        /* mistet, og den overklippede linje */

  --ink:#1b1a35;
  --ink-2:#565b6c;
  --ink-3:#63677a;
  --line:#dde1e9;
  --accent:var(--c-ias);
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --sans:"Geist","Segoe UI",system-ui,sans-serif;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --ease:cubic-bezier(.2,.75,.25,1);
}
/* et slide eller en spalte får sin farve ved at bære en af disse */
.acc-hum{--accent:var(--c-hum)}
.acc-ias{--accent:var(--c-ias)}
.acc-its{--accent:var(--c-its)}
.acc-nu{--accent:var(--c-nu)}

/* ── mørkt tema ──────────────────────────────────────────────────────────── */
/* Accenterne løftes: de mættede farver fra det lyse tema forsvinder mod en
   mørk baggrund. Flader, streger og blæk vендes om, resten arver. */
[data-theme="dark"]{
  --c-hum:#35b98f; --c-ias:#8b74ff; --c-its:#4aa8e8; --c-nu:#e070b8;
  --shell:#05050a;
  --paper:#14141c;
  --surface:#1e1e29;
  --surface-2:#2a2a37;
  --face:#2f2f3f;
  --quote:#2a2a37;
  --hairline:#414152;
  --hover:#2a2a37;
  --pos:#35b98f;
  --neg:#e05c78;
  --ink:#edeff6;
  --ink-2:#a6aaba;
  --ink-3:#8a90a1;
  --line:#32323f;
  --on-accent:#10101a;
  --on-accent-2:rgba(0,0,0,.6);
  --on-accent-veil:rgba(0,0,0,.13);
  --on-accent-edge:rgba(0,0,0,.24);
}
/* portrættet er fotograferet på lys baggrund og ville lyse som en lampe */
[data-theme="dark"] .me-face{filter:brightness(.82) contrast(1.04)}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--shell);color:var(--ink);font-family:var(--sans);overflow:hidden}
p,h1,h2,h3,ul,ol,figure,dl{margin:0}
img{display:block;max-width:100%}

#viewport{position:fixed;inset:0}
#stage{width:1920px;height:1080px;position:absolute;left:50%;top:50%;
       background:var(--paper);overflow:hidden;transform-origin:center;
       transition:background-color .25s linear}

.slide{position:absolute;inset:0;padding:96px 130px 110px;display:flex;flex-direction:column;
       opacity:0;visibility:hidden;transform:translateY(18px);
       transition:opacity .38s var(--ease),visibility .38s,transform .46s var(--ease)}
.slide.is-active{opacity:1;visibility:visible;transform:none}

/* ── fælles hoved ────────────────────────────────────────────────────────── */
.kicker{display:flex;align-items:center;gap:14px;font-family:var(--mono);font-weight:700;
        font-size:18px;letter-spacing:.34em;text-transform:uppercase;color:var(--ink-3)}
.kicker::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--accent)}
.slide h2{margin-top:20px;font-family:var(--display);font-weight:800;font-size:86px;
          line-height:.96;text-transform:uppercase;max-width:24ch}
.lede{margin-top:18px;max-width:92ch;font-size:26px;line-height:1.45;color:var(--ink-2)}
.slide-head{flex:none;min-height:200px}
.slide.has-lede .slide-head{min-height:264px}
.body{flex:1 1 auto;min-height:0;margin-top:52px}

/* ── afsløring ───────────────────────────────────────────────────────────── */
.rv{opacity:0;transition:opacity .34s var(--ease),transform .44s var(--ease)}
.rv.on{opacity:1}

/* ── 1 · forsiden ────────────────────────────────────────────────────────── */
.k-title{padding:96px 130px;display:block}
.t-grid{height:100%;display:grid;grid-template-columns:830px 1fr;gap:60px;align-items:center}
.k-title h1{margin-top:22px;font-family:var(--display);font-weight:800;font-size:150px;
            line-height:.88;text-transform:uppercase;max-width:11ch}
.t-lede{margin-top:28px;font-size:29px;max-width:32ch;color:var(--ink-2)}
.t-meta{margin-top:36px;font-family:var(--mono);font-weight:500;font-size:21px;
        letter-spacing:.02em;color:var(--ink)}

/* Landsbyen: tre huse, og CDUL der flytter ind i dem på skift. Markøren tager
   husets farve, så man kan se rammen smitte af på afdelingen. 12 sekunder. */
.t-anim{justify-self:center;text-align:center}
.vil{width:700px;height:438px}
.b0{--c:var(--c-hum)} .b1{--c:var(--c-ias)} .b2{--c:var(--c-its)}

.vil .grund{fill:var(--line)}
.vil .flade{fill:var(--face)}
/* skyggerne ligger fast ovenpå fladen, så den samme farve giver tre nuancer */
.vil .skygge{pointer-events:none}
.vil .skygge.lys{fill:#000;opacity:.10}
.vil .skygge.dyb{fill:#000;opacity:.24}
.vil .rude{fill:#fff;opacity:.5}
.vil .v-navn{font-family:var(--display);font-weight:800;font-size:34px;
             text-transform:uppercase;fill:var(--ink-3)}
.vil .v-aar{font-family:var(--mono);font-weight:700;font-size:19px;fill:var(--ink-3)}

/* det aktive hus lyser op, og navn og årstal følger med */
.vil .bld .flade{animation:husOn 12s var(--ease) infinite}
.vil .bld .grund{animation:grundOn 12s var(--ease) infinite}
.vil .bld .v-navn,.vil .bld .v-aar{animation:husTekst 12s var(--ease) infinite}
/* .vil skal med: uden den er disse vælgere mindre specifikke end reglerne
   ovenfor, hvis animation-genvej nulstiller forsinkelsen til nul */
.vil .b1 .flade,.vil .b1 .grund,.vil .b1 .v-navn,.vil .b1 .v-aar{animation-delay:-8s}
.vil .b2 .flade,.vil .b2 .grund,.vil .b2 .v-navn,.vil .b2 .v-aar{animation-delay:-4s}
@keyframes husOn{0%,25%{fill:var(--c)}33%,100%{fill:var(--face)}}
@keyframes grundOn{0%,25%{fill:var(--c);opacity:.34}33%,100%{fill:var(--line);opacity:1}}
@keyframes husTekst{0%,25%{fill:var(--c)}33%,100%{fill:var(--ink-3)}}

/* markøren: flytter ind i huset, og skifter farve til husets */
.mover text{font-family:var(--mono);font-weight:700;font-size:22px;
            fill:var(--on-accent);letter-spacing:.1em}
.mover{animation:flyt 12s var(--ease) infinite}
.mover rect{animation:flytFarve 12s var(--ease) infinite}
@keyframes flyt{
  0%      {transform:translate(150px,136px);opacity:0}
  5%,25%  {transform:translate(150px,136px);opacity:1}
  33%,58% {transform:translate(360px,112px);opacity:1}
  66%,92% {transform:translate(570px,88px); opacity:1}
  97%,100%{transform:translate(570px,88px); opacity:0}
}
@keyframes flytFarve{
  0%,25%  {fill:var(--c-hum)}
  33%,58% {fill:var(--c-ias)}
  66%,100%{fill:var(--c-its)}
}
.t-anim-cap{margin-top:14px;font-family:var(--mono);font-weight:700;font-size:19px;
            letter-spacing:.3em;text-transform:uppercase;color:var(--ink-3)}

/* ── kort på række ───────────────────────────────────────────────────────── */
.num{font-family:var(--mono);font-weight:700;font-size:17px;color:var(--accent);
     letter-spacing:.1em;flex:none}
.cards{flex:0 0 auto;margin:auto 0;display:flex;gap:var(--gap);align-items:stretch}
.card{padding:32px 34px 38px;background:var(--surface);border:1px solid var(--line);border-radius:16px;
      border-top:3px solid var(--accent);transform:translateY(14px)}
.card.on{transform:none}
.card h3{margin-top:16px;font-family:var(--display);font-weight:800;font-size:44px;
         line-height:1.02;text-transform:uppercase}
.card p{margin-top:16px;font-size:23px;line-height:1.5;color:var(--ink-2)}

/* ── hvem der står og taler ──────────────────────────────────────────────── */
/* teksten bliver stående i dækkets venstremargen; portrættet lægger sig i
   hjørnet, så dette slide stadig flugter med alle de andre */
.me-head{display:flex;align-items:center;gap:56px}
.me-head > div{min-width:0}
.me-face{width:196px;height:196px;flex:none;margin-left:auto;border-radius:50%;
         object-fit:cover;background:var(--surface);border:3px solid var(--accent)}
.me{display:grid;grid-template-columns:780px 1fr;gap:60px;align-items:center;min-height:0}
.me-cols{display:flex;flex-direction:column;gap:30px}
.me-block{padding-top:18px;border-top:1px solid var(--line);transform:translateY(10px)}
.me-block:first-child{padding-top:0;border-top:0}
.me-block.on{transform:none}
.me-lab{font-family:var(--mono);font-weight:700;font-size:16px;letter-spacing:.26em;
        text-transform:uppercase;color:var(--accent)}
.me-block ul{margin:12px 0 0;padding:0;list-style:none;
             display:flex;flex-direction:column;gap:9px}
.me-block li{position:relative;padding-left:26px;font-size:24px;line-height:1.38;
             color:var(--ink-2)}
.me-block li::before{content:"";position:absolute;left:0;top:11px;width:11px;height:2px;
                     background:var(--accent)}

/* fire evighedsmaskiner. De peger ikke på et trin, men på en person, så de
   kører hele tiden i stedet for kun på .on */
.me-anim{justify-self:center}
.nerd{width:698px;height:550px}
.nerd .n-cap{font-family:var(--mono);font-weight:700;font-size:15px;letter-spacing:.24em;
             text-transform:uppercase;fill:var(--ink-3)}

/* uret: sekundviseren fejer, som et mekanisk værk gør */
.nerd .w-case{fill:none;stroke:var(--ink-2);stroke-width:3}
.nerd .w-face{fill:var(--surface)}
.nerd .w-mark{stroke:var(--ink-3);stroke-width:2}
.nerd .w-mark.big{stroke:var(--ink);stroke-width:4}
.nerd .w-hand{stroke:var(--ink);stroke-width:5;stroke-linecap:round;
              transform-box:view-box;transform-origin:150px 112px}
.nerd .w-sec{stroke:var(--accent);stroke-width:2.5;animation:tick 6s linear infinite}
.nerd .w-min{animation:tick 360s linear infinite}
.nerd .w-hour{stroke-width:6;animation:tick 2160s linear infinite}
.nerd .w-pin{fill:var(--accent)}
@keyframes tick{to{transform:rotate(360deg)}}

/* tastaturet: tolv taster, trykket ned i forskudt rækkefølge */
.nerd .kb{fill:var(--surface);stroke:var(--ink-2);stroke-width:3}
.nerd .key rect{fill:var(--surface-2)}
.nerd .key .cap{fill:var(--surface)}
.nerd .key{transform-box:view-box;transform-origin:center;
           animation:press 4s var(--ease) var(--d,0s) infinite}
@keyframes press{0%,88%,100%{transform:translateY(0)}
                 91%{transform:translateY(3px)}94%{transform:translateY(0)}}
.nerd .key.pressed rect{fill:var(--accent)}

/* LEGO: fire klodser falder ned og lander */
.nerd .plate{fill:var(--ink-3)}
.nerd .brick rect{fill:var(--accent)}
.nerd .brick .stud{fill:var(--accent);opacity:.65}
.nerd .b1 rect{opacity:.82}.nerd .b2 rect{opacity:.64}.nerd .b3 rect{opacity:.46}
.nerd .brick{transform-box:view-box}
.nerd .b3{animation:settle 7.5s var(--ease) infinite}
@keyframes settle{0%,8%{transform:translateY(0)}
                  24%,40%{transform:translateY(-15px)}
                  47%,100%{transform:translateY(0)}}

/* serveren: lys der blinker i hver sin takt */
.nerd .rack{fill:var(--surface);stroke:var(--ink-2);stroke-width:3}
.nerd .unit rect{fill:var(--surface-2)}
.nerd .vent{stroke:var(--hairline);stroke-width:2;stroke-linecap:round}
.nerd .led{fill:var(--accent);animation:blink 2.3s steps(1,end) var(--d,0s) infinite}
.nerd .led.alt{animation-duration:3.1s}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.18}}

/* ── taltavler ───────────────────────────────────────────────────────────── */
.facts{flex:0 0 auto;margin:auto 0;display:flex;gap:var(--gap);align-items:flex-start}
.fact{padding-top:26px;border-top:4px solid var(--accent);transform:translateY(14px)}
.fact.on{transform:none}
.fact b{display:block;font-family:var(--mono);font-weight:700;font-size:104px;
        line-height:.86;letter-spacing:-.02em;color:var(--accent)}
.fact p{margin-top:22px;font-size:24px;line-height:1.4;color:var(--ink-2)}

/* ── todelt: trin til venstre, diagram til højre ─────────────────────────── */
.split{display:grid;grid-template-columns:560px 1fr;gap:60px;align-items:center}
.col-steps ol.tight{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:22px}
.trow{display:grid;grid-template-columns:34px 1fr;gap:16px;padding-bottom:22px;
      border-bottom:1px solid var(--line);transform:translateY(8px)}
.trow:last-child{border-bottom:0;padding-bottom:0}
.trow.on{transform:none}
.trow .num{padding-top:6px;font-size:16px}
.trow h3{font-family:var(--display);font-weight:800;font-size:31px;line-height:1.04;
         text-transform:uppercase}
.trow p{margin-top:8px;font-size:19px;line-height:1.45;color:var(--ink-2)}
.scene-box svg{width:100%;height:auto;max-height:540px}

/* ── organisationsdiagrammerne ───────────────────────────────────────────── */
.org .fac rect{fill:var(--surface);stroke:var(--line);stroke-width:2}
.org .fl{font-family:var(--display);font-weight:800;font-size:30px;fill:var(--ink-2);
         text-transform:uppercase}
.org .hub rect{fill:var(--surface);stroke:var(--ink-2);stroke-width:2}
.org .hub .hl{font-family:var(--display);font-weight:800;font-size:38px;fill:var(--ink);
              text-transform:uppercase}
.org .hub .hs2{font-family:var(--mono);font-weight:500;font-size:17px;fill:var(--ink-3)}
.org .hub.ghost rect{stroke:var(--ink-3);stroke-dasharray:8 7;fill:none}
.org .hub.cdul rect{fill:var(--accent);stroke:var(--accent)}
.org .hub.cdul .hl{fill:var(--on-accent)}
.org .fan{fill:none;stroke:var(--hairline);stroke-width:2;
          stroke-dasharray:900;stroke-dashoffset:900}
.slide.is-active .org .fan{animation:fanDraw .85s var(--ease) var(--d,0s) forwards}
@keyframes fanDraw{to{stroke-dashoffset:0}}
/* epoke 1 har stiplede linjer, fordi koblingen var løs. De toner ind i stedet */
.org .fan.dash{stroke-dasharray:6 6;stroke-dashoffset:0;opacity:0}
.slide.is-active .org .fan.dash{animation:fanFade .55s var(--ease) var(--d,0s) forwards}
@keyframes fanFade{to{opacity:1}}
.org .spine{fill:none;stroke:var(--ink-2);stroke-width:2}
.org .chip rect{fill:var(--surface-2);stroke:none}
.org .chip text{font-family:var(--mono);font-weight:700;font-size:18px;fill:var(--ink-2);
                letter-spacing:.06em}
.org .chip.me rect{fill:var(--accent)}
.org .chip.me text{fill:var(--on-accent)}
.org .mepill rect{fill:var(--accent)}
.org .mepill text{font-family:var(--mono);font-weight:700;font-size:19px;fill:var(--on-accent);
                  letter-spacing:.08em}
.org .tick{fill:none;stroke:var(--accent);stroke-width:2}
.org .cap{font-family:var(--mono);font-weight:700;font-size:19px;fill:var(--ink-3);
          letter-spacing:.18em;text-transform:uppercase}

.org .its-box rect{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.org .itl{font-family:var(--display);font-weight:800;font-size:32px;fill:var(--accent);
          text-transform:uppercase}
.org .unit rect{fill:var(--surface-2)}
.org .unit text{font-family:var(--mono);font-weight:500;font-size:16px;fill:var(--ink-2)}
.org .unit.cdul rect{fill:var(--accent)}
.org .unit.cdul text{fill:var(--on-accent);font-weight:700}
.org .unit .big{font-family:var(--display);font-weight:800;font-size:34px;
                letter-spacing:.02em;text-transform:uppercase}
.org .cut rect{fill:none;stroke:var(--hairline);stroke-width:2;stroke-dasharray:8 7}
.org .cut text{font-family:var(--display);font-weight:800;font-size:28px;fill:var(--ink-3);
               text-transform:uppercase}
.org .cutline{fill:none;stroke:var(--hairline);stroke-width:2}
.org .cutline{opacity:0}
.slide.is-active .org .cutline{animation:fanFade .4s var(--ease) .75s forwards}
.org .snip{fill:none;stroke:var(--neg);stroke-width:3;stroke-linecap:round;
           opacity:0;transform-box:fill-box;transform-origin:center}
.slide.is-active .org .snip{animation:snipIn .45s var(--ease) 1.05s forwards}
@keyframes snipIn{0%{opacity:0;transform:scale(.3)}
                  65%{opacity:1;transform:scale(1.25)}100%{opacity:1;transform:scale(1)}}

/* ── tidslinje ───────────────────────────────────────────────────────────── */
.scene{position:absolute;inset:0;margin:0}
.scene > *{position:absolute}
.axis{height:2px;background:var(--line);transform:translateY(-50%) scaleX(0);
      transform-origin:left center}
.slide.is-active .axis{animation:axisIn .7s var(--ease) forwards}
@keyframes axisIn{to{transform:translateY(-50%) scaleX(1)}}
.tknot{width:24px;height:24px;border-radius:50%;background:var(--line);
       transform:translate(-50%,-50%) scale(.5)}
.tknot.on{background:var(--accent);transform:translate(-50%,-50%) scale(1)}
.tname{transform:translate(-50%,-100%);text-align:center;font-family:var(--display);
       font-weight:800;font-size:44px;line-height:1;text-transform:uppercase;color:var(--accent)}
.ttime{transform:translateX(-50%);font-family:var(--mono);font-weight:700;font-size:21px;
       color:var(--ink-3)}
/* kun knuden vi står på pulserer — bevægelsen peger på det jeg taler om nu */
.tknot.on.now::after{content:"";position:absolute;inset:0;border-radius:50%;
  background:var(--accent);animation:halo 3.6s var(--ease) infinite}
@keyframes halo{0%{transform:scale(1);opacity:.22}70%,100%{transform:scale(3);opacity:0}}

/* ── tre spalter: samme rolle, tre slags opgaver ─────────────────────────── */
.shift{display:flex;align-items:stretch;justify-content:space-between;gap:0;margin:auto 0;
       flex:0 0 auto}
.scol{padding:30px 32px 34px;background:var(--surface);border:1px solid var(--line);border-radius:16px;
      border-top:4px solid var(--accent);transform:translateY(14px)}
.scol.on{transform:none}
.s-era{font-family:var(--mono);font-weight:700;font-size:19px;letter-spacing:.16em;
       color:var(--accent)}
.s-home{margin-top:4px;font-family:var(--mono);font-weight:500;font-size:17px;color:var(--ink-3)}
.scol h3{margin-top:18px;min-height:92px;font-family:var(--display);font-weight:800;
         font-size:46px;line-height:1;text-transform:uppercase}
.s-ex{margin-top:22px;padding-top:20px;border-top:1px solid var(--line);
      font-size:22px;line-height:1.5;color:var(--ink-2)}
.s-ex b{display:block;margin-bottom:8px;font-family:var(--mono);font-weight:700;font-size:15px;
        letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3)}
.sarrow{align-self:center;width:var(--gap);text-align:center;font-family:var(--sans);
        font-size:40px;color:var(--ink-3);transform:translateX(-16px)}
.sarrow.on{transform:none}
.sarrow.now,.farrow.now{animation:handoff 2s var(--ease) infinite}
@keyframes handoff{0%,68%,100%{transform:translateX(0)}82%{transform:translateX(10px)}}

/* ── regnskabet ──────────────────────────────────────────────────────────── */
.ledger{display:grid;grid-template-columns:1fr 1fr;gap:70px;align-content:start}
.lcol{padding-top:18px;border-top:4px solid var(--line);display:flex;flex-direction:column;gap:26px}
.lcol.minus{border-top-color:var(--neg)}
.lcol.plus{border-top-color:var(--pos)}
.lhead{font-family:var(--mono);font-weight:700;font-size:19px;letter-spacing:.3em;
       text-transform:uppercase;color:var(--ink-3)}
.lcol.minus .lhead{color:var(--neg)}
.lcol.plus  .lhead{color:var(--pos)}
.lrow{transform:translateX(-10px)}
.lrow.on{transform:none}
.lrow h3{font-family:var(--display);font-weight:800;font-size:38px;line-height:1.04;
         text-transform:uppercase}
.lrow p{margin-top:8px;font-size:22px;line-height:1.48;color:var(--ink-2)}

/* ── opgavelandskabet ────────────────────────────────────────────────────── */
.landscape{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:1fr;gap:30px 30px}
.pile{padding:26px 28px 28px;background:var(--surface);border:1px solid var(--line);border-radius:16px;
      border-left:4px solid var(--accent);transform:translateY(12px);
      display:flex;flex-direction:column}
.pile.on{transform:none}
.pile-top{display:flex;align-items:flex-start;justify-content:space-between;gap:20px}
.pile h3{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.02;
         text-transform:uppercase}
.pile-n{font-family:var(--mono);font-weight:700;font-size:34px;line-height:.9;color:var(--accent)}
.dots{margin-top:14px;display:flex;flex-wrap:wrap;gap:6px}
.dots i{width:14px;height:14px;border-radius:4px;background:var(--accent);
        opacity:0;transform:scale(.3);
        transition:opacity .28s var(--ease),transform .28s var(--ease);
        transition-delay:calc(var(--i) * 38ms)}
.pile.on .dots i{opacity:.32;transform:none}
.pile p{margin-top:14px;font-size:19px;line-height:1.42;color:var(--ink-2)}
/* forklaring på belastningsmåleren, vist én gang lige før opgavekortene */
.lfoot{margin-top:26px;display:flex;align-items:center;gap:26px;
       font-family:var(--mono);font-weight:500;font-size:18px;color:var(--ink-3)}
.lfoot span{display:inline-flex;align-items:center;gap:9px}

/* ── temaslides: pointer øverst, opgavekort nedenunder ───────────────────── */
.tasks{display:grid;grid-template-rows:auto 1fr;gap:34px;min-height:0}
.tpoints{display:grid;grid-template-columns:repeat(3,1fr);gap:40px}
.tpoint{padding-left:20px;border-left:3px solid var(--accent);transform:translateY(8px)}
.tpoint.on{transform:none}
.tpoint h3{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.04;
           text-transform:uppercase}
.tpoint p{margin-top:6px;font-size:19px;line-height:1.42;color:var(--ink-2)}
.tgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;align-content:center}
/* få kort skal ikke klumpe sig øverst i et tomt felt: de får luft i stedet */
.tgrid.roomy{gap:26px}
.tgrid.roomy .tcard{padding:28px 30px 24px}
.tgrid.roomy .tcard h3{font-size:26px;line-height:1.26}
.tgrid.roomy .tw{margin-top:14px;font-size:17px}
.tgrid.roomy .tf{padding-top:26px;font-size:17px}
/* få, tunge opgaver får plads i stedet for at klumpe sig i et hjørne */
.tgrid.wide{align-content:center;gap:40px}
.tgrid.wide .tcard{padding:34px 38px 30px}
.tgrid.wide .tcard h3{font-size:34px;line-height:1.2}
.tgrid.wide .tw{margin-top:16px;font-size:18px}
.tgrid.wide .tf{padding-top:34px;font-size:18px}
.tcard{padding:20px 22px 18px;background:var(--surface);border:1px solid var(--line);border-radius:13px;
       border-top:3px solid var(--accent);display:flex;flex-direction:column;
       transform:translateY(10px)}
.tcard.on{transform:none}
.tcard h3{font-size:22px;line-height:1.28;font-weight:600}
.tw{margin-top:10px;font-family:var(--mono);font-weight:700;font-size:15px;
    letter-spacing:.04em;color:var(--accent)}
.tf{margin-top:auto;padding-top:16px;display:flex;align-items:center;justify-content:space-between;
    gap:12px;font-family:var(--mono);font-weight:500;font-size:15px;color:var(--ink-3)}
.load{display:inline-flex;gap:4px;flex:none}
.load i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--ink-3)}
.load i.f{background:var(--accent);border-color:var(--accent)}

/* ── micros under produktion ─────────────────────────────────────────────── */
.micros{display:flex;align-items:stretch;justify-content:space-between;margin:auto 0;flex:0 0 auto}
.mcol{padding:26px 28px 30px;background:var(--surface);border:1px solid var(--line);border-radius:16px;
      border-top:3px solid var(--accent);transform:translateY(12px)}
.mcol.on{transform:none}
.m-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px}
.m-head h3{font-family:var(--display);font-weight:800;font-size:46px;line-height:1;
           text-transform:uppercase}
.m-head b{font-family:var(--mono);font-weight:700;font-size:32px;color:var(--accent)}
.m-note{margin-top:10px;padding-bottom:18px;border-bottom:1px solid var(--line);
        font-size:18px;line-height:1.4;color:var(--ink-3)}
.mcol ul{margin-top:18px;padding:0;list-style:none;display:flex;flex-direction:column;gap:15px}
/* titlerne løber ind ovenfra og ned, så man ser spalten fylde sig */
.mcol ul li{position:relative;padding-left:23px;font-size:21px;line-height:1.3;
            opacity:0;transform:translateX(-10px);
            transition:opacity .3s var(--ease),transform .3s var(--ease);
            transition-delay:calc(var(--i) * 75ms)}
.mcol.on ul li{opacity:1;transform:none}
.mcol ul li::before{content:"";position:absolute;left:0;top:9px;width:9px;height:9px;
                    border-radius:3px;background:var(--accent)}

/* ── en rigtig tråd ──────────────────────────────────────────────────────── */
.convo{display:grid;grid-template-columns:1000px 1fr;gap:56px;min-height:0}
.thread{display:flex;flex-direction:column;justify-content:center;gap:9px;padding-right:8px}
.msg{max-width:88%;padding:10px 16px 12px;border-radius:14px;background:var(--surface);
     border:1px solid var(--line);transform:translateY(8px)}
.msg.on{transform:none}
.msg.mig{align-self:flex-end;background:var(--accent);border-color:var(--accent)}
.m-meta{font-family:var(--mono);font-weight:700;font-size:13px;letter-spacing:.14em;
        text-transform:uppercase;color:var(--ink-3)}
.msg.mig .m-meta{color:var(--on-accent-2)}
.m-body{margin-top:5px;font-size:16px;line-height:1.36;color:var(--ink)}
.m-body + .m-body{margin-top:9px}
.msg.mig .m-body{color:var(--on-accent)}
.t-note{margin-bottom:4px;font-family:var(--mono);font-weight:500;font-size:15px;
        color:var(--ink-3)}

/* citat af en tidligere besked, som Teams viser det */
.m-quote{margin-bottom:8px;padding:7px 11px;border-left:3px solid var(--on-accent-edge);
         background:var(--on-accent-veil);border-radius:0 8px 8px 0}
.msg.dem .m-quote{border-left-color:var(--line);background:var(--quote)}
.mq-meta{font-family:var(--mono);font-weight:700;font-size:12px;letter-spacing:.1em;
         color:var(--on-accent-2)}
.msg.dem .mq-meta{color:var(--ink-3)}
.m-quote p + p{margin-top:3px;font-size:14px;line-height:1.34;color:var(--on-accent-2)}
.msg.dem .m-quote p + p{color:var(--ink-2)}

/* linkkort: gengiver at der lå en forhåndsvisning i beskeden */
.m-link{margin-top:9px;padding:8px 11px;border-radius:8px;
        background:var(--on-accent-veil);border:1px solid var(--on-accent-edge)}
.msg.dem .m-link{background:var(--quote);border-color:var(--line)}
.ml-t{font-size:14px;line-height:1.3;font-weight:600;color:var(--on-accent)}
.ml-d{margin-top:3px;font-family:var(--mono);font-weight:500;font-size:12px;
      color:var(--on-accent-2)}
.msg.dem .ml-t{color:var(--ink)}
.msg.dem .ml-d{color:var(--ink-3)}
.m-links{margin:8px 0 0;padding-left:19px;display:flex;flex-direction:column;gap:3px}
.m-links li{font-size:15px;line-height:1.32;color:var(--on-accent);text-decoration:underline}
.msg.dem .m-links li{color:var(--ink)}

.tnotes{display:flex;flex-direction:column;justify-content:center;gap:20px}
.tnote{padding-left:20px;border-left:3px solid var(--accent);transform:translateY(8px)}
.tnote.on{transform:none}
.tnote .num{font-size:15px}
.tnote h3{margin-top:5px;font-family:var(--display);font-weight:800;font-size:26px;
          line-height:1.04;text-transform:uppercase}
.tnote p{margin-top:6px;font-size:17px;line-height:1.38;color:var(--ink-2)}

/* ── systemprompten ──────────────────────────────────────────────────────── */
.pdoc-wrap{display:grid;grid-template-columns:600px 1fr;gap:56px;min-height:0}
.pdoc{padding:24px 28px 26px;background:var(--surface);border:1px solid var(--line);border-radius:14px;
      display:flex;flex-direction:column;min-height:0}
.pd-head{font-family:var(--mono);font-weight:700;font-size:15px;letter-spacing:.2em;
         text-transform:uppercase;color:var(--accent);
         padding-bottom:13px;border-bottom:1px solid var(--line)}
.pd-list{margin:12px 0 0;padding:0;list-style:none;
         display:flex;flex-direction:column;gap:0}
.pd-list li{font-family:var(--mono);font-weight:500;font-size:15px;
            line-height:1.38;color:var(--ink-2)}
.pd-list li::before{content:"# ";color:var(--ink-3)}
.pquotes{display:flex;flex-direction:column;justify-content:center;gap:22px}
.pq{transform:translateY(8px)}
.pq.on{transform:none}
.pq blockquote{margin:0;padding-left:20px;border-left:3px solid var(--accent);
               font-family:var(--display);font-weight:800;font-size:32px;line-height:1.04;
               text-transform:uppercase}
.pq blockquote span{display:block;margin-top:5px;font-family:var(--mono);font-weight:500;
                    font-size:16px;letter-spacing:0;text-transform:none;color:var(--ink-3)}
.pq > p{margin-top:9px;padding-left:23px;font-size:18px;line-height:1.42;color:var(--ink-2)}

/* ── afleveringen ────────────────────────────────────────────────────────── */
.offer{display:flex;align-items:stretch;justify-content:space-between;margin:auto 0;flex:0 0 auto}
.ocard{padding:32px 36px 36px;background:var(--surface);border:1px solid var(--line);border-radius:18px;
       border-top:4px solid var(--accent);transform:translateY(14px)}
.ocard.on{transform:none}
.o-tag{font-family:var(--mono);font-weight:700;font-size:16px;letter-spacing:.24em;
       text-transform:uppercase;color:var(--accent)}
.ocard h3{margin-top:16px;font-family:var(--display);font-weight:800;font-size:52px;
          line-height:1;text-transform:uppercase}
.o-what{margin-top:20px;font-size:23px;line-height:1.48;color:var(--ink-2)}
.o-see{margin-top:22px;padding-top:20px;border-top:1px solid var(--line);
       font-size:21px;line-height:1.45}
.o-see b{display:block;margin-bottom:8px;font-family:var(--mono);font-weight:700;font-size:15px;
         letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3)}
.ofoot{flex:none;margin-top:28px;font-family:var(--mono);font-weight:500;font-size:21px;
       color:var(--ink-3)}

/* ── indeksoversigten ────────────────────────────────────────────────────── */
#index{position:absolute;inset:0;z-index:30;background:var(--paper);padding:96px 130px 110px;
       display:flex;flex-direction:column;
       opacity:0;visibility:hidden;transform:translateY(-14px);
       transition:opacity .26s var(--ease),visibility .26s,transform .3s var(--ease)}
#index.open{opacity:1;visibility:visible;transform:none}
.ix-head{font-family:var(--display);font-weight:800;font-size:72px;line-height:1;
         text-transform:uppercase}
.ix-grid{flex:1 1 auto;margin-top:38px;display:grid;grid-template-columns:repeat(3,1fr);
         grid-auto-flow:column;grid-template-rows:repeat(9,auto);gap:4px 44px;align-content:start}
.ix-row{position:relative;display:grid;grid-template-columns:44px 1fr auto;align-items:baseline;gap:14px;
        padding:11px 12px;border:0;border-radius:9px;background:transparent;cursor:pointer;
        text-align:left;font-family:inherit;color:inherit}
.ix-row:hover{background:var(--hover)}
.ix-row b{font-family:var(--mono);font-weight:700;font-size:16px;color:var(--accent)}
/* den korte rute: en prik ved de slides der bærer fortællingen */
.ix-row.core::before{content:"";position:absolute;left:-1px;top:19px;
                     width:8px;height:8px;border-radius:50%;background:var(--accent)}
.ix-t{font-family:var(--display);font-weight:800;font-size:27px;line-height:1.06;
      text-transform:uppercase}
.ix-p{font-family:var(--mono);font-weight:500;font-size:14px;color:var(--ink-3);
      white-space:nowrap}
.ix-hint{flex:none;font-family:var(--mono);font-weight:500;font-size:17px;line-height:1.6;
         color:var(--ink-3)}
.ix-hint b{font-weight:700;color:var(--ink)}

/* ── servicetjekket ──────────────────────────────────────────────────────── */
.flow{display:flex;align-items:stretch;justify-content:space-between;margin:auto 0;flex:0 0 auto}
.fbox{padding:28px 30px 32px;background:var(--surface);border:1px solid var(--line);border-radius:16px;
      border-top:3px solid var(--accent);transform:translateY(12px)}
.fbox.on{transform:none}
.fbox h3{margin-top:14px;min-height:82px;font-family:var(--display);font-weight:800;
         font-size:40px;line-height:1.02;text-transform:uppercase}
.fbox p{margin-top:14px;font-size:21px;line-height:1.48;color:var(--ink-2)}
.farrow{align-self:center;width:var(--gap);text-align:center;font-size:36px;color:var(--ink-3);
        transform:translateX(-16px)}
.farrow.on{transform:none}
/* når hele rækken står: en puls der løber processen igennem, fordi den kører nu */
.slide.done .fbox{animation:seq 5s linear infinite}
@keyframes seq{0%{border-top-color:var(--accent)}
               8%,22%{border-top-color:var(--ink)}
               30%,100%{border-top-color:var(--accent)}}
.slide.done .flow article:nth-of-type(2){animation-delay:1.25s}
.slide.done .flow article:nth-of-type(3){animation-delay:2.5s}
.slide.done .flow article:nth-of-type(4){animation-delay:3.75s}

/* ── opsamlingen: tæt, ensartet, til at skimme ───────────────────────────── */
.sum{display:flex;flex-direction:column;gap:24px;min-height:0}
/* gitteret strækker sig, så opsamlingen fylder lærredet ud i stedet for at
   svæve i midten. Begge rækker er lige høje */
.sum-grid{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:repeat(4,1fr);
          grid-auto-rows:1fr;gap:22px}
.sblock{padding:18px 22px 20px;background:var(--surface);border:1px solid var(--line);
        border-radius:13px;border-top:3px solid var(--accent);transform:translateY(10px);
        display:flex;flex-direction:column}
.sblock.on{transform:none}
.s-lab{font-family:var(--mono);font-weight:700;font-size:14px;letter-spacing:.16em;
       text-transform:uppercase;color:var(--accent)}
.sblock h3{margin-top:6px;font-family:var(--display);font-weight:800;font-size:29px;
           line-height:1.04;text-transform:uppercase}
.s-sub{margin-top:8px;font-size:16px;line-height:1.38;color:var(--ink-2)}

/* modellen fylder den plads der er tilovers, og teksten står i bunden,
   så de otte blokke flugter på tværs af rækken */
.s-art{flex:1 1 auto;min-height:0;display:flex;align-items:center;
       justify-content:center;padding-bottom:14px}
.sa{width:100%;height:100%;max-height:108px}
.sa-face{fill:var(--surface);stroke:var(--line);stroke-width:2}
.sa-box{fill:none;stroke:var(--accent);stroke-width:2}
.sa-dim{fill:var(--hairline)}
.sa-acc{fill:var(--accent)}
.sa-on{fill:var(--on-accent)}
.sa-dot{fill:var(--accent)}
.sa-hair{fill:none;stroke:var(--hairline);stroke-width:2}
.sa-head{fill:var(--hairline)}
.sa-cut{fill:none;stroke:var(--neg);stroke-width:3;stroke-linecap:round}
.sa-split{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:4 6}
.sa-ring{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:7 6;opacity:.55}
.sa-ring-o{fill:none;stroke:var(--accent);stroke-width:2.5}
.sa-tail{fill:var(--surface);stroke:var(--line);stroke-width:2}
.sa-tag{font-family:var(--mono);font-weight:700;font-size:13px;fill:var(--ink-3)}
.sum-end{flex:none;padding-top:18px;border-top:1px solid var(--line);
         font-family:var(--display);font-weight:800;font-size:38px;line-height:1.06;
         text-transform:uppercase;transform:translateY(8px)}
.sum-end.on{transform:none}

/* ── slutbilledet ────────────────────────────────────────────────────────── */
.close{display:flex;flex-direction:column;justify-content:center;gap:34px;position:relative}
.crow{display:grid;grid-template-columns:640px 1fr;gap:56px;align-items:baseline;
      padding-bottom:30px;border-bottom:1px solid var(--line);transform:translateY(10px)}
.crow:last-of-type{border-bottom:0}
.crow.on{transform:none}
.crow h3{font-family:var(--display);font-weight:800;font-size:46px;line-height:1.02;
         text-transform:uppercase}
.crow p{font-size:23px;line-height:1.5;color:var(--ink-2)}
.cq{position:absolute;right:0;bottom:-24px;font-family:var(--display);font-weight:800;
    font-size:120px;line-height:1;text-transform:uppercase;color:var(--accent)}

/* ── vedvarende chrome ───────────────────────────────────────────────────── */
#meta{position:absolute;z-index:10;top:52px;right:130px;display:flex;align-items:baseline;
      gap:26px;font-family:var(--mono);font-weight:500;font-size:19px;color:var(--ink-3)}
#meta #clock{font-weight:700;color:var(--ink)}
/* halv skive: fyldt til venstre, tom til højre. Dæmpet indtil man peger på den */
#bTheme{width:17px;height:17px;padding:0;border:2px solid var(--ink-3);border-radius:50%;
        background:transparent;position:relative;overflow:hidden;cursor:pointer;
        opacity:.45;transition:opacity .2s;align-self:center}
#bTheme::after{content:"";position:absolute;left:0;top:0;bottom:0;width:50%;
               background:var(--ink-3)}
#bTheme:hover{opacity:1}
#progress{position:fixed;left:0;bottom:0;height:3px;background:var(--accent);width:0;
          transition:width .35s var(--ease);z-index:50}
#chrome{position:fixed;left:0;right:0;bottom:16px;display:flex;justify-content:center;gap:9px;
        opacity:0;transition:opacity .25s;z-index:50}
#viewport:hover #chrome{opacity:1}
#chrome button{font-family:var(--mono);font-size:12px;color:#c8cad6;cursor:pointer;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);
  border-radius:6px;padding:7px 13px}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition-duration:.001s!important}
  /* en indikator der forsvinder er en fejl: haloen bliver en stående ring */
  .tknot.on.now::after{opacity:.22;transform:scale(2.4)}
  .axis{transform:translateY(-50%) scaleX(1)}
  .org .fan{stroke-dashoffset:0}
  .org .fan.dash,.org .cutline,.org .snip{opacity:1}
  .pile.on .dots i{opacity:.32;transform:none}
  .mcol.on ul li{opacity:1;transform:none}
  .sarrow.on,.farrow.on{transform:none}
  /* nørderierne fryser på et hvilende billede i stedet for at forsvinde */
  .nerd .brick{transform:none;opacity:1}
  .nerd .led{opacity:1}
  .nerd .key{transform:none}
  .slide.is-active{transform:none}
  /* forsiden fryser på det sidste hus, med CDUL flyttet ind */
  .mover{transform:translate(570px,88px);opacity:1}
  .mover rect{fill:var(--c-its)}
  .b2 .flade{fill:var(--c-its)}
  .b2 .v-navn,.b2 .v-aar{fill:var(--c-its)}
}

</style>
</head>

  <div id="deck"></div>

<div id="chrome">

</div>
<div id="progress"></div>

/* ── Motoren. Alt på skærmen udledes af (si, n) — aldrig muteret fremad. ──── */

const $ = id => document.getElementById(id);
const stage = $('stage'), deckEl = $('deck');
const phaseEl = $('phase'), clockEl = $('clock'), countEl = $('count'), progress = $('progress');
const bNext = $('bNext'), bPrev = $('bPrev'), bAll = $('bAll');
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

const esc = s => String(s == null ? '' : s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

/* ── lærredets faste mål: alle tal nedenfor lever i dette rum ────────────── */
const W = 1920, H = 1080, PAD = 130;
const USABLE = W - PAD * 2;                 /* 1660 */

/* organisationsdiagrammernes eget rum */
const OW = 1040, OH = 540;

/* ── fælles byggeklodser ─────────────────────────────────────────────────── */
function head(s){
  return `<header class="slide-head">
    <p class="kicker">${esc(s.phase)}</p>
    <h2>${esc(s.title)}</h2>
    ${s.lede ? `<p class="lede">${esc(s.lede)}</p>` : ''}
  </header>`;
}

/* kompakt trinliste — venstre spalte på alle todelte slides */
function stepList(s){
  return `<ol class="tight">` + s.steps.map((x, i) => `
    <li class="rv trow" data-i="${i}">
      <b class="num">${i + 1}</b>
      <div><h3>${esc(x.t)}</h3><p>${esc(x.d)}</p></div>
    </li>`).join('') + `</ol>`;
}

/* belastningsmåler: tre prikker, så man kan skimme tyngden uden at læse */
function load(n){
  return `<span class="load" title="arbejdsbelastning ${n} af 3">` +
    [1,2,3].map(i => `<i class="${i <= n ? 'f' : ''}"></i>`).join('') + `</span>`;
}

/* en besked kan rumme et citat, flere afsnit, et linkkort og en punktliste */
function msgBody(m){
  const q = m.quote ? `<div class="m-quote">
      <p class="mq-meta">${esc(m.quote.by)} · ${esc(m.quote.when)}</p>
      <p>${esc(m.quote.t)}</p></div>` : '';
  const paras = (Array.isArray(m.t) ? m.t : [m.t])
    .map(x => `<p class="m-body">${esc(x)}</p>`).join('');
  const link = m.link ? `<div class="m-link">
      <p class="ml-t">${esc(m.link.t)}</p><p class="ml-d">${esc(m.link.d)}</p></div>` : '';
  const list = m.links ? `<ul class="m-links">` +
    m.links.map(l => `<li>${esc(l)}</li>`).join('') + `</ul>` : '';
  return q + paras + link + list;
}

/* ── layout-tegnere, én pr. kind ─────────────────────────────────────────── */
const render = {

  /* 1 · forsiden: teksten til venstre, de tre huse der skifter til højre */
  title(s){
    return `<div class="t-grid">
      <div class="t-text">
        <p class="kicker">${esc(s.phase)}</p>
        <h1>${esc(DECK.title)}</h1>
        <p class="lede t-lede">${esc(DECK.lede)}</p>
        <p class="t-meta">${esc(DECK.meta)}</p>
      </div>
      <div class="t-anim">${villageAnim()}</div>
    </div>`;
  },

  /* vandret række kort */
  cards(s){
    const n = s.steps.length, gap = 26;
    const w = Math.round((USABLE - gap * (n - 1)) / n);
    return head(s) + `<div class="body cards" style="--gap:${gap}px">` +
      s.steps.map((x, i) => `
        <article class="rv card" data-i="${i}" style="width:${w}px">
          <b class="num">${String(i + 1).padStart(2, '0')}</b>
          <h3>${esc(x.t)}</h3>
          <p>${esc(x.d)}</p>
        </article>`).join('') + `</div>`;
  },

  /* hvem der står og taler: et kort cv til venstre, fire nørderier der kører
     til højre. Bevægelsen siger noget her: de fire ting samler jeg faktisk på */
  about(s){
    /* eget hoved, så portrættet kan stå ved siden af navnet */
    return `<header class="slide-head me-head">
      <div>
        <p class="kicker">${esc(s.phase)}</p>
        <h2>${esc(s.title)}</h2>
        <p class="lede">${esc(s.lede)}</p>
      </div>
      <img class="me-face" src="${esc(s.avatar)}" alt="">
    </header>
    <div class="body me">
      <div class="me-cols">` + s.steps.map((x, i) => `
        <section class="rv me-block" data-i="${i}">
          <p class="me-lab">${esc(x.t)}</p>
          <ul>` + x.items.map(it => `<li>${esc(it)}</li>`).join('') + `</ul>
        </section>`).join('') + `</div>
      <div class="me-anim">${nerdAnim()}</div>
    </div>`;
  },

  /* taltavler: tallet først, forklaringen under. Ét tal ad gangen */
  facts(s){
    const n = s.steps.length, gap = 40;
    const w = Math.round((USABLE - gap * (n - 1)) / n);
    return head(s) + `<div class="body facts" style="--gap:${gap}px">` +
      s.steps.map((x, i) => `
        <article class="rv fact" data-i="${i}" style="width:${w}px">
          <b>${esc(x.t)}</b>
          <p>${esc(x.d)}</p>
        </article>`).join('') + `</div>`;
  },

  /* tidslinje: knuderne har hver sin epokefarve */
  timeline(s){
    const n = s.steps.length, X0 = 300, X1 = 1620, AY = 660;
    const col = (X1 - X0) / (n - 1);
    const xOf = i => Math.round(X0 + i * col);
    return head(s) + `<div class="body scene">
      <div class="axis" style="left:${X0}px;width:${X1 - X0}px;top:${AY}px"></div>` +
      s.steps.map((x, i) => `
        <div class="rv tknot ${x.c}" data-i="${i}" style="left:${xOf(i)}px;top:${AY}px"></div>
        <div class="rv tname ${x.c}" data-i="${i}" style="left:${xOf(i)}px;top:${AY - 46}px;width:${Math.round(col)}px">${esc(x.t)}</div>
        <div class="rv ttime ${x.c}" data-i="${i}" style="left:${xOf(i)}px;top:${AY + 38}px">${esc(x.d)}</div>`
      ).join('') + `</div>`;
  },

  /* en epoke: trin til venstre, organisationsdiagram til højre */
  era(s){
    return head(s) + `<div class="body split">
      <div class="col-steps">${stepList(s)}</div>
      <div class="scene-box">${ORG[s.org]()}</div>
    </div>`;
  },

  /* tre spalter side om side, én pr. epoke, med pile imellem */
  shift(s){
    const n = s.steps.length, gap = 74;
    const w = Math.round((USABLE - gap * (n - 1)) / n);
    return head(s) + `<div class="body shift" style="--gap:${gap}px">` +
      s.steps.map((x, i) => `
        <article class="rv scol ${x.c}" data-i="${i}" style="width:${w}px">
          <p class="s-era">${esc(x.era)}</p>
          <p class="s-home">${esc(x.home)}</p>
          <h3>${esc(x.t)}</h3>
          <p class="s-ex"><b>En typisk tirsdag</b>${esc(x.d)}</p>
        </article>` +
        (i < n - 1 ? `<div class="rv sarrow" data-i="${i + 1}">→</div>` : '')
      ).join('') + `</div>`;
  },

  /* regnskabet: tab til venstre, gevinst til højre, rækkerne i fortælleorden */
  ledger(s){
    const cell = side => s.steps.map((x, i) =>
      x.side !== side ? '' : `
        <div class="rv lrow" data-i="${i}">
          <h3>${esc(x.t)}</h3><p>${esc(x.d)}</p>
        </div>`).join('');
    return head(s) + `<div class="body ledger">
      <section class="lcol minus"><p class="lhead">Mistet</p>${cell('tab')}</section>
      <section class="lcol plus"><p class="lhead">Vundet</p>${cell('gevinst')}</section>
    </div>`;
  },

  /* landskabet: seks bunker med antal, afsløret én ad gangen */
  landscape(s){
    return head(s) + `<div class="body landscape">` +
      s.steps.map((x, i) => `
        <article class="rv pile" data-i="${i}">
          <div class="pile-top">
            <h3>${esc(x.t)}</h3>
            <b class="pile-n">${x.n}</b>
          </div>
          <div class="dots">${Array.from({length:x.n},(_,k)=>`<i style="--i:${k}"></i>`).join('')}</div>
          <p>${esc(x.d)}</p>
        </article>`).join('') + `</div>
      <p class="rv lfoot" data-i="${s.steps.length - 1}">Arbejdsbelastning:
        <span>${load(1)} lille</span><span>${load(2)} mellem</span><span>${load(3)} stor</span></p>`;
  },

  /* et tema: pointerne øverst, de faktiske opgavekort nedenunder */
  tasks(s){
    const pts = `<div class="tpoints" style="grid-template-columns:repeat(${s.steps.length},1fr)">`
      + s.steps.map((x, i) => `
      <div class="rv tpoint" data-i="${i}">
        <h3>${esc(x.t)}</h3><p>${esc(x.d)}</p>
      </div>`).join('') + `</div>`;
    const cols = Math.min(4, Math.max(2, s.cards.length));
    const n = s.cards.length;
    const grid = `<div class="tgrid${n <= 2 ? ' wide' : n <= 4 ? ' roomy' : ''}"
                       style="grid-template-columns:repeat(${cols},1fr)">` + s.cards.map(c => `
      <article class="rv tcard" data-i="${c.g}">
        <h3>${esc(c.t)}</h3>
        <p class="tw">${esc(c.w)}</p>
        <p class="tf"><span>${esc(c.dl)}</span>${load(c.l)}</p>
      </article>`).join('') + `</div>`;
    return head(s) + `<div class="body tasks">${pts}${grid}</div>`;
  },

  /* under produktion: én spalte pr. fakultet, så fordelingen er det man ser */
  micros(s){
    const n = s.steps.length, gap = 40;
    const w = Math.round((USABLE - gap * (n - 1)) / n);
    return head(s) + `<div class="body micros" style="--gap:${gap}px">` +
      s.steps.map((x, i) => `
        <section class="rv mcol" data-i="${i}" style="width:${w}px">
          <div class="m-head"><h3>${esc(x.t)}</h3><b>${x.items.length}</b></div>
          <p class="m-note">${esc(x.d)}</p>
          <ul>` + x.items.map((it, k) => `
            <li style="--i:${k}">${esc(it)}</li>`).join('') + `</ul>
        </section>`).join('') + `</div>`;
  },

  /* en rigtig tråd, ord for ord. Beskederne til venstre, pointen til højre */
  thread(s){
    const msgs = s.steps.map((x, i) => x.msgs.map(m => `
      <div class="rv msg ${m.who}" data-i="${i}">
        <p class="m-meta">${esc(m.by)} · ${esc(m.when)}</p>
        ${msgBody(m)}
      </div>`).join('')).join('');
    return head(s) + `<div class="body convo">
      <div class="thread">
        ${s.note ? `<p class="t-note">${esc(s.note)}</p>` : ''}
        ${msgs}
      </div>
      <div class="tnotes">` + s.steps.map((x, i) => `
        <div class="rv tnote" data-i="${i}">
          <b class="num">${String(i + 1).padStart(2, '0')}</b>
          <h3>${esc(x.t)}</h3><p>${esc(x.d)}</p>
        </div>`).join('') + `</div></div>`;
  },

  /* systemprompten: dokumentets form til venstre, det den siger til højre */
  promptdoc(s){
    return head(s) + `<div class="body pdoc-wrap">
      <aside class="pdoc">
        <p class="pd-head">${esc(s.doc.head)}</p>
        <ol class="pd-list">` + s.doc.sections.map(x => `<li>${esc(x)}</li>`).join('') + `</ol>
      </aside>
      <div class="pquotes">` + s.steps.map((x, i) => `
        <div class="rv pq" data-i="${i}">
          <blockquote>${esc(x.q)}${x.alt ? `<span>${esc(x.alt)}</span>` : ''}</blockquote>
          <p>${esc(x.d)}</p>
        </div>`).join('') + `</div></div>`;
  },

  /* afleveringen: to opgaver de kan vælge at følge med i */
  handover(s){
    const n = s.steps.length, gap = 60;
    const w = Math.round((USABLE - gap * (n - 1)) / n);
    return head(s) + `<div class="body offer" style="--gap:${gap}px">` +
      s.steps.map((x, i) => `
        <article class="rv ocard" data-i="${i}" style="width:${w}px">
          <p class="o-tag">Mulighed ${i + 1}</p>
          <h3>${esc(x.t)}</h3>
          <p class="o-what">${esc(x.d)}</p>
          <p class="o-see"><b>I får at se</b>${esc(x.see)}</p>
        </article>`).join('') + `</div>
      <p class="rv ofoot" data-i="${s.steps.length - 1}">${esc(s.foot)}</p>`;
  },

  /* servicetjekket: fire kasser på en linje, med pile */
  flow(s){
    const n = s.steps.length, gap = 64;
    const w = Math.round((USABLE - gap * (n - 1)) / n);
    return head(s) + `<div class="body flow" style="--gap:${gap}px">` +
      s.steps.map((x, i) => `
        <article class="rv fbox" data-i="${i}" style="width:${w}px">
          <b class="num">${String(i + 1).padStart(2, '0')}</b>
          <h3>${esc(x.t)}</h3><p>${esc(x.d)}</p>
        </article>` +
        (i < n - 1 ? `<div class="rv farrow" data-i="${i + 1}">→</div>` : '')
      ).join('') + `</div>`;
  },

  /* opsamlingen: hele dækket som otte tætte blokke og én linje til sidst */
  summary(s){
    return head(s) + `<div class="body sum">
      <div class="sum-grid">` + s.steps.map((x, i) => `
        <article class="rv sblock${x.c ? ' ' + x.c : ''}" data-i="${i}">
          <div class="s-art">${sumArt(x.art)}</div>
          <p class="s-lab">${esc(x.lab)}</p>
          <h3>${esc(x.t)}</h3>
          <p class="s-sub">${esc(x.d)}</p>
        </article>`).join('') + `</div>
      <p class="rv sum-end" data-i="${s.steps.length - 1}">${esc(s.end)}</p>
    </div>`;
  },

  /* slutbilledet: tre linjer, stort sat, og et spørgsmålstegn til sidst */
  close(s){
    return head(s) + `<div class="body close">` +
      s.steps.map((x, i) => `
        <div class="rv crow" data-i="${i}">
          <h3>${esc(x.t)}</h3><p>${esc(x.d)}</p>
        </div>`).join('') +
      `<p class="rv cq" data-i="${s.steps.length - 1}">Spørgsmål?</p></div>`;
  }
};


/* fire små evighedsmaskiner: et ur der går, et tastatur der skrives på,
   et LEGO-tårn der bygger sig selv, og en server med lys i. Alle fire
   kører hele tiden, fordi de ikke peger på et trin men på en person. */
function nerdAnim(){
  /* ur */
  const CX = 150, CY = 112, R = 86;
  let marks = '';
  for (let i = 0; i < 12; i++){
    const a = i * Math.PI / 6, s = i % 3 === 0 ? 58 : 64;
    marks += `<line class="w-mark${i % 3 === 0 ? ' big' : ''}"
      x1="${(CX + Math.sin(a) * s).toFixed(1)}" y1="${(CY - Math.cos(a) * s).toFixed(1)}"
      x2="${(CX + Math.sin(a) * 71).toFixed(1)}" y2="${(CY - Math.cos(a) * 71).toFixed(1)}"/>`;
  }
  const watch = `<g class="tile">
    <circle class="w-case" cx="${CX}" cy="${CY}" r="${R}"/>
    <circle class="w-face" cx="${CX}" cy="${CY}" r="${R - 9}"/>
    ${marks}
    <line class="w-hand w-hour" x1="${CX}" y1="${CY}" x2="${CX}" y2="${CY - 40}"/>
    <line class="w-hand w-min"  x1="${CX}" y1="${CY}" x2="${CX}" y2="${CY - 58}"/>
    <line class="w-hand w-sec"  x1="${CX}" y1="${CY + 14}" x2="${CX}" y2="${CY - 66}"/>
    <circle class="w-pin" cx="${CX}" cy="${CY}" r="4.5"/>
  </g>`;

  /* tastatur: tolv taster, trykket ned i forskudt rækkefølge */
  let keys = '';
  for (let r = 0; r < 3; r++) for (let c = 0; c < 4; c++){
    const i = r * 4 + c;
    keys += `<g class="key" style="--d:${(i * 0.31).toFixed(2)}s">
      <rect x="${362 + c * 66}" y="${62 + r * 38}" width="58" height="30" rx="6"/>
      <rect class="cap" x="${368 + c * 66}" y="${66 + r * 38}" width="46" height="18" rx="4"/>
    </g>`;
  }
  const board = `<g class="tile">
    <rect class="kb" x="350" y="50" width="280" height="130" rx="12"/>
    ${keys}
  </g>`;

  /* LEGO: fire klodser der falder ned og lander oven på hinanden */
  let bricks = '';
  for (let i = 0; i < 4; i++){
    const y = 420 - i * 34, x = 85;
    let studs = '';
    for (let k = 0; k < 4; k++)
      studs += `<rect class="stud" x="${x + 10 + k * 34}" y="${y - 7}" width="22" height="9" rx="3"/>`;
    bricks += `<g class="brick b${i}" style="--d:${(i * 1.15).toFixed(2)}s">
      ${studs}<rect x="${x}" y="${y}" width="150" height="32" rx="4"/></g>`;
  }
  const lego = `<g class="tile">
    <rect class="plate" x="40" y="452" width="240" height="16" rx="4"/>
    ${bricks}
  </g>`;

  /* server: tre enheder med lys der blinker i hver sin takt */
  let units = '';
  for (let i = 0; i < 3; i++){
    const y = 302 + i * 55;
    units += `<g class="unit">
      <rect x="382" y="${y}" width="216" height="44" rx="6"/>
      <circle class="led" cx="400" cy="${y + 22}" r="5" style="--d:${(i * 0.7).toFixed(2)}s"/>
      <circle class="led alt" cx="416" cy="${y + 22}" r="5" style="--d:${(i * 0.7 + 1.1).toFixed(2)}s"/>
      <line class="vent" x1="470" y1="${y + 14}" x2="586" y2="${y + 14}"/>
      <line class="vent" x1="470" y1="${y + 22}" x2="586" y2="${y + 22}"/>
      <line class="vent" x1="470" y1="${y + 30}" x2="586" y2="${y + 30}"/>
    </g>`;
  }
  const server = `<g class="tile">
    <rect class="rack" x="370" y="290" width="240" height="175" rx="10"/>
    ${units}
  </g>`;

  return `<svg class="nerd" viewBox="0 0 660 520" aria-hidden="true">
    ${watch}${board}${lego}${server}
    <text class="n-cap" x="150" y="243" text-anchor="middle">mekaniske ure</text>
    <text class="n-cap" x="490" y="243" text-anchor="middle">tastaturer</text>
    <text class="n-cap" x="160" y="503" text-anchor="middle">lego</text>
    <text class="n-cap" x="490" y="503" text-anchor="middle">hjemmeserver</text>
  </svg>`;
}

/* Otte små modeller til opsamlingen. Hver enkelt genkalder det slide den
   opsummerer, så billedet bærer pointen og teksten kun sætter navn på. */
function sumArt(k){
  const V = (inner) => `<svg class="sa" viewBox="0 0 340 110" aria-hidden="true">${inner}</svg>`;
  const pil = (x1, x2, y) =>
    `<path class="sa-hair" d="M ${x1} ${y} L ${x2 - 9} ${y}"/>
     <path class="sa-head" d="M ${x2 - 10} ${y - 5} L ${x2} ${y} L ${x2 - 10} ${y + 5} Z"/>`;

  if (k === 'lokalt')                    /* alting foregår inde i det samme hus */
    return V(`<rect class="sa-face" x="66" y="10" width="208" height="90" rx="11"/>
      <rect class="sa-acc" x="86" y="30" width="72" height="24" rx="5"/>
      <rect class="sa-dim" x="170" y="30" width="84" height="24" rx="5"/>
      <rect class="sa-dim" x="86" y="64" width="84" height="24" rx="5"/>
      <rect class="sa-dim" x="182" y="64" width="72" height="24" rx="5"/>`);

  if (k === 'tvaers'){                   /* ét center, fire fakulteter */
    const X = [28, 102, 176, 250];
    return V(`<rect class="sa-acc" x="140" y="4" width="60" height="24" rx="6"/>` +
      X.map(x => `<path class="sa-hair" d="M 170 28 L ${x + 31} 76"/>`).join('') +
      X.map(x => `<rect class="sa-face" x="${x}" y="76" width="62" height="26" rx="6"/>`).join(''));
  }

  if (k === 'teknisk'){                  /* inde i ITS, og stadig ud til fakulteterne */
    const C = [31, 103, 175, 247], B = [40, 139, 238];
    return V(`<rect class="sa-box" x="16" y="4" width="308" height="40" rx="9"/>` +
      C.map((x, i) => `<rect class="${i ? 'sa-dim' : 'sa-acc'}" x="${x}" y="13" width="62" height="22" rx="5"/>`).join('') +
      B.map(x => `<path class="sa-hair" d="M 62 44 L ${x + 31} 80"/>`).join('') +
      B.map(x => `<rect class="sa-face" x="${x}" y="80" width="62" height="24" rx="6"/>`).join(''));
  }

  if (k === 'regnskab'){                /* én linje klippet over, fire nye knyttet */
    const SAT = [[178,10],[286,10],[178,82],[286,82]];
    return V(`<rect class="sa-face" x="18" y="8" width="62" height="26" rx="6"/>
      <rect class="sa-face" x="18" y="76" width="62" height="26" rx="6"/>
      <path class="sa-hair" d="M 49 34 L 49 44"/><path class="sa-hair" d="M 49 66 L 49 76"/>
      <path class="sa-cut" d="M 39 45 L 59 65"/><path class="sa-cut" d="M 59 45 L 39 65"/>
      <path class="sa-split" d="M 136 6 L 136 104"/>` +
      /* linjerne først, så knuderne kan lægge sig ovenpå og ikke krydses igennem */
      SAT.map(([x, y]) => `<path class="sa-hair" d="M 254 55 L ${x + 20} ${y + 14}"/>`).join('') +
      SAT.map(([x, y]) => `<rect class="sa-dim" x="${x}" y="${y}" width="40" height="28" rx="6"/>`).join('') +
      `<rect class="sa-acc" x="226" y="41" width="56" height="28" rx="6"/>`);
  }

  if (k === 'moeder'){                   /* lederen: før hver gang, nu hver fjerde */
    const dot = (y, ring) => [0,1,2,3,4,5,6,7].map(i => {
      const x = 74 + i * 33;
      return (ring(i) ? `<circle class="sa-ring-o" cx="${x}" cy="${y}" r="13"/>` : '') +
             `<circle class="sa-dot" cx="${x}" cy="${y}" r="6.5"/>`;
    }).join('');
    return V(`<text class="sa-tag" x="8" y="34">FØR</text>${dot(29, () => true)}
      <text class="sa-tag" x="8" y="87">NU</text>${dot(82, i => i % 4 === 0)}`);
  }

  if (k === 'bunker'){                   /* syv bunker, og hvor tyngden ligger */
    const N = [6, 7, 13, 4, 6, 2, 5];
    return V(N.map((v, i) =>
      `<rect class="${v === 13 ? 'sa-acc' : 'sa-dim'}" x="34" y="${5 + i * 15}"
             width="${Math.round(v / 13 * 276)}" height="9" rx="4.5"/>`).join(''));
  }

  if (k === 'case')                      /* en besked der bliver til en instruktion */
    return V(`<rect class="sa-face" x="8" y="24" width="118" height="58" rx="12"/>
      <path class="sa-tail" d="M 30 82 L 30 98 L 50 82 Z"/>
      <rect class="sa-dim" x="24" y="40" width="86" height="7" rx="3.5"/>
      <rect class="sa-dim" x="24" y="56" width="58" height="7" rx="3.5"/>
      ${pil(138, 172, 55)}
      <rect class="sa-acc" x="182" y="20" width="150" height="70" rx="10"/>
      <rect class="sa-on" x="198" y="36" width="118" height="6" rx="3"/>
      <rect class="sa-on" x="198" y="52" width="94" height="6" rx="3"/>
      <rect class="sa-on" x="198" y="68" width="112" height="6" rx="3"/>`);

  if (k === 'fremad'){                   /* spredt og omskifteligt bliver til et fast sæt */
    const spredt = [[12,16,-14],[54,40,9],[24,72,17],[74,8,6],[96,56,-11],[62,88,13]];
    const fast = [];
    for (let r = 0; r < 2; r++) for (let c = 0; c < 3; c++) fast.push([214 + c * 34, 32 + r * 34]);
    return V(spredt.map(([x,y,r]) =>
        `<rect class="sa-dim" x="${x}" y="${y}" width="20" height="20" rx="4"
               transform="rotate(${r} ${x+10} ${y+10})"/>`).join('') +
      pil(150, 196, 55) +
      fast.map(([x,y]) => `<rect class="sa-acc" x="${x}" y="${y}" width="24" height="24" rx="4"/>`).join(''));
  }
  return '';
}

/* ── forsidens loop: en markør der flytter mellem tre huse ───────────────── */
/* En lille isometrisk landsby. CDUL flytter fra hus til hus, og markøren tager
   husets farve, fordi det er hele dækkets præmis: det er rammen omkring
   afdelingen der afgør hvad opgaven er. */
function villageAnim(){
  const CY = 300, A = 76, T = A + 24;
  const HUS = [
    { cx:150, h:92,  navn:"HUM",     aar:"2020" },
    { cx:360, h:116, navn:"IAS PBL", aar:"2023" },
    { cx:570, h:140, navn:"ITS",     aar:"2026" }
  ];

  /* en kasse i 2:1-isometri: tagflade plus to sider */
  const kasse = (cx, h) => {
    const b = A / 2, ty = CY - h;
    return {
      top:   `${cx},${ty-b} ${cx+A},${ty} ${cx},${ty+b} ${cx-A},${ty}`,
      left:  `${cx-A},${ty} ${cx},${ty+b} ${cx},${CY+b} ${cx-A},${CY}`,
      right: `${cx+A},${ty} ${cx},${ty+b} ${cx},${CY+b} ${cx+A},${CY}`
    };
  };
  /* vinduesbånd med samme skævhed som den flade de ligger på */
  const baand = (cx, h) => {
    const b = A / 2, ty = CY - h;
    let out = '';
    for (let y = 24; y + 13 < h - 12; y += 29){
      out += `<polygon class="rude" points="${cx-A},${ty+y} ${cx},${ty+b+y} ${cx},${ty+b+y+13} ${cx-A},${ty+y+13}"/>`
           + `<polygon class="rude" points="${cx+A},${ty+y} ${cx},${ty+b+y} ${cx},${ty+b+y+13} ${cx+A},${ty+y+13}"/>`;
    }
    return out;
  };

  const byen = HUS.map((x, i) => {
    const k = kasse(x.cx, x.h);
    return `<g class="bld b${i}">
      <polygon class="grund" points="${x.cx},${CY-T/2} ${x.cx+T},${CY} ${x.cx},${CY+T/2} ${x.cx-T},${CY}"/>
      <polygon class="flade" points="${k.top}"/>
      <polygon class="flade" points="${k.left}"/>
      <polygon class="flade" points="${k.right}"/>
      <polygon class="skygge lys" points="${k.left}"/>
      <polygon class="skygge dyb" points="${k.right}"/>
      ${baand(x.cx, x.h)}
      <text class="v-navn" x="${x.cx}" y="382" text-anchor="middle">${x.navn}</text>
      <text class="v-aar"  x="${x.cx}" y="408" text-anchor="middle">${x.aar}</text>
    </g>`;
  }).join('');

  return `<svg class="vil" viewBox="0 0 720 450" aria-hidden="true">
    ${byen}
    <g class="mover">
      <rect x="-62" y="-26" width="124" height="52" rx="10"/>
      <text x="0" y="8" text-anchor="middle">CDUL</text>
    </g>
  </svg>
  <p class="t-anim-cap">samme rolle · nyt hus</p>`;
}

/* ── de tre organisationsdiagrammer ──────────────────────────────────────── */
/* Hvert diagram tegner det samme spørgsmål: hvor sidder CDUL, og hvordan når
   vi ud til fakulteterne? Kun svaret skifter. */

const facBox = (x, y, w, h, name) => `
  <g class="fac"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="12"/>
  <text class="fl" x="${x + w / 2}" y="${y + 38}" text-anchor="middle">${name}</text></g>`;

const ORG = {

  /* 2020–2022 · ét navngivet center, fem adresser */
  hum(){
    const FAC = ['HUM', 'SAMF', 'ENG', 'TECH', 'SUND'];
    const FW = 176, FGAP = 20, FX = 40, FY = 330, FH = 155;
    const fx = i => FX + i * (FW + FGAP);
    let out = '';

    /* det spredte center foroven: stiplet, fordi det ikke har en adresse */
    out += `<g class="hub ghost"><rect x="400" y="30" width="240" height="86" rx="14"/>
      <text class="hl" x="520" y="76" text-anchor="middle">CDUL</text>
      <text class="hs2" x="520" y="102" text-anchor="middle">decentraliseret</text></g>`;

    FAC.forEach((f, i) => {
      out += facBox(fx(i), FY, FW, FH, f);
      out += `<path class="fan dash" style="--d:${(i * .08).toFixed(2)}s" d="M 520 116 L ${fx(i) + FW / 2} ${FY}"/>`;
      const cx = fx(i) + 18;
      out += `<g class="chip${i === 0 ? ' me' : ''}">
        <rect x="${cx}" y="410" width="140" height="44" rx="9"/>
        <text x="${cx + 70}" y="438" text-anchor="middle">CDUL</text></g>`;
    });

    /* hvor jeg selv sad */
    out += `<path class="tick" d="M 128 485 L 128 498"/>
      <g class="mepill"><rect x="78" y="498" width="100" height="38" rx="9"/>
      <text x="128" y="524" text-anchor="middle">mig</text></g>`;

    return `<svg class="org" viewBox="0 0 ${OW} ${OH}" aria-hidden="true">${out}</svg>`;
  },

  /* 2023–2026 · ét center med én adresse, og rækkevidde på tværs */
  ias(){
    const FAC = ['SSH', 'ENG', 'TECH', 'SUND'];
    const FW = 200, FGAP = 40, FX = 60, FY = 350, FH = 100;
    const fx = i => FX + i * (FW + FGAP);
    let out = '';

    out += `<g class="hub"><rect x="380" y="30" width="280" height="76" rx="14"/>
      <text class="hl" x="520" y="78" text-anchor="middle">IAS PBL</text></g>`;
    out += `<path class="spine" d="M 520 106 L 520 150"/>`;
    out += `<g class="hub cdul"><rect x="400" y="150" width="240" height="76" rx="14"/>
      <text class="hl" x="520" y="198" text-anchor="middle">CDUL</text></g>`;

    FAC.forEach((f, i) => {
      out += facBox(fx(i), FY, FW, FH, f);
      out += `<path class="fan" style="--d:${(i * .09).toFixed(2)}s" d="M 520 226 L ${fx(i) + FW / 2} ${FY}"/>`;
    });

    out += `<path class="tick" d="M 360 188 L 400 188"/>
      <g class="mepill"><rect x="258" y="169" width="100" height="38" rx="9"/>
      <text x="308" y="195" text-anchor="middle">mig</text></g>`;
    out += `<text class="cap" x="520" y="500" text-anchor="middle">tværgående · institutionelt</text>`;

    return `<svg class="org" viewBox="0 0 ${OW} ${OH}" aria-hidden="true">${out}</svg>`;
  },

  /* april 2026 → · inde i it-organisationen, og linjen bagud er klippet over */
  its(){
    const FAC = ['SSH', 'ENG', 'TECH', 'SUND'];
    const FW = 200, FGAP = 40, FX = 60, FY = 372, FH = 100;
    const fx = i => FX + i * (FW + FGAP);
    const UNITS = [
      ['CDUL', ''], ['Moodle App.', 'Management'],
      ['IT-infra-', 'struktur'], ['IT-', 'sikkerhed'], ['UX-team', '']
    ];
    const CW = 136, CGAP = 16, CX = 148;
    const cx = i => CX + i * (CW + CGAP);
    let out = '';

    out += `<g class="its-box"><rect x="140" y="20" width="760" height="180" rx="16"/>
      <text class="itl" x="164" y="62">ITS · IT Service</text></g>`;

    UNITS.forEach((u, i) => {
      out += `<g class="unit${i === 0 ? ' cdul' : ''}">
        <rect x="${cx(i)}" y="90" width="${CW}" height="84" rx="10"/>
        ${u[1]
          ? `<text x="${cx(i) + CW / 2}" y="128" text-anchor="middle">${u[0]}</text>
             <text x="${cx(i) + CW / 2}" y="152" text-anchor="middle">${u[1]}</text>`
          : `<text class="big" x="${cx(i) + CW / 2}" y="140" text-anchor="middle">${u[0]}</text>`}
      </g>`;
    });

    FAC.forEach((f, i) => {
      out += facBox(fx(i), FY, FW, FH, f);
      out += `<path class="fan" style="--d:${(i * .09).toFixed(2)}s" d="M ${cx(0) + CW / 2} 174 L ${fx(i) + FW / 2} ${FY}"/>`;
    });

    /* den overklippede linje til det gamle hus */
    out += `<g class="cut">
      <rect x="20" y="258" width="150" height="68" rx="12"/>
      <text x="95" y="300" text-anchor="middle">IAS PBL</text>
      <path class="cutline" d="M 100 258 L 128 232"/>
      <path class="cutline" d="M 156 208 L 184 182"/>
      <path class="snip" d="M 134 214 L 152 232"/>
      <path class="snip" d="M 134 232 L 152 214"/>
    </g>`;

    out += `<text class="cap" x="560" y="518" text-anchor="middle">tættere på systemerne · længere fra forskerne</text>`;

    return `<svg class="org" viewBox="0 0 ${OW} ${OH}" aria-hidden="true">${out}</svg>`;
  }
};

/* ── byg alle slides én gang ─────────────────────────────────────────────── */
deckEl.innerHTML = SLIDES.map((s, i) =>
  `<section class="slide k-${s.kind}${s.lede ? ' has-lede' : ''}${s.accent ? ' ' + s.accent : ''}"
            id="sl-${s.id}" data-si="${i}">
     ${render[s.kind](s)}
   </section>`).join('');

/* springbræt: en oversigt man kan hoppe fra, fordi et interview sjældent
   bevæger sig i den rækkefølge man har planlagt */
const indexEl = $('index');
indexEl.innerHTML = `<p class="ix-head">Indhold</p><div class="ix-grid">` +
  SLIDES.map((s, i) => `
    <button class="ix-row${s.core ? ' core' : ''}" type="button" data-go="${i}">
      <b>${String(i + 1).padStart(2, '0')}</b>
      <span class="ix-t">${esc(s.title || DECK.title)}</span>
      <span class="ix-p">${esc(s.phase)}</span>
    </button>`).join('') +
  `</div><p class="ix-hint">Klik på et punkt, eller tryk <b>O</b> / <b>Esc</b> for at lukke ·
    <b>→</b> næste · <b>←</b> tilbage · <b>↓ ↑</b> hel slide · <b>V</b> vis alt ·
    <b>R</b> forfra · <b>F</b> fuldskærm · <b>D</b> lys eller mørk<br>Prikken markerer den korte rute: de slides
    der bærer fortællingen, hvis klokken løber fra dig.</p>`;

/* Lys eller mørk. Dækket starter altid lyst, medmindre man selv har valgt om:
   en præsentation skal se ens ud hver gang man åbner den, også på en fremmed
   maskine der står i mørkt tema. Valget huskes, hvis browseren tillader det. */
function setTheme(t){
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem('cdul-tema', t); } catch {}
}
function toggleTheme(){
  setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
}
try {
  const gemt = localStorage.getItem('cdul-tema');
  if (gemt) document.documentElement.dataset.theme = gemt;
} catch {}

/* fuldskærm: et tastetryk tæller som den brugerhandling browseren kræver */
function toggleFull(){
  const d = document;
  if (d.fullscreenElement) d.exitFullscreen?.();
  else d.documentElement.requestFullscreen?.().catch(() => {});
}

function toggleIndex(on){
  indexEl.classList.toggle('open', on === undefined ? !indexEl.classList.contains('open') : on);
}
indexEl.addEventListener('click', e => {
  const b = e.target.closest('[data-go]');
  if (!b) return;
  si = +b.dataset.go; n = reduced ? lastStep(si) : -1;
  toggleIndex(false); apply();
});

const slides = [...deckEl.querySelectorAll('.slide')];
const revealables = slides.map(el => [...el.querySelectorAll('.rv')]);

/* ── trinmaskinen ────────────────────────────────────────────────────────── */
let si = 0, n = -1;

const lastStep = i => SLIDES[i].steps.length - 1;
const BEATS = SLIDES.reduce((a, s) => a + s.steps.length + 1, 0);
const beatsBefore = i => SLIDES.slice(0, i).reduce((a, s) => a + s.steps.length + 1, 0);

function apply(){
  si = Math.max(0, Math.min(si, SLIDES.length - 1));
  n  = Math.max(-1, Math.min(n, lastStep(si)));

  slides.forEach((el, i) => {
    el.classList.toggle('is-active', i === si);
    el.classList.toggle('done', i === si && n === lastStep(i) && n > -1);
    if (i === si) revealables[i].forEach(p => {
      p.classList.toggle('on', +p.dataset.i <= n);
      p.classList.toggle('now', +p.dataset.i === n);
    });
  });

  const s = SLIDES[si];
  phaseEl.textContent = s.phase;
  clockEl.textContent = s.clock ? `min. ${s.clock}` : '';
  countEl.textContent = `${si + 1} / ${SLIDES.length}`;
  progress.style.width = ((beatsBefore(si) + n + 2) / BEATS * 100) + '%';

  rememberPlace();
}

/* Så et nedbrud, en genindlæsning eller en sovende maskine ikke koster pladsen
   i dækket. Skrivningen er forsinket, fordi browseren struber history-kald: at
   holde piletasten nede ville ellers ramme loftet og tabe de sidste skridt.
   replaceState kaster desuden på file:// i nogle browsere, deraf try/catch. */
let placeTimer;
function rememberPlace(){
  clearTimeout(placeTimer);
  placeTimer = setTimeout(() => {
    try { history.replaceState(null, '', `#${si}.${n}`); } catch {}
  }, 400);
}

function next(){ n < lastStep(si) ? n++ : (si < SLIDES.length - 1 && (si++, n = reduced ? lastStep(si) : -1)); apply(); }
function prev(){ n > -1 ? n-- : (si > 0 && (si--, n = lastStep(si))); apply(); }
function goSlide(d){ si += d; n = reduced ? lastStep(si) : -1; apply(); }

addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  if (k === 'ArrowRight' || k === ' ' || k === 'PageDown'){ e.preventDefault(); next(); }
  else if (k === 'ArrowLeft' || k === 'PageUp'){ e.preventDefault(); prev(); }
  else if (k === 'ArrowDown'){ e.preventDefault(); goSlide(1); }
  else if (k === 'ArrowUp'){ e.preventDefault(); goSlide(-1); }
  else if (k === 'r' || k === 'R'){ n = -1; apply(); }
  else if (k === 'v' || k === 'V'){ n = lastStep(si); apply(); }
  else if (k === 'f' || k === 'F'){ e.preventDefault(); toggleFull(); }
  else if (k === 'o' || k === 'O'){ e.preventDefault(); toggleIndex(); }
  else if (k === 'd' || k === 'D'){ toggleTheme(); }
  else if (k === 'Escape'){ toggleIndex(false); }
  else if (k === 'Home'){ si = 0; n = -1; apply(); }
});

bNext.onclick = next; bPrev.onclick = prev;
$('bIndex').onclick = () => toggleIndex();
$('bFull').onclick  = toggleFull;
$('bTheme').onclick = toggleTheme;
bAll.onclick  = () => { n = lastStep(si); apply(); };

/* ── skalér lærredet ─────────────────────────────────────────────────────── */
function fitStage(){
  stage.style.transform =
    `translate(-50%,-50%) scale(${Math.min(innerWidth / W, innerHeight / H)})`;
}
addEventListener('resize', fitStage);
fitStage();

/* dybt link ved indlæsning: #slide.trin — apply() holder det opdateret undervejs */
const m = /^#(\d+)(?:\.(-?\d+))?$/.exec(location.hash);
if (m){ si = +m[1]; n = m[2] === undefined ? -1 : +m[2]; }
apply();

</script>
