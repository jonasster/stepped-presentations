<style>
/* ═══ tokens ═══════════════════════════════════════════════════════════════
   Dark canvas. Every accent below clears 4.5:1 as text on --paper; the two
   that are also used as a fill carrying --paper-coloured text are checked in
   the other direction too. Do not "brighten" these — they are tuned for a
   projector in a lit room, not for this monitor. */
:root{
  --paper:#0d0e13;
  --surface:#161822;
  --surface-2:#1d2030;
  --ink:#eceef6;
  --ink-2:#a9aebf;
  --ink-3:#82889d;   /* 5.47:1 on --paper, 5.02 on --surface, 4.58 on --surface-2.
                        It carries real content (captions, labels, notes), so it has to
                        clear 4.5:1 on all three. Do not darken it. */
  --line:#242837;
  --line-2:#333849;

  --c1:#f5b13d;  /* 01 foundations   */
  --c2:#79dd6f;  /* 02 learning      */
  --c3:#5cc8f5;  /* 03 inside an llm */
  --c4:#b39bff;  /* 04 how it's made */
  --c5:#ff7fa8;  /* 05 since chatgpt */
  --c6:#ff6a3d;  /* 06 what's new    */
  --c7:#3fd9bd;  /* 07 around it     */
  --c8:#ffd75e;  /* 08 limits        */

  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --sans:"Geist","Segoe UI",system-ui,sans-serif;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --ease:cubic-bezier(.2,.75,.25,1);
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#06070a;color:var(--ink);font-family:var(--sans);overflow:hidden}
/* not tidiness: a UA 1em margin offsets absolutely-positioned elements from
   where top/bottom says, which makes every number in this file a lie */
p,h1,h2,h3,h4,ul,ol,li,figure{margin:0}
ol,ul{padding:0;list-style:none}
button{font:inherit;color:inherit}

/* ═══ stage ════════════════════════════════════════════════════════════════ */
#viewport{position:fixed;inset:0}
#stage{width:1920px;height:1080px;position:absolute;left:50%;top:50%;
       background:var(--paper);overflow:hidden;transform-origin:center}

.scene{position:absolute;inset:0;opacity:0;visibility:hidden;
       transition:opacity .4s var(--ease),visibility .4s}
.scene.is-active{opacity:1;visibility:visible}
.scene{--c:var(--c1)}
.scene[data-ch="1"]{--c:var(--c1)} .scene[data-ch="2"]{--c:var(--c2)}
.scene[data-ch="3"]{--c:var(--c3)} .scene[data-ch="4"]{--c:var(--c4)}
.scene[data-ch="5"]{--c:var(--c5)} .scene[data-ch="6"]{--c:var(--c6)}
.scene[data-ch="7"]{--c:var(--c7)} .scene[data-ch="8"]{--c:var(--c8)}

/* ═══ shared scene furniture ═══════════════════════════════════════════════ */
.kicker{position:absolute;left:110px;top:92px;font-family:var(--mono);font-weight:700;
        font-size:16px;letter-spacing:.28em;text-transform:uppercase;color:var(--c);
        display:flex;align-items:center;gap:12px}
.kicker::before{content:"";width:9px;height:9px;background:var(--c)}
.s-title{position:absolute;left:110px;top:126px;font-family:var(--display);font-weight:800;
         font-size:76px;line-height:.98;letter-spacing:.004em;text-transform:uppercase;
         max-width:1300px}
.s-lede{position:absolute;left:110px;top:224px;width:960px;font-size:21px;line-height:1.5;
        color:var(--ink-2)}
.s-lede b{color:var(--ink);font-weight:600}
.rule{position:absolute;left:110px;right:110px;height:1px;background:var(--line)}

/* a caption pinned to the bottom of the figure area */
/* the footnote owns the band below y=958; nothing else is allowed into it */
.s-foot{position:absolute;left:110px;top:966px;width:1290px;font-family:var(--mono);
        font-weight:500;font-size:14.5px;line-height:1.55;color:var(--ink-3);
        opacity:0;transition:opacity .4s var(--ease)}
.s-foot.on{opacity:1}
.s-foot b{color:var(--c);font-weight:700}

/* ═══ chrome ═══════════════════════════════════════════════════════════════ */
#rail{position:fixed;left:0;right:0;bottom:0;height:2px;background:rgba(255,255,255,.07);z-index:60}
#rail-fill{display:block;height:100%;width:0;background:var(--rc,#f5b13d);
           transition:width .35s var(--ease),background .4s}
#chrome{position:fixed;left:0;right:0;bottom:18px;display:flex;justify-content:center;gap:8px;
        opacity:0;transition:opacity .25s;z-index:61}
#viewport:hover~#chrome,#chrome:hover{opacity:1}
#chrome button{font-family:var(--mono);font-weight:500;font-size:12px;letter-spacing:.06em;
  color:#c3c7d6;cursor:pointer;background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.13);border-radius:3px;padding:7px 13px}
#chrome button:hover{border-color:rgba(255,255,255,.4)}
#counter{position:fixed;right:22px;bottom:16px;font-family:var(--mono);font-size:12px;
         letter-spacing:.1em;color:var(--ink-3);z-index:61}
#counter b{font-weight:700;color:var(--ink-2)}
#counter i{font-style:normal;padding:0 3px;opacity:.5}

/* ═══ contents menu ════════════════════════════════════════════════════════ */
#menu{position:absolute;inset:0;background:#0a0b10;z-index:40;
      padding:104px 110px 0;opacity:0;visibility:hidden;transition:opacity .3s var(--ease),visibility .3s}
#menu.open{opacity:1;visibility:visible}
#menu[hidden]{display:block}
.menu-head{font-family:var(--mono);font-weight:700;font-size:16px;letter-spacing:.28em;
           text-transform:uppercase;color:var(--ink-3)}
#menu-list{margin-top:44px;display:grid;grid-template-columns:1fr 1fr;gap:0 96px}
#menu-list li{border-top:1px solid var(--line);padding:22px 4px 20px;cursor:pointer;
              display:flex;gap:22px;align-items:baseline}
#menu-list li:hover{border-top-color:var(--mc)}
#menu-list li:hover h4{color:var(--mc)}
#menu-list b{font-family:var(--mono);font-weight:700;font-size:15px;color:var(--mc);
             letter-spacing:.1em;flex:none;width:28px}
#menu-list h4{font-family:var(--display);font-weight:800;font-size:38px;line-height:1;
              text-transform:uppercase;transition:color .2s}
#menu-list p{margin-top:7px;font-size:15px;line-height:1.45;color:var(--ink-3)}
.menu-foot{position:absolute;left:110px;bottom:64px;font-family:var(--mono);font-weight:500;
           font-size:14px;letter-spacing:.06em;color:var(--ink-3)}

/* ═══ too small ════════════════════════════════════════════════════════════ */
#toosmall{position:fixed;inset:0;display:none;place-items:center;background:var(--paper);z-index:90}
#toosmall p{text-align:center;font-family:var(--mono);font-size:15px;line-height:2;color:var(--ink-2)}
body.cramped #toosmall{display:grid}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition-duration:.001s!important}
}

/* ═══ cover ════════════════════════════════════════════════════════════════ */
.sc-cover .cv-kick{position:absolute;left:110px;top:150px;font-family:var(--mono);font-weight:700;
  font-size:17px;letter-spacing:.3em;text-transform:uppercase;color:var(--ink-3)}
.sc-cover .cv-title{position:absolute;left:110px;top:196px;width:1500px;font-family:var(--display);
  font-weight:800;font-size:158px;line-height:.9;letter-spacing:.004em;text-transform:uppercase}
.sc-cover .cv-lede{position:absolute;left:110px;top:566px;width:880px;font-size:24px;
  line-height:1.5;color:var(--ink-2)}
.sc-cover .cv-lede b{color:var(--ink);font-weight:600}
.sc-cover .cv-strip{position:absolute;left:110px;right:110px;top:756px;display:grid;
  grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line)}
.sc-cover .cv-strip span{background:var(--paper);padding:20px 4px 20px 0;font-family:var(--mono);
  font-weight:500;font-size:14px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);
  border-top:2px solid var(--mc)}
.sc-cover .cv-hint{position:absolute;left:110px;bottom:78px;font-family:var(--mono);font-weight:500;
  font-size:15px;letter-spacing:.06em;color:var(--ink-3)}

/* ═══ chapter card ═════════════════════════════════════════════════════════ */
.sc-chapter .ch-num{position:absolute;right:96px;top:104px;font-family:var(--display);
  font-weight:800;font-size:520px;line-height:.78;color:var(--c);opacity:.13;letter-spacing:-.01em}
.sc-chapter .ch-title{position:absolute;left:110px;top:300px;width:1080px;font-family:var(--display);
  font-weight:800;font-size:112px;line-height:.95;text-transform:uppercase;color:var(--c)}
.sc-chapter .ch-lede{position:absolute;left:110px;top:552px;width:860px;font-size:23px;
  line-height:1.5;color:var(--ink-2)}
.sc-chapter .ch-list{position:absolute;left:110px;right:110px;bottom:96px;display:flex;gap:0}
.sc-chapter .ch-list li{flex:1;border-top:1px solid var(--line-2);padding:16px 18px 0 0;
  font-family:var(--mono);font-weight:500;font-size:14.5px;line-height:1.45;color:var(--ink-3)}

/* ═══ points ═══════════════════════════════════════════════════════════════ */
.pt-wrap{position:absolute;left:110px;top:312px;width:1700px}
.pt{display:grid;grid-template-columns:56px 430px 1fr;align-items:start;gap:0 24px;
  border-top:1px solid var(--line);padding:21px 0 19px;
  opacity:0;transform:translateY(14px);
  transition:opacity .4s var(--ease),transform .5s var(--ease)}
.pt.on{opacity:1;transform:none}
.pt b{font-family:var(--mono);font-weight:700;font-size:15px;letter-spacing:.1em;color:var(--c);
  padding-top:9px}
.pt h3{font-family:var(--display);font-weight:800;font-size:40px;line-height:1.02;text-transform:uppercase}
.pt p{font-size:17.5px;line-height:1.5;color:var(--ink-2);padding-top:4px}
.pt p b,.pt h3 b{font-weight:600;color:var(--ink)}
.pt code,.s-lede code,.col code,.fl-node code{font-family:var(--mono);font-weight:500;font-size:.92em;
  color:var(--c);background:var(--surface-2);padding:1px 6px;border-radius:2px}

/* ═══ columns ══════════════════════════════════════════════════════════════ */
.col-wrap{position:absolute;left:110px;right:110px;top:336px;display:flex;gap:26px;
  align-items:stretch;min-height:440px}
.col-wrap.tall{min-height:560px}
.col{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);
  border-top:3px solid var(--c);padding:26px 24px 24px;display:flex;flex-direction:column;
  opacity:0;transform:translateY(20px);
  transition:opacity .4s var(--ease),transform .55s var(--ease)}
.col.on{opacity:1;transform:none}
.col.t-muted{--c:var(--ink-3)}
.col-tag{font-family:var(--mono);font-weight:700;font-size:12px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--c)}
.col h3{margin-top:12px;font-family:var(--display);font-weight:800;font-size:38px;line-height:1;
  text-transform:uppercase}
.col-wrap[data-n="4"] .col h3{font-size:32px}
.col-sub{margin-top:11px;font-size:16.5px;line-height:1.5;color:var(--ink-2)}
.col-wrap[data-n="4"] .col-sub{font-size:15px}
.col ul{margin-top:18px}
.col li{border-top:1px solid var(--line);padding:11px 0 10px;font-size:15.5px;line-height:1.45;
  color:var(--ink-2);display:flex;gap:10px}
.col-wrap[data-n="4"] .col li{font-size:14.5px}
.col li::before{content:"";flex:none;width:7px;height:1px;background:var(--c);margin-top:11px}
.col-note{margin-top:auto;padding-top:18px;font-family:var(--mono);font-weight:500;font-size:13px;
  line-height:1.55;color:var(--ink-3)}
.col b{font-weight:600;color:var(--ink)}

/* ═══ flow ═════════════════════════════════════════════════════════════════ */
.fl-wrap{position:absolute;left:110px;right:110px;top:348px;display:flex;align-items:stretch}
.fl-node{flex:1;min-width:0;min-height:252px;background:var(--surface);border:1px solid var(--line);
  padding:22px 20px;opacity:.16;transform:translateY(10px);
  transition:opacity .4s var(--ease),transform .5s var(--ease),border-color .4s}
.fl-node.on{opacity:1;transform:none}
.fl-node.live{border-color:var(--c)}
.fl-i{font-family:var(--mono);font-weight:700;font-size:12px;letter-spacing:.2em;color:var(--c)}
.fl-node h3{margin-top:12px;font-family:var(--display);font-weight:800;font-size:31px;line-height:1.02;
  text-transform:uppercase}
.fl-node p{margin-top:11px;font-size:15.5px;line-height:1.5;color:var(--ink-2)}
.fl-node b{font-weight:600;color:var(--ink)}
.fl-arrow{flex:none;width:54px;display:grid;place-items:center;opacity:.16;transition:opacity .4s}
.fl-arrow.on{opacity:1}
.fl-arrow svg{width:54px;height:22px;fill:none;stroke:var(--line-2);stroke-width:1.5}
.fl-arrow.on svg{stroke:var(--c)}
/* the live node breathes, so motion always points at what is current */
.fl-node.live .fl-i::after{content:"";display:inline-block;width:6px;height:6px;margin-left:8px;
  background:var(--c);vertical-align:middle;animation:blip 2.6s var(--ease) infinite}
@keyframes blip{0%,100%{opacity:1}50%{opacity:.18}}
.fl-loop{position:absolute;left:110px;right:110px;top:704px;height:96px;opacity:0;
  transition:opacity .45s var(--ease)}
.fl-loop.on{opacity:1}
.fl-loop svg{width:100%;height:96px;fill:none;stroke:var(--c);stroke-width:1.5;
  vector-effect:non-scaling-stroke}
.fl-loop-line{stroke-dasharray:9 7}
.fl-loop.on .fl-loop-line{animation:crawl 3.4s linear infinite}
@keyframes crawl{to{stroke-dashoffset:-32}}
.fl-loop-tag{position:absolute;left:50%;top:60px;transform:translateX(-50%);background:var(--paper);
  padding:0 16px;font-family:var(--mono);font-weight:700;font-size:14px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--c)}

/* ═══ bars ═════════════════════════════════════════════════════════════════ */
.bar-wrap{position:absolute;left:110px;top:344px;width:1700px}
.bar{display:grid;grid-template-columns:330px 1fr 150px 300px;align-items:center;gap:0 22px;
  border-top:1px solid var(--line);padding:22px 0;opacity:0;transform:translateY(12px);
  transition:opacity .4s var(--ease),transform .5s var(--ease)}
.bar.on{opacity:1;transform:none}
.bar.muted{--c:var(--ink-3)}
.bar-l{font-family:var(--mono);font-weight:700;font-size:15px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--ink)}
.bar-t{height:16px;background:var(--surface-2);display:block}
.bar-t i{display:block;height:100%;background:var(--c);transform:scaleX(0);transform-origin:left;
  transition:transform .7s var(--ease) .1s}
.bar.on .bar-t i{transform:scaleX(1)}
.bar-v{font-family:var(--display);font-weight:800;font-size:36px;line-height:1;color:var(--c);
  text-align:right}
.bar-n{font-family:var(--mono);font-weight:500;font-size:13.5px;line-height:1.5;color:var(--ink-3)}

/* ═══ shared: the notes column beside a figure ═════════════════════════════ */
.ne-side,.nw-side,.tk-side,.sp-side,.wd-side,.mo-side{
  position:absolute;left:1250px;top:306px;width:560px}
.side-note,.ne-item{border-top:1px solid var(--line);padding:13px 0 12px;
  opacity:0;transform:translateY(12px);
  transition:opacity .4s var(--ease),transform .5s var(--ease),border-top-color .4s}
.side-note.on,.ne-item.on{opacity:1;transform:none}
.side-note.live,.ne-item.live{border-top-color:var(--c)}
.side-note h3,.ne-item h3{font-family:var(--display);font-weight:800;font-size:28px;line-height:1.02;
  text-transform:uppercase;transition:color .35s}
.side-note.live h3,.ne-item.live h3{color:var(--c)}
.side-note p,.ne-item p{margin-top:6px;font-size:15.5px;line-height:1.46;color:var(--ink-2)}
.side-note b,.ne-item b{font-weight:600;color:var(--ink)}
.side-note code,.ne-item code{font-family:var(--mono);font-size:.9em;color:var(--c)}

/* ═══ nest ═════════════════════════════════════════════════════════════════ */
.ne-box{position:absolute;inset:0}
.ne-ring{position:absolute;border:1.5px solid var(--c);border-radius:3px;
  background:color-mix(in srgb,var(--c) 6%,transparent);
  opacity:0;transform:scale(.94);
  transition:opacity .45s var(--ease),transform .55s var(--ease)}
.ne-ring.on{opacity:1;transform:none}
.ne-ring.core{background:color-mix(in srgb,var(--c) 20%,transparent)}
.ne-ring span{position:absolute;left:13px;top:10px;font-family:var(--mono);font-weight:700;
  font-size:12.5px;letter-spacing:.17em;text-transform:uppercase;color:var(--c);white-space:nowrap}
.ne-ring.core span{left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font-size:14px}

/* ═══ network ══════════════════════════════════════════════════════════════ */
.nw-wrap{position:absolute;left:104px;top:322px;width:1070px;height:620px}
.nw-svg{width:100%;height:560px;display:block;overflow:visible}
.nw-edges line{stroke:var(--line-2);stroke-width:1;opacity:0;
  transition:opacity .5s var(--ease),stroke .5s,stroke-width .5s}
.nw-edges line.on{opacity:.45}
/* once the deck has said "the weights are the learned part", show the spread */
.nw-svg.weighted .nw-edges line.on{stroke:var(--c);opacity:calc(.1 + var(--w) * .62);
  stroke-width:calc(.4px + var(--w) * 2.4px)}
.nw-svg.flowing .nw-edges line.on{stroke-dasharray:5 11;animation:nwflow 2.9s linear infinite}
@keyframes nwflow{to{stroke-dashoffset:-32}}
.nw-node circle{fill:var(--surface-2);stroke:var(--line-2);stroke-width:1.5;
  transition:opacity .45s var(--ease),stroke .45s;opacity:0}
.nw-node.on circle{opacity:1;stroke:var(--c)}
.nw-svg.flowing .nw-node.on circle{animation:nwpulse 3.6s var(--ease) infinite;
  animation-delay:var(--hd)}
@keyframes nwpulse{0%,100%{fill:var(--surface-2)}46%{fill:color-mix(in srgb,var(--c) 42%,var(--surface-2))}}
.nw-labs{position:relative;height:40px;margin-top:6px}
.nw-labs span{position:absolute;top:0;transform:translateX(-50%);font-family:var(--mono);
  font-weight:700;font-size:12px;letter-spacing:.17em;text-transform:uppercase;color:var(--ink-3);
  white-space:nowrap;opacity:0;transition:opacity .4s,color .4s}
.nw-labs span.on{opacity:1;color:var(--c)}

/* ═══ tokens ═══════════════════════════════════════════════════════════════ */
/* optically centred in the 300-958 figure band rather than pinned to its top:
   the chips are only ~170px tall and looked abandoned up there */
.tk-wrap{position:absolute;left:110px;top:436px;width:1070px}
.tk-raw{font-size:34px;line-height:1.35;color:var(--ink);opacity:0;transform:translateY(10px);
  transition:opacity .45s var(--ease),transform .55s var(--ease)}
.tk-raw.on{opacity:1;transform:none}
.tk-row{margin-top:56px;display:flex;flex-wrap:wrap;gap:9px}
.tk{background:var(--surface-2);border:1px solid var(--line-2);padding:11px 13px 10px;
  text-align:center;opacity:0;transform:translateY(-14px) scale(.9);
  transition:opacity .38s var(--ease),transform .5s var(--ease);transition-delay:var(--hd)}
.tk-wrap.split .tk{opacity:1;transform:none}
.tk-t{display:block;font-family:var(--mono);font-weight:700;font-size:21px;color:var(--ink);
  white-space:pre}
.tk-id{display:block;margin-top:7px;font-family:var(--mono);font-weight:500;font-size:12.5px;
  letter-spacing:.06em;color:var(--c);opacity:0;transition:opacity .4s var(--ease) var(--hd)}
.tk-wrap.ids .tk-id{opacity:1}

/* ═══ scatter ══════════════════════════════════════════════════════════════ */
.sp-wrap{position:absolute;left:110px;top:330px;width:1020px}
.sp-svg{width:100%;height:590px;display:block}
.sp-frame{fill:none;stroke:var(--line-2);stroke-width:1}
.sp-grid{stroke:var(--line);stroke-width:1}
.sp-pt{opacity:0;transition:opacity .45s var(--ease)}
.sp-pt.on{opacity:1}
.sp-pt circle{fill:var(--c)}
.sp-pt text{fill:var(--ink-2);font-family:"Geist Mono",monospace;font-weight:500;font-size:14px}
.sp-arrow{fill:none;stroke:var(--ink-2);stroke-width:1.6;stroke-dasharray:7 6;
  opacity:0;transition:opacity .5s var(--ease)}
.sp-arrow.on{opacity:.85}
.sp-arrow-t{fill:var(--ink);font-family:"Geist Mono",monospace;font-weight:700;font-size:14px;
  opacity:0;transition:opacity .5s var(--ease)}
.sp-arrow-t.on{opacity:1}

/* ═══ context window ═══════════════════════════════════════════════════════ */
.wd-wrap{position:absolute;left:110px;top:300px;width:1070px}
.wd-col{display:flex;flex-direction:column;gap:6px;position:relative;z-index:2}
.wd-turn{border-left:3px solid var(--ink-3);background:var(--surface);padding:7px 15px 8px;
  opacity:0;transform:translateY(10px);
  transition:opacity .4s var(--ease),transform .5s var(--ease)}
.wd-turn.on{opacity:1;transform:none}
.wd-turn.t-model{border-left-color:var(--c)}
.wd-turn span{font-family:var(--mono);font-weight:700;font-size:10.5px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--ink-3)}
.wd-turn p{margin-top:3px;font-size:14.5px;line-height:1.3;color:var(--ink-2)}
.wd-turn.on.gone{opacity:.2}
.wd-frame{position:absolute;left:-14px;right:-14px;top:0;height:0;border:1.5px dashed var(--c);
  border-radius:3px;opacity:0;z-index:1;
  transition:opacity .45s var(--ease),top .6s var(--ease),height .6s var(--ease)}
.wd-frame.on{opacity:1}
.wd-frame-t{position:absolute;left:14px;top:-11px;background:var(--paper);padding:0 10px;
  font-family:var(--mono);font-weight:700;font-size:12px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--c)}

/* ═══ trace ════════════════════════════════════════════════════════════════ */
/* optically centred in the figure band; the boxes are always in the DOM, so
   this position does not shift as the trace fills in */
.tr-wrap{position:absolute;left:110px;top:372px;width:1700px}
.tr-q,.tr-a{background:var(--surface);border-left:3px solid var(--ink-3);padding:15px 20px 16px;
  opacity:0;transform:translateY(10px);
  transition:opacity .4s var(--ease),transform .5s var(--ease)}
.tr-a{border-left-color:var(--c);margin-top:20px}
.tr-q.on,.tr-a.on{opacity:1;transform:none}
.tr-q span,.tr-a span{font-family:var(--mono);font-weight:700;font-size:11px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--ink-3)}
.tr-a span{color:var(--c)}
.tr-q p{margin-top:6px;font-size:21px;line-height:1.4;color:var(--ink)}
.tr-a p{margin-top:7px;font-size:20px;line-height:1.45;color:var(--ink)}
.tr-pad{margin-top:20px;border:1px dashed var(--line-2);background:#0b0c11;padding:16px 22px 18px;
  opacity:0;transition:opacity .5s var(--ease),border-color .5s}
.tr-pad.on{opacity:1}
.tr-pad.done{border-style:solid;opacity:.5}
.tr-pad-t{display:block;font-family:var(--mono);font-weight:700;font-size:11px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--ink-3);margin-bottom:12px}
.tr-line{font-family:var(--mono);font-weight:500;font-size:16.5px;line-height:1.85;color:var(--ink-3);
  opacity:0;transform:translateX(-8px);
  transition:opacity .35s var(--ease),transform .4s var(--ease),color .35s}
.tr-line.on{opacity:1;transform:none}
.tr-line.live{color:var(--ink-2)}
.tr-line.live::after{content:"";display:inline-block;width:9px;height:17px;margin-left:7px;
  background:var(--c);vertical-align:-3px;animation:caret 1.1s steps(1) infinite}
@keyframes caret{0%,49%{opacity:1}50%,100%{opacity:0}}

/* ═══ mixture of experts ═══════════════════════════════════════════════════ */
.mo-wrap{position:absolute;left:110px;top:328px;width:1070px;display:flex;gap:42px;
  align-items:flex-start}
.mo-tag{display:block;font-family:var(--mono);font-weight:700;font-size:12px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--ink-3)}
.mo-dense{width:236px;flex:none;opacity:0;transform:translateY(12px);
  transition:opacity .45s var(--ease),transform .55s var(--ease)}
.mo-dense.on{opacity:1;transform:none}
/* a stripe rather than a flat fill: the slab has to read as a solid mass of
   parameters, not an empty placeholder box */
.mo-slab{margin-top:13px;height:322px;border:1px solid var(--line-2);
  background:repeating-linear-gradient(180deg,var(--surface-2) 0 5px,#1b1e2d 5px 10px);
  transition:background .6s var(--ease),border-color .6s}
.mo-dense.hot .mo-slab{border-color:var(--c);
  background:repeating-linear-gradient(180deg,
    color-mix(in srgb,var(--c) 40%,var(--surface-2)) 0 5px,
    color-mix(in srgb,var(--c) 22%,var(--surface-2)) 5px 10px)}
.mo-cap{margin-top:14px;font-family:var(--mono);font-weight:500;font-size:13.5px;line-height:1.6;
  color:var(--ink-3)}
.mo-right{flex:1;min-width:0;opacity:0;transform:translateY(12px);
  transition:opacity .45s var(--ease),transform .55s var(--ease)}
.mo-right.on{opacity:1;transform:none}
.mo-router{margin-top:13px;height:44px;border:1px solid var(--line-2);display:flex;
  align-items:center;padding:0 16px;gap:14px;opacity:.3;transition:opacity .4s,border-color .4s}
.mo-router.on{opacity:1;border-color:var(--c)}
.mo-router b{font-family:var(--mono);font-weight:700;font-size:12px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--c)}
.mo-router i{flex:1;height:1px;background:var(--line-2);position:relative}
.mo-router.on i::after{content:"";position:absolute;top:-2px;left:0;width:26px;height:5px;
  background:var(--c);animation:route 2.8s var(--ease) infinite}
@keyframes route{0%{left:0;opacity:0}12%{opacity:1}88%{opacity:1}100%{left:calc(100% - 26px);opacity:0}}
.mo-grid{margin-top:14px;display:grid;grid-template-columns:repeat(4,1fr);gap:11px}
.mo-x{height:124px;border:1px solid var(--line);background:var(--surface);padding:12px 12px 10px;
  display:flex;flex-direction:column;justify-content:space-between;
  transition:border-color .4s,background .4s}
.mo-x b{font-family:var(--mono);font-weight:700;font-size:12px;letter-spacing:.14em;color:var(--ink-3);
  transition:color .4s}
.mo-x span{font-size:13.5px;line-height:1.35;color:var(--ink-3);transition:color .4s}
.mo-x.lit{border-color:var(--c);background:color-mix(in srgb,var(--c) 13%,var(--surface))}
.mo-x.lit b{color:var(--c)}
.mo-x.lit span{color:var(--ink)}
.mo-tok{position:absolute;left:110px;top:886px;display:flex;align-items:center;gap:14px;
  opacity:0;transition:opacity .4s var(--ease)}
.mo-tok.on{opacity:1}
.mo-tok-l{font-family:var(--mono);font-weight:700;font-size:12px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--ink-3)}
.mo-tok-v{font-family:var(--mono);font-weight:700;font-size:20px;color:var(--c);
  background:var(--surface-2);padding:5px 12px;border:1px solid var(--c)}

/* ═══ timeline ═════════════════════════════════════════════════════════════ */
.sc-timeline .tl-vp{position:absolute;inset:0;overflow:hidden;z-index:1;pointer-events:none}
.sc-timeline .kicker,.sc-timeline .s-title,.sc-timeline .s-lede,.sc-timeline .s-foot{z-index:3}
.tl-vp::before,.tl-vp::after{content:"";position:absolute;top:300px;bottom:0;width:110px;z-index:5}
.tl-vp::before{left:0;background:linear-gradient(90deg,var(--paper),transparent)}
.tl-vp::after{right:0;background:linear-gradient(270deg,var(--paper),transparent)}
.tl-track{position:absolute;left:0;top:0;height:100%;transition:transform 1s cubic-bezier(.3,.7,.2,1)}
.tl-spine{position:absolute;left:0;right:0;top:700px;height:1px;background:var(--line-2)}
.tl-dot{position:absolute;width:15px;height:15px;border-radius:50%;background:var(--c);
  transform:translate(-50%,-50%) scale(.3);opacity:0;z-index:3;
  transition:transform .45s var(--ease),opacity .35s}
.tl-dot.on{transform:translate(-50%,-50%) scale(1);opacity:1}
.tl-dot.big{width:23px;height:23px}
/* ::after carries no base transform of its own, so scaling it is safe */
.tl-dot.on::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--c);
  animation:halo 4.4s var(--ease) infinite;animation-delay:var(--hd,0s)}
@keyframes halo{0%{transform:scale(1);opacity:.3}70%,100%{transform:scale(2.6);opacity:0}}
.tl-date{position:absolute;transform:translateX(-50%);font-family:var(--mono);font-weight:700;
  font-size:14px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap;
  opacity:0;transition:opacity .4s,color .4s}
.tl-date.on{opacity:1}
.tl-date.live{color:var(--c)}
.tl-stem{position:absolute;width:1px;background:var(--line-2);transform:translateX(-50%) scaleY(0);
  transform-origin:top;transition:transform .5s var(--ease)}
.tl-stem.on{transform:translateX(-50%) scaleY(1)}
.tl-card{position:absolute;height:214px;background:var(--surface);border:1px solid var(--line);
  border-top:2px solid var(--c);padding:17px 19px;overflow:hidden;z-index:2;
  opacity:0;transform:translate(-50%,var(--sy)) scale(.9);
  transition:opacity .45s var(--ease),transform .62s var(--ease),border-color .4s}
.tl-card.on{opacity:1;transform:translate(-50%,0) scale(1)}
.tl-card h3{font-family:var(--display);font-weight:800;font-size:28px;line-height:1.02;
  text-transform:uppercase}
.tl-card p{margin-top:9px;font-size:15px;line-height:1.45;color:var(--ink-2)}
.tl-tag{position:absolute;left:19px;bottom:14px;font-family:var(--mono);font-weight:700;
  font-size:11px;letter-spacing:.17em;text-transform:uppercase;color:var(--c)}
.tl-card b{font-weight:600;color:var(--ink)}

/* ═══ recap ════════════════════════════════════════════════════════════════ */
/* two rows of four, optically centred in the band rather than hanging off the
   lede — eight short cards pinned to the top left the page bottom-heavy-empty */
.rc-grid{position:absolute;left:110px;right:110px;top:430px;display:grid;
  grid-template-columns:repeat(4,1fr);gap:52px 26px}
.rc{border-top:2px solid var(--c);padding:16px 0 0;opacity:0;transform:translateY(14px);
  transition:opacity .45s var(--ease),transform .55s var(--ease)}
.rc:nth-child(1){transition-delay:0s} .rc:nth-child(2){transition-delay:.06s}
.rc:nth-child(3){transition-delay:.12s} .rc:nth-child(4){transition-delay:.18s}
.rc:nth-child(5){transition-delay:.24s} .rc:nth-child(6){transition-delay:.3s}
.rc:nth-child(7){transition-delay:.36s} .rc:nth-child(8){transition-delay:.42s}
.rc.on{opacity:1;transform:none}
.rc b{font-family:var(--mono);font-weight:700;font-size:13px;letter-spacing:.14em;color:var(--c)}
.rc h3{margin-top:10px;font-family:var(--display);font-weight:800;font-size:29px;line-height:1.04;
  text-transform:uppercase}
.rc p{margin-top:10px;font-size:15.5px;line-height:1.5;color:var(--ink-2)}

/* ═══ reduced motion: keep the indicators, lose the movement ═══════════════ */
@media (prefers-reduced-motion:reduce){
  .tl-dot.on::after{opacity:.24;transform:scale(1.9)}
  .nw-svg.flowing .nw-edges line.on{stroke-dasharray:5 11}
  .fl-loop.on .fl-loop-line{stroke-dasharray:9 7}
  .mo-router.on i::after{left:calc(50% - 13px);opacity:1}
  .fl-node.live .fl-i::after{opacity:1}
  .tr-line.live::after{opacity:1}
}

</style>
</head>
<body>

<div id="viewport">
  <div id="stage">
    <div id="scenes"></div>

    <nav id="menu" hidden>
      <p class="menu-head">Contents</p>
      <ol id="menu-list"></ol>
      <p class="menu-foot">Esc to close &middot; &larr; &rarr; to move &middot; M for this menu</p>
    </nav>
  </div>
</div>

<div id="chrome">
  <button id="bMenu" type="button">contents (M)</button>
  <button id="bPrev" type="button">&larr; back</button>
  <button id="bNext" type="button">next &rarr;</button>
</div>
<div id="rail"><span id="rail-fill"></span></div>
<p id="counter"><b id="counter-now">0</b><i>/</i><span id="counter-all">0</span></p>

<div id="toosmall">
  <p>This deck is drawn on a fixed 1920&times;1080 canvas.<br>Open it on a larger screen.</p>
</div>

<script>
/* ═══ renderers ════════════════════════════════════════════════════════════
   Each renderer has build(el, sc) -> step count, and step(el, sc, k).
   build() creates every node once; step() only toggles `.on`. Everything is
   derived from k, never incremented, so ← costs nothing. */
window.RENDER = {};
(function(){
'use strict';

/* ── helpers ───────────────────────────────────────────────────────────── */
function h(tag, cls, html){
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (html != null) n.innerHTML = html;
  return n;
}
function head(el, sc){
  if (sc.kicker) el.appendChild(h('p', 'kicker', sc.kicker));
  if (sc.title)  el.appendChild(h('h2', 's-title', sc.title));
  if (sc.lede)   el.appendChild(h('p', 's-lede', sc.lede));
  if (sc.foot)   el.appendChild(h('p', 's-foot', sc.foot));
}
/* the footnote lands on the last step of the scene */
function foot(el, k, n){
  var f = el.querySelector('.s-foot');
  if (f) f.classList.toggle('on', k >= n - 1);
}
function reveal(nodes, k){
  nodes.forEach(function(nd, i){ nd.classList.toggle('on', i < k); });
}
window.RH = { h: h, head: head, foot: foot, reveal: reveal };

/* ═══ cover ════════════════════════════════════════════════════════════════ */
RENDER.cover = {
  build: function(el, sc){
    el.appendChild(h('p', 'cv-kick', sc.kicker));
    el.appendChild(h('h1', 'cv-title', sc.title));
    el.appendChild(h('p', 'cv-lede', sc.lede));
    var strip = h('div', 'cv-strip');
    window.CHAPTERS.forEach(function(c){
      var s = h('span', '', String(c.n).padStart(2, '0') + ' ' + c.title);
      s.style.setProperty('--mc', 'var(--c' + c.n + ')');
      strip.appendChild(s);
    });
    el.appendChild(strip);
    el.appendChild(h('p', 'cv-hint', sc.hint));
    return 1;
  },
  step: function(){}
};

/* ═══ chapter card ═════════════════════════════════════════════════════════ */
RENDER.chapter = {
  build: function(el, sc){
    el.appendChild(h('span', 'ch-num', String(sc.ch).padStart(2, '0')));
    el.appendChild(h('h2', 'ch-title', sc.title));
    el.appendChild(h('p', 'ch-lede', sc.lede));
    var ul = h('ul', 'ch-list');
    (sc.covers || []).forEach(function(t){ ul.appendChild(h('li', '', t)); });
    el.appendChild(ul);
    return 1;
  },
  step: function(){}
};

/* ═══ points — headline plus stepped bullets ═══════════════════════════════ */
RENDER.points = {
  build: function(el, sc){
    head(el, sc);
    var wrap = h('div', 'pt-wrap' + (sc.wide ? ' wide' : ''));
    sc.points.forEach(function(p, i){
      var li = h('div', 'pt');
      /* three direct grid children: number, title, description. Wrapping the
         last two in a div puts the description in the title's column. */
      li.innerHTML = '<b>' + String(i + 1).padStart(2, '0') + '</b><h3></h3><p></p>';
      li.querySelector('h3').innerHTML = p.t;
      li.querySelector('p').innerHTML = p.d;
      wrap.appendChild(li);
    });
    el.appendChild(wrap);
    return sc.points.length + 1;
  },
  step: function(el, sc, k){
    reveal([].slice.call(el.querySelectorAll('.pt')), k);
    foot(el, k, sc.n);
  }
};

/* ═══ columns — 2–4 cards compared ═════════════════════════════════════════ */
RENDER.columns = {
  build: function(el, sc){
    head(el, sc);
    var wrap = h('div', 'col-wrap');
    wrap.dataset.n = sc.cols.length;
    if (sc.tall) wrap.classList.add('tall');
    sc.cols.forEach(function(c){
      var card = h('div', 'col');
      if (c.tone) card.classList.add('t-' + c.tone);
      var lines = (c.lines || []).map(function(l){ return '<li>' + l + '</li>'; }).join('');
      card.innerHTML = '<span class="col-tag"></span><h3></h3><p class="col-sub"></p>' +
                       (lines ? '<ul>' + lines + '</ul>' : '') +
                       (c.note ? '<p class="col-note"></p>' : '');
      card.querySelector('.col-tag').textContent = c.tag || '';
      card.querySelector('h3').innerHTML = c.t;
      card.querySelector('.col-sub').innerHTML = c.sub || '';
      if (c.note) card.querySelector('.col-note').innerHTML = c.note;
      wrap.appendChild(card);
    });
    el.appendChild(wrap);
    return sc.cols.length + 1;
  },
  step: function(el, sc, k){
    reveal([].slice.call(el.querySelectorAll('.col')), k);
    foot(el, k, sc.n);
  }
};

/* ═══ flow — a chain of boxes, optionally looping back ═════════════════════ */
RENDER.flow = {
  build: function(el, sc){
    head(el, sc);
    var wrap = h('div', 'fl-wrap' + (sc.loop ? ' looped' : ''));
    wrap.dataset.n = sc.nodes.length;
    sc.nodes.forEach(function(nd, i){
      if (i) wrap.appendChild(h('div', 'fl-arrow', '<svg viewBox="0 0 54 22">' +
        '<path d="M0 11 H40" /><path d="M34 5 L42 11 L34 17" /></svg>'));
      var b = h('div', 'fl-node');
      b.innerHTML = '<span class="fl-i"></span><h3></h3><p></p>';
      b.querySelector('.fl-i').textContent = String(i + 1).padStart(2, '0');
      b.querySelector('h3').innerHTML = nd.t;
      b.querySelector('p').innerHTML = nd.d;
      wrap.appendChild(b);
    });
    el.appendChild(wrap);
    if (sc.loop){
      var lp = h('div', 'fl-loop', '<svg viewBox="0 0 1000 96" preserveAspectRatio="none">' +
        '<path class="fl-loop-line" d="M978 4 V52 Q978 78 952 78 H48 Q22 78 22 52 V16" />' +
        '<path class="fl-loop-head" d="M14 26 L22 12 L30 26" /></svg>' +
        '<span class="fl-loop-tag"></span>');
      lp.querySelector('.fl-loop-tag').innerHTML = sc.loop;
      el.appendChild(lp);
    }
    return sc.nodes.length + 1 + (sc.loop ? 1 : 0);
  },
  measure: function(el, sc){
    /* node heights depend on the text, which depends on the loaded font, so the
       return arrow is placed from a real measurement rather than a guessed y */
    var lp = el.querySelector('.fl-loop'), wrap = el.querySelector('.fl-wrap');
    if (lp) lp.style.top = (wrap.offsetTop + wrap.offsetHeight + 34) + 'px';
  },
  step: function(el, sc, k){
    var nodes = [].slice.call(el.querySelectorAll('.fl-node')),
        arrows = [].slice.call(el.querySelectorAll('.fl-arrow'));
    nodes.forEach(function(nd, i){
      nd.classList.toggle('on', i < k);
      nd.classList.toggle('live', i === k - 1);
    });
    arrows.forEach(function(a, i){ a.classList.toggle('on', i < k - 1); });
    var lp = el.querySelector('.fl-loop');
    if (lp) lp.classList.toggle('on', k >= sc.nodes.length + 1);
    foot(el, k, sc.n);
  }
};

/* ═══ bars — a quantity per row ════════════════════════════════════════════ */
RENDER.bars = {
  build: function(el, sc){
    head(el, sc);
    var wrap = h('div', 'bar-wrap');
    sc.bars.forEach(function(b){
      var row = h('div', 'bar');
      row.innerHTML = '<span class="bar-l"></span>' +
        '<span class="bar-t"><i style="width:' + b.pct + '%"></i></span>' +
        '<span class="bar-v"></span><span class="bar-n"></span>';
      row.querySelector('.bar-l').innerHTML = b.label;
      row.querySelector('.bar-v').innerHTML = b.value;
      row.querySelector('.bar-n').innerHTML = b.note || '';
      if (b.muted) row.classList.add('muted');
      wrap.appendChild(row);
    });
    el.appendChild(wrap);
    return sc.bars.length + 1;
  },
  step: function(el, sc, k){
    reveal([].slice.call(el.querySelectorAll('.bar')), k);
    foot(el, k, sc.n);
  }
};

})();

</script>
<script>
/* ═══ figure renderers ═════════════════════════════════════════════════════
   The scenes that carry a picture rather than a list. Same contract:
   build(el, sc) -> step count, step(el, sc, k), everything derived from k. */
(function(){
'use strict';
var h = window.RH.h, head = window.RH.head, foot = window.RH.foot, reveal = window.RH.reveal;
var RENDER = window.RENDER;

function svg(tag, attrs){
  var n = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (var a in attrs) n.setAttribute(a, attrs[a]);
  return n;
}

/* ═══ nest — one term inside another ═══════════════════════════════════════
   Concentric boxes, outermost first. Used for AI⊃ML⊃LLM and again for
   model⊃harness⊃product, because it is the same relationship both times. */
RENDER.nest = {
  build: function(el, sc){
    head(el, sc);
    var CX = 548, CY = 622, N = sc.rings.length, OUT = 590, INW = (OUT - 146) / (N - 1);
    var box = h('div', 'ne-box');
    sc.rings.forEach(function(r, i){
      var w = OUT - i * INW;
      var ring = h('div', 'ne-ring');
      ring.style.cssText = 'left:' + Math.round(CX - w / 2) + 'px;top:' + Math.round(CY - w / 2) +
        'px;width:' + Math.round(w) + 'px;height:' + Math.round(w) + 'px;' +
        '--c:var(--' + (r.c || 'ink-3') + ');z-index:' + (i + 1);
      ring.innerHTML = '<span></span>';
      ring.querySelector('span').textContent = r.tag || r.t;
      if (i === N - 1) ring.classList.add('core');
      box.appendChild(ring);
    });
    el.appendChild(box);

    var side = h('div', 'ne-side');
    sc.rings.forEach(function(r){
      var it = h('div', 'ne-item');
      it.style.setProperty('--c', 'var(--' + (r.c || 'ink-3') + ')');
      it.innerHTML = '<h3></h3><p></p>';
      it.querySelector('h3').innerHTML = r.t;
      it.querySelector('p').innerHTML = r.d;
      side.appendChild(it);
    });
    el.appendChild(side);
    return N + 1;
  },
  step: function(el, sc, k){
    reveal([].slice.call(el.querySelectorAll('.ne-ring')), k);
    var items = [].slice.call(el.querySelectorAll('.ne-item'));
    items.forEach(function(it, i){
      it.classList.toggle('on', i < k);
      it.classList.toggle('live', i === k - 1);
    });
    foot(el, k, sc.n);
  }
};

/* ═══ network — what a neural network actually is ══════════════════════════ */
RENDER.network = {
  build: function(el, sc){
    head(el, sc);
    var W = 1040, H = 560, LAYERS = sc.shape || [4, 6, 6, 3],
        X0 = 86, XS = (W - 172) / (LAYERS.length - 1), R = 16;
    var wrap = h('div', 'nw-wrap');
    var s = svg('svg', { viewBox: '0 0 ' + W + ' ' + H, class: 'nw-svg' });

    var pos = LAYERS.map(function(count, li){
      var gap = Math.min(76, (H - 90) / count), top = H / 2 - (count - 1) * gap / 2;
      return Array.from({ length: count }, function(_, ni){
        return [X0 + li * XS, top + ni * gap];
      });
    });

    /* edges first so the nodes sit on top of them */
    var gEdges = svg('g', { class: 'nw-edges' });
    var seed = 7;
    function rnd(){ seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; }
    pos.forEach(function(layer, li){
      if (!li) return;
      pos[li - 1].forEach(function(a){
        layer.forEach(function(b){
          var e = svg('line', { x1: a[0], y1: a[1], x2: b[0], y2: b[1] });
          e.dataset.l = li;
          /* a fixed spread of weights, so "the strengths differ" is shown, not asserted.
             Seeded, not Math.random, so the picture is the same every time. */
          e.style.setProperty('--w', (0.06 + rnd() * 0.94).toFixed(2));
          gEdges.appendChild(e);
        });
      });
    });
    s.appendChild(gEdges);

    pos.forEach(function(layer, li){
      layer.forEach(function(p, ni){
        var g = svg('g', { class: 'nw-node' });
        g.dataset.l = li;
        g.style.setProperty('--hd', ((li * 0.22) + ni * 0.06).toFixed(2) + 's');
        g.appendChild(svg('circle', { cx: p[0], cy: p[1], r: R }));
        s.appendChild(g);
      });
    });
    wrap.appendChild(s);

    var labs = h('div', 'nw-labs');
    (sc.layers || []).forEach(function(t, i){
      var sp = h('span', '', t);
      sp.dataset.l = i;
      /* position each label on its own layer's x rather than spreading them
         evenly — an even spread only happens to line up at four layers */
      sp.style.left = ((X0 + i * XS) / W * 100).toFixed(3) + '%';
      labs.appendChild(sp);
    });
    wrap.appendChild(labs);
    el.appendChild(wrap);

    var side = h('div', 'nw-side');
    sc.notes.forEach(function(nt){
      var it = h('div', 'side-note');
      it.innerHTML = '<h3></h3><p></p>';
      it.querySelector('h3').innerHTML = nt.t;
      it.querySelector('p').innerHTML = nt.d;
      side.appendChild(it);
    });
    el.appendChild(side);
    return sc.notes.length + 1;
  },
  step: function(el, sc, k){
    /* how much of the net is up is declared per step in the data */
    var show = k ? (sc.show[k - 1] || 0) : 0;
    el.querySelectorAll('.nw-node').forEach(function(n){
      n.classList.toggle('on', +n.dataset.l < show);
    });
    el.querySelectorAll('.nw-edges line').forEach(function(e){
      e.classList.toggle('on', +e.dataset.l < show);
    });
    el.querySelectorAll('.nw-labs span').forEach(function(s){
      s.classList.toggle('on', +s.dataset.l < show);
    });
    var g = el.querySelector('.nw-svg');
    g.classList.toggle('weighted', k >= (sc.weightAt || 99));
    g.classList.toggle('flowing', k >= (sc.flowAt || 99));
    var notes = [].slice.call(el.querySelectorAll('.side-note'));
    notes.forEach(function(nt, i){
      nt.classList.toggle('on', i < k);
      nt.classList.toggle('live', i === k - 1);
    });
    foot(el, k, sc.n);
  }
};

/* ═══ tokens — text becomes numbers ════════════════════════════════════════ */
RENDER.tokens = {
  build: function(el, sc){
    head(el, sc);
    var wrap = h('div', 'tk-wrap');
    wrap.appendChild(h('p', 'tk-raw', '&ldquo;' + sc.raw + '&rdquo;'));
    var row = h('div', 'tk-row');
    sc.toks.forEach(function(t, i){
      var c = h('div', 'tk');
      c.style.setProperty('--hd', (i * 0.04).toFixed(2) + 's');
      c.innerHTML = '<span class="tk-t"></span><span class="tk-id"></span>';
      /* a leading space is part of the token; show it as a middle dot or it
         reads as a word boundary that is not there */
      c.querySelector('.tk-t').textContent = t[0].replace(/ /g, '·');
      c.querySelector('.tk-id').textContent = t[1];

  },
  step: function(el, sc, k){
    var w = el.querySelector('.tk-wrap');

/* ═══ scatter — meaning as coordinates ═════════════════════════════════════ */
RENDER.scatter = {
  build: function(el, sc){
    head(el, sc);
    var W = 1000, H = 578;
    var wrap = h('div', 'sp-wrap');
    var s = svg('svg', { viewBox: '0 0 ' + W + ' ' + H, class: 'sp-svg' });
    s.appendChild(svg('rect', { x: .5, y: .5, width: W - 1, height: H - 1, class: 'sp-frame' }));
    for (var i = 1; i < 6; i++){
      s.appendChild(svg('line', { x1: i * W / 6, y1: 0, x2: i * W / 6, y2: H, class: 'sp-grid' }));
      s.appendChild(svg('line', { x1: 0, y1: i * H / 6, x2: W, y2: i * H / 6, class: 'sp-grid' }));
    }
    if (sc.arrow){
      var a = svg('path', { class: 'sp-arrow', d: sc.arrow.d });
      s.appendChild(a);
      var at = svg('text', { class: 'sp-arrow-t', x: sc.arrow.tx, y: sc.arrow.ty });
      at.textContent = sc.arrow.t;
      s.appendChild(at);
    }
    sc.groups.forEach(function(g, gi){
      g.pts.forEach(function(p){
        var node = svg('g', { class: 'sp-pt' });
        node.dataset.g = gi;
        node.style.setProperty('--c', 'var(--' + (g.c || 'ink-3') + ')');
        node.appendChild(svg('circle', { cx: p[0], cy: p[1], r: 7 }));
        var tx = svg('text', { x: p[0] + 15, y: p[1] + 5 });
        tx.textContent = p[2];
        node.appendChild(tx);
        s.appendChild(node);
      });
    });
    wrap.appendChild(s);
    el.appendChild(wrap);

    var side = h('div', 'sp-side');
    sc.groups.forEach(function(g){
      var it = h('div', 'side-note');
      it.style.setProperty('--c', 'var(--' + (g.c || 'ink-3') + ')');
      it.innerHTML = '<h3></h3><p></p>';
      it.querySelector('h3').innerHTML = g.t;
      it.querySelector('p').innerHTML = g.d;
      side.appendChild(it);
    });
    el.appendChild(side);
    return sc.groups.length + 1 + (sc.arrow ? 1 : 0);
  },
  step: function(el, sc, k){
    el.querySelectorAll('.sp-pt').forEach(function(p){ p.classList.toggle('on', +p.dataset.g < k); });
    var notes = [].slice.call(el.querySelectorAll('.side-note'));
    notes.forEach(function(n, i){ n.classList.toggle('on', i < k); n.classList.toggle('live', i === k - 1); });
    var ar = el.querySelector('.sp-arrow'), at = el.querySelector('.sp-arrow-t');
    if (ar){
      var on = k > sc.groups.length;
      ar.classList.toggle('on', on); at.classList.toggle('on', on);
    }
    foot(el, k, sc.n);
  }
};

/* ═══ window — the context window, and what falls out of it ════════════════ */
RENDER.window = {
  build: function(el, sc){
    head(el, sc);
    var wrap = h('div', 'wd-wrap');
    var col = h('div', 'wd-col');
    sc.turns.forEach(function(t, i){
      var b = h('div', 'wd-turn t-' + t.who);
      b.dataset.i = i;
      b.innerHTML = '<span></span><p></p>';
      b.querySelector('span').textContent = t.who === 'you' ? 'you' : 'model';
      b.querySelector('p').innerHTML = t.t;
      col.appendChild(b);
    });
    wrap.appendChild(col);
    var frame = h('div', 'wd-frame', '<span class="wd-frame-t"></span>');
    frame.querySelector('.wd-frame-t').innerHTML = sc.frameLabel || 'context window';
    wrap.appendChild(frame);
    el.appendChild(wrap);

    var side = h('div', 'wd-side');
    sc.notes.forEach(function(nt){
      var it = h('div', 'side-note');
      it.innerHTML = '<h3></h3><p></p>';
      it.querySelector('h3').innerHTML = nt.t;
      it.querySelector('p').innerHTML = nt.d;
      side.appendChild(it);
    });
    el.appendChild(side);
    return sc.notes.length + 1;
  },
  step: function(el, sc, k){
    var upTo = k ? (sc.show[k - 1] || 0) : 0;
    el.querySelectorAll('.wd-turn').forEach(function(t){
      var i = +t.dataset.i;
      t.classList.toggle('on', i < upTo);
      /* once the window slides, the earliest turns are still on screen for the
         reader but greyed: they are out of the model's view, not out of history */
      t.classList.toggle('gone', k >= (sc.dropAt || 99) && i < (sc.drops || 0));
    });
    var fr = el.querySelector('.wd-frame'), on = k >= (sc.frameAt || 99);
    fr.classList.toggle('on', on);
    if (on){
      /* offsetTop/offsetHeight are layout values, immune to the stage transform */
      var vis = [].slice.call(el.querySelectorAll('.wd-turn.on')).filter(function(t){
        return !t.classList.contains('gone');
      });
      if (vis.length){
        var a = vis[0], b = vis[vis.length - 1];
        fr.style.top = (a.offsetTop - 10) + 'px';
        fr.style.height = (b.offsetTop + b.offsetHeight - a.offsetTop + 20) + 'px';
      }
    }
    var notes = [].slice.call(el.querySelectorAll('.side-note'));
    notes.forEach(function(n, i){ n.classList.toggle('on', i < k); n.classList.toggle('live', i === k - 1); });
    foot(el, k, sc.n);
  }
};

/* ═══ trace — a reasoning model thinking out loud ══════════════════════════ */
RENDER.trace = {
  build: function(el, sc){
    head(el, sc);
    var wrap = h('div', 'tr-wrap');
    var q = h('div', 'tr-q', '<span>prompt</span><p></p>');
    q.querySelector('p').innerHTML = sc.q;
    wrap.appendChild(q);

    var pad = h('div', 'tr-pad', '<span class="tr-pad-t">internal reasoning &mdash; not the answer</span>');
    sc.lines.forEach(function(l){
      var li = h('p', 'tr-line');
      li.innerHTML = l;
      pad.appendChild(li);
    });
    wrap.appendChild(pad);

    var a = h('div', 'tr-a', '<span>answer</span><p></p>');
    a.querySelector('p').innerHTML = sc.a;
    wrap.appendChild(a);
    el.appendChild(wrap);
    return sc.lines.length + 3;   /* prompt, each line, pad-closes + answer, note */
  },
  step: function(el, sc, k){
    el.querySelector('.tr-q').classList.toggle('on', k >= 1);
    var pad = el.querySelector('.tr-pad');
    pad.classList.toggle('on', k >= 2);
    pad.classList.toggle('done', k >= sc.lines.length + 2);
    el.querySelectorAll('.tr-line').forEach(function(l, i){
      l.classList.toggle('on', i < k - 1);
      l.classList.toggle('live', i === k - 2);
    });
    el.querySelector('.tr-a').classList.toggle('on', k >= sc.lines.length + 2);
    foot(el, k, sc.n);
  }
};

/* ═══ moe — mixture of experts ═════════════════════════════════════════════ */
RENDER.moe = {
  build: function(el, sc){
    head(el, sc);
    var wrap = h('div', 'mo-wrap');

    var dense = h('div', 'mo-dense', '<span class="mo-tag">one dense model</span>' +
      '<div class="mo-slab"></div><p class="mo-cap"></p>');
    dense.querySelector('.mo-cap').innerHTML = sc.denseCap;
    wrap.appendChild(dense);

    var right = h('div', 'mo-right');
    right.appendChild(h('span', 'mo-tag', 'a mixture of experts'));
    var router = h('div', 'mo-router', '<b>router</b><i></i>');
    right.appendChild(router);
    var grid = h('div', 'mo-grid');
    sc.experts.forEach(function(x, i){
      var e = h('div', 'mo-x');
      e.dataset.i = i;
      e.innerHTML = '<b></b><span></span>';
      e.querySelector('b').textContent = String(i + 1).padStart(2, '0');
      e.querySelector('span').innerHTML = x;
      grid.appendChild(e);
    });
    right.appendChild(grid);
    right.appendChild(h('p', 'mo-cap', sc.moeCap));
    wrap.appendChild(right);
    el.appendChild(wrap);

    var tok = h('div', 'mo-tok');
    tok.innerHTML = '<span class="mo-tok-l"></span><b class="mo-tok-v"></b>';
    el.appendChild(tok);

    var side = h('div', 'mo-side');
    sc.notes.forEach(function(nt){
      var it = h('div', 'side-note');
      it.innerHTML = '<h3></h3><p></p>';
      it.querySelector('h3').innerHTML = nt.t;
      it.querySelector('p').innerHTML = nt.d;
      side.appendChild(it);
    });
    el.appendChild(side);
    return sc.notes.length + 1;
  },
  step: function(el, sc, k){
    var st = k ? (sc.states[k - 1] || {}) : {};
    el.querySelector('.mo-dense').classList.toggle('on', !!st.dense);
    el.querySelector('.mo-dense').classList.toggle('hot', !!st.denseHot);
    el.querySelector('.mo-right').classList.toggle('on', !!st.moe);
    el.querySelector('.mo-router').classList.toggle('on', !!st.router);
    var lit = st.lit || [];
    el.querySelectorAll('.mo-x').forEach(function(x){
      x.classList.toggle('lit', lit.indexOf(+x.dataset.i) > -1);
    });
    var tok = el.querySelector('.mo-tok');
    tok.classList.toggle('on', !!st.tok);
    if (st.tok){
      tok.querySelector('.mo-tok-l').textContent = 'routing the token';
      tok.querySelector('.mo-tok-v').textContent = st.tok;
    }
    var notes = [].slice.call(el.querySelectorAll('.side-note'));
    notes.forEach(function(n, i){ n.classList.toggle('on', i < k); n.classList.toggle('live', i === k - 1); });
    foot(el, k, sc.n);
  }
};

/* ═══ timeline — the scene that is wider than the canvas ═══════════════════
   The track pans under a fixed spine. Follow, never re-centre: re-centring on
   every step makes the whole scene lurch under the reader. */
RENDER.timeline = {
  build: function(el, sc){
    head(el, sc);
    var X0 = 300, COL = 384, DOTY = 700, CARD_TOP = 352, CARD_W = 344;
    var span = X0 * 2 + (sc.events.length - 1) * COL;
    var vp = h('div', 'tl-vp');
    var track = h('div', 'tl-track');
    track.style.width = span + 'px';
    track.appendChild(h('div', 'tl-spine'));

    sc.events.forEach(function(e, i){
      var x = X0 + i * COL;
      var dot = h('div', 'tl-dot');
      dot.dataset.i = i;
      dot.style.cssText = 'left:' + x + 'px;top:' + DOTY + 'px;--hd:' + (i * 0.27).toFixed(2) + 's';
      if (e.big) dot.classList.add('big');
      track.appendChild(dot);

      var date = h('div', 'tl-date', e.date);
      date.dataset.i = i;
      date.style.cssText = 'left:' + x + 'px;top:' + (DOTY + 34) + 'px';
      track.appendChild(date);

      var card = h('div', 'tl-card');
      card.dataset.i = i;
      card.style.cssText = 'left:' + x + 'px;top:' + CARD_TOP + 'px;width:' + CARD_W + 'px';
      card.innerHTML = '<h3></h3><p></p>' + (e.tag ? '<span class="tl-tag"></span>' : '');
      card.querySelector('h3').innerHTML = e.t;
      card.querySelector('p').innerHTML = e.d;
      if (e.tag) card.querySelector('.tl-tag').innerHTML = e.tag;
      track.appendChild(card);

      var stem = h('div', 'tl-stem');
      stem.dataset.i = i;
      stem.style.cssText = 'left:' + x + 'px;top:' + (CARD_TOP + 214) + 'px;' +
                           'height:' + (DOTY - CARD_TOP - 214) + 'px';
      track.appendChild(stem);
    });
    vp.appendChild(track);
    el.appendChild(vp);
    sc._geo = { X0: X0, COL: COL, span: span, DOTY: DOTY, CARD_TOP: CARD_TOP };

    /* each card flies out of its own marker, so the reveal reads "this came from here" */
    track.querySelectorAll('.tl-card').forEach(function(c){
      c.style.setProperty('--sy', (DOTY - CARD_TOP - 60) + 'px');
    });
    return sc.events.length + 1;
  },
  step: function(el, sc, k){
    el.querySelectorAll('.tl-dot,.tl-date,.tl-card,.tl-stem').forEach(function(n){
      var i = +n.dataset.i;
      n.classList.toggle('on', i < k);
      n.classList.toggle('live', i === k - 1);
    });
    var g = sc._geo, track = el.querySelector('.tl-track');
    /* The camera is replayed from step 0 every time rather than carried forward.
       Following is path-dependent by nature, so keeping a running pan made the
       backwards walk land somewhere different from the forwards one. Replaying
       is a dozen arithmetic ops and makes the pan a pure function of k. */
    var min = Math.min(0, -(g.span - 1920)), pan = 0;
    for (var j = 1; j <= k; j++){
      var cx = g.X0 + (j - 1) * g.COL;
      /* follow, do not centre: move only when the new marker nears an edge */
      if (cx + pan > 1470) pan = Math.max(min, -(cx - 1120));
      else if (cx + pan < 420) pan = Math.min(0, -(cx - 700));
    }
    track.style.transform = 'translateX(' + pan + 'px)';
  }
};

/* ═══ recap ════════════════════════════════════════════════════════════════ */
RENDER.recap = {
  build: function(el, sc){
    head(el, sc);
    var grid = h('div', 'rc-grid');
    sc.items.forEach(function(it, i){
      var c = h('div', 'rc');
      c.style.setProperty('--c', 'var(--c' + (i + 1) + ')');
      c.innerHTML = '<b></b><h3></h3><p></p>';
      c.querySelector('b').textContent = String(i + 1).padStart(2, '0');
      c.querySelector('h3').innerHTML = it.t;
      c.querySelector('p').innerHTML = it.d;
      grid.appendChild(c);
    });
    el.appendChild(grid);
    return 2;
  },
  step: function(el, sc, k){
    el.querySelectorAll('.rc').forEach(function(c){ c.classList.toggle('on', k >= 1); });
    foot(el, k, sc.n);
  }
};

})();

<script>
/* ═══ engine ═══════════════════════════════════════════════════════════════
   One logical canvas scaled once, one global step index, every scene derived
   from it. Nothing here knows what the deck is about — content lives in
   js/data-*.js, drawing lives in js/render.js. */
(function(){
'use strict';

var stage = document.getElementById('stage'),
    host  = document.getElementById('scenes'),
    reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ── build every scene once. Build creates nodes; the step pass only toggles
      classes — rebuilding on a step change would drop CSS transitions. ───── */
var SCENES = window.DECK, FLAT = [];

SCENES.forEach(function(sc, si){
  var r = window.RENDER[sc.type];
  if (!r) { console.error('no renderer for type', sc.type, sc.id); return; }
  var el = document.createElement('section');
  el.className = 'scene sc-' + sc.type;
  el.id = 'sc-' + sc.id;
  el.dataset.ch = sc.ch;
  host.appendChild(el);
  sc.el = el;
  sc.n = r.build(el, sc) || sc.steps || 1;   /* renderer may declare its own count */
  for (var k = 0; k < sc.n; k++) FLAT.push({ si: si, k: k });
});

document.getElementById('counter-all').textContent = FLAT.length;

/* ── the step machine ──────────────────────────────────────────────────── */
var g = -1, curScene = -1;

function applyGlobal(n, push){
  g = Math.max(0, Math.min(n, FLAT.length - 1));
  var f = FLAT[g], sc = SCENES[f.si];

  if (f.si !== curScene){
    SCENES.forEach(function(s, i){ s.el.classList.toggle('is-active', i === f.si); });
    curScene = f.si;
    document.getElementById('rail-fill').style.setProperty('--rc', 'var(--c' + sc.ch + ')');
  }
  window.RENDER[sc.type].step(sc.el, sc, f.k);

  document.getElementById('rail-fill').style.width = ((g + 1) / FLAT.length * 100) + '%';
  document.getElementById('counter-now').textContent = g + 1;
  var hash = '#' + sc.id + (f.k ? '/' + f.k : '');
  if (push !== false && location.hash !== hash) history.replaceState(null, '', hash);
}

function next(){ if (g < FLAT.length - 1) applyGlobal(g + 1); }
function prev(){ if (g > 0) applyGlobal(g - 1); }

/* jump to the first step of a scene */
function goScene(id){
  for (var i = 0; i < FLAT.length; i++)
    if (SCENES[FLAT[i].si].id === id && FLAT[i].k === 0) return applyGlobal(i);
}

/* ── contents menu ─────────────────────────────────────────────────────── */
var menu = document.getElementById('menu'),
    list = document.getElementById('menu-list');

window.CHAPTERS.forEach(function(c){
  var li = document.createElement('li');
  li.style.setProperty('--mc', 'var(--c' + c.n + ')');
  li.innerHTML = '<b>' + String(c.n).padStart(2, '0') + '</b><div><h4></h4><p></p></div>';
  li.querySelector('h4').textContent = c.title;
  li.querySelector('p').textContent = c.blurb;
  li.onclick = function(){ closeMenu(); goScene(c.scene); };
  list.appendChild(li);
});

function openMenu(){ menu.classList.add('open'); }
function closeMenu(){ menu.classList.remove('open'); }
function toggleMenu(){ menu.classList.contains('open') ? closeMenu() : openMenu(); }

/* ── keyboard and controls ─────────────────────────────────────────────── */
addEventListener('keydown', function(e){
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'Escape'){ closeMenu(); return; }
  if (e.key === 'm' || e.key === 'M'){ toggleMenu(); return; }
  if (menu.classList.contains('open')) return;
  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown'){ e.preventDefault(); next(); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp'){ e.preventDefault(); prev(); }
  else if (e.key === 'Home'){ e.preventDefault(); applyGlobal(0); }
  else if (e.key === 'End'){ e.preventDefault(); applyGlobal(FLAT.length - 1); }
});
document.getElementById('bNext').onclick = next;
document.getElementById('bPrev').onclick = prev;
document.getElementById('bMenu').onclick = toggleMenu;
addEventListener('click', function(e){
  if (e.target.closest('#chrome,#menu,a,button,.no-advance')) return;
  if (menu.classList.contains('open')) return;
  next();
});

/* ── fit the canvas ────────────────────────────────────────────────────── */
function fitStage(){
  var k = Math.min(innerWidth / 1920, innerHeight / 1080);
  stage.style.transform = 'translate(-50%,-50%) scale(' + k + ')';
  document.body.classList.toggle('cramped', innerWidth < 620 || innerHeight < 380);
}
addEventListener('resize', fitStage);
fitStage();

/* ── boot: resolve a deep link before showing anything ─────────────────── */
function boot(){
  /* text-derived measurements are wrong until the real faces are in, so any
     renderer that positions something from a measured height does it here */
  SCENES.forEach(function(sc){
    var r = window.RENDER[sc.type];
    if (r && r.measure) r.measure(sc.el, sc);
  });
  var h = decodeURIComponent(location.hash.replace(/^#/, '')),
      id = h.split('/')[0], k = parseInt(h.split('/')[1] || '0', 10) || 0, at = 0;
  if (id) for (var i = 0; i < FLAT.length; i++)
    if (SCENES[FLAT[i].si].id === id && FLAT[i].k === k){ at = i; break; }
  applyGlobal(at);
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(boot); else boot();
window.DECK_DEBUG = { flat: FLAT, scenes: SCENES, go: applyGlobal, goScene: goScene,
                      at: function(){ return g; }, reduced: reduced };
})();

</script>
