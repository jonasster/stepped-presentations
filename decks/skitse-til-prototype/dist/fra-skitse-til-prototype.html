:root{
  --paper:#eff1f5;
  --ink:#211a52;
  --ink-2:#5b6070;
  --ink-3:#8b8f9c;
  --line:#dfe3ea;
  --accent:#4a2fe0;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --sans:"Geist","Segoe UI",system-ui,sans-serif;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --ease:cubic-bezier(.2,.75,.25,1);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#12121a;color:var(--ink);font-family:var(--sans);overflow:hidden}
p,h1,h2,h3,ul,ol,figure{margin:0}
img{display:block;max-width:100%}

#viewport{position:fixed;inset:0}
#stage{width:1920px;height:1080px;position:absolute;left:50%;top:50%;
       background:var(--paper);overflow:hidden;transform-origin:center}

.slide{position:absolute;inset:0;padding:96px 130px 110px;display:flex;flex-direction:column;
       opacity:0;visibility:hidden;
       transition:opacity .38s var(--ease),visibility .38s}
.slide.is-active{opacity:1;visibility:visible}

/* ── fælles hoved ────────────────────────────────────────────────────────── */
.kicker{display:flex;align-items:center;gap:14px;font-family:var(--mono);font-weight:700;
        font-size:18px;letter-spacing:.34em;text-transform:uppercase;color:var(--ink-3)}
.kicker::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--accent)}
.slide h2{margin-top:20px;font-family:var(--display);font-weight:800;font-size:86px;
          line-height:.96;text-transform:uppercase;max-width:24ch}
.lede{margin-top:18px;max-width:74ch;font-size:26px;line-height:1.45;color:var(--ink-2)}
.slide-head{min-height:200px}
.slide.has-lede .slide-head{min-height:264px}
.slide-head{flex:none}
.body{flex:1 1 auto;min-height:0;margin-top:52px}

/* ── afsløring ───────────────────────────────────────────────────────────── */
.rv{opacity:0;transition:opacity .34s var(--ease),transform .44s var(--ease)}
.rv.on{opacity:1}

/* ── 1 · titel ───────────────────────────────────────────────────────────── */
.k-title{padding:96px 130px;display:block}
.t-grid{height:100%;display:grid;grid-template-columns:860px 1fr;gap:60px;align-items:center}
.t-text{align-self:center}
.k-title h1{margin-top:22px;font-family:var(--display);font-weight:800;font-size:132px;
            line-height:.9;text-transform:uppercase;max-width:13ch}
.t-lede{margin-top:26px;font-size:30px;max-width:30ch;color:var(--ink-2)}
.t-meta{margin-top:34px;font-family:var(--mono);font-weight:500;font-size:21px;
        letter-spacing:.03em;color:var(--ink)}
.t-keys{margin-top:12px;font-family:var(--mono);font-weight:500;font-size:17px;color:var(--ink-3)}

/* skitsen der bygger sig selv om til en grænseflade, og forfra: hele workshoppen
   i ét loop. 10s — langsomt nok til at man kan nå at se hvad der sker. */
.t-anim{justify-self:center;text-align:center}
.t-anim svg{width:640px;height:462px}
.t-anim .win{fill:#fff;stroke:var(--line);stroke-width:2}
.t-anim .winbar{fill:#f3f4f8}
.t-anim .wdot{fill:#d4d7e0}
.t-anim .sk{stroke:#a9adbb;stroke-width:2.5;stroke-linecap:round;animation:skFade 10s var(--ease) infinite}
.t-anim .sk *{stroke-dasharray:1400;stroke-dashoffset:1400;
              animation:skDraw 10s var(--ease) infinite}
.t-anim .ui{opacity:0;animation:uiIn 10s var(--ease) infinite}
.t-anim .ui .bar{fill:var(--accent)}
.t-anim .ui .barln{fill:#fff;opacity:.85}
.t-anim .ui .ubox{fill:#fff;stroke:var(--line);stroke-width:2}
.t-anim .ui .pip{fill:var(--accent);opacity:.25}
.t-anim .ui .ln{fill:#c9ccd8}
.t-anim .ui .ln.s{fill:#dfe2ea}
.t-anim .ui .btn{fill:var(--accent);animation:btnTap 10s var(--ease) infinite}
.t-anim .ui .btnln{fill:#fff;opacity:.9}
.t-anim .cur{fill:var(--ink);opacity:0;animation:curIn 10s var(--ease) infinite}
.t-anim-cap{margin-top:18px;font-family:var(--mono);font-weight:700;font-size:19px;
            letter-spacing:.3em;text-transform:uppercase;position:relative;height:24px}
.t-anim-cap span{position:absolute;left:0;right:0}
.t-anim-cap .l1{color:var(--ink-3);animation:capA 10s var(--ease) infinite}
.t-anim-cap .l2{color:var(--accent);opacity:0;animation:capB 10s var(--ease) infinite}

@keyframes skDraw{0%{stroke-dashoffset:1400}20%,100%{stroke-dashoffset:0}}
@keyframes skFade{0%,44%{opacity:1}56%,94%{opacity:.14}100%{opacity:1}}
@keyframes uiIn{0%,44%{opacity:0;transform:translateY(12px)}
                56%,94%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(12px)}}
@keyframes btnTap{0%,74%{transform:scale(1)}78%{transform:scale(.97)}82%,100%{transform:scale(1)}}
@keyframes curIn{0%,58%{opacity:0;transform:translate(300px,470px)}
                 64%{opacity:1;transform:translate(300px,470px)}
                 76%,86%{opacity:1;transform:translate(500px,430px)}
                 94%,100%{opacity:0;transform:translate(500px,430px)}}
@keyframes capA{0%,46%{opacity:1}54%,100%{opacity:0}}
@keyframes capB{0%,46%{opacity:0}54%,94%{opacity:1}100%{opacity:0}}

/* ── kort på række ───────────────────────────────────────────────────────── */
.num{font-family:var(--mono);font-weight:700;font-size:17px;color:var(--accent);
     letter-spacing:.1em;flex:none}
.cards{flex:0 0 auto;margin:auto 0;display:flex;gap:var(--gap);align-items:stretch}
.card{padding:30px 32px 34px;background:#fff;border:1px solid var(--line);border-radius:16px;
      border-top:3px solid var(--accent);transform:translateY(14px)}
.card.on{transform:none}
.card h3{margin-top:16px;font-family:var(--display);font-weight:800;font-size:40px;
         line-height:1.02;text-transform:uppercase}
.card p{margin-top:14px;font-size:22px;line-height:1.5;color:var(--ink-2)}

/* ── todelt: trin til venstre, skærmbillede eller tegning til højre ──────── */
.split{display:grid;grid-template-columns:560px 1fr;gap:60px;align-items:center}
.col-steps ol.tight{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:11px}
.trow{display:grid;grid-template-columns:34px 1fr;gap:16px;padding-bottom:11px;
      border-bottom:1px solid var(--line);transform:translateY(8px)}
.trow:last-child{border-bottom:0;padding-bottom:0}
.trow.on{transform:none}
.trow .num{padding-top:6px;font-size:16px}
.trow h3{font-family:var(--display);font-weight:800;font-size:28px;line-height:1.04;
         text-transform:uppercase}
.trow code{display:inline-block;margin-top:6px;padding:4px 9px;border-radius:6px;
           background:#1b1930;color:#e8e6ff;font-family:var(--mono);font-weight:500;font-size:16px}
.trow p{margin-top:6px;font-size:18px;line-height:1.42;color:var(--ink-2)}

.shotfig{margin:0}
.shotfig img{width:100%;max-height:500px;object-fit:contain;object-position:top;
             border:1px solid var(--line);border-radius:14px;background:#fff}
.shotfig figcaption{margin-top:12px;font-family:var(--mono);font-weight:500;font-size:17px;
                    color:var(--ink-3)}
.scene-box svg{width:100%;height:auto;max-height:540px}

/* crazy 8s */
.c8 rect{fill:#fff;stroke:var(--line);stroke-width:2}
.c8i .k{fill:none;stroke:#b9bcc9;stroke-width:2.5;stroke-linecap:round}
.c8i .k.f{fill:#e6e8ef;stroke:none}
.c8pick rect{fill:none;stroke:var(--accent);stroke-width:3}
.c8pick text{font-family:var(--mono);font-weight:700;font-size:19px;fill:var(--accent);
             letter-spacing:.2em;text-transform:uppercase}

/* tre skærme */
.sc > rect{fill:#fff;stroke:var(--line);stroke-width:2}
.sc .k{fill:none;stroke:#b9bcc9;stroke-width:2.5;stroke-linecap:round}
.sc rect.k{fill:#e6e8ef;stroke:none}
.sc .scnum{font-family:var(--mono);font-weight:700;font-size:19px;fill:var(--ink-3);
           letter-spacing:.18em;text-transform:uppercase}
.scb rect{fill:var(--accent)}
.scb text{font-family:var(--sans);font-weight:600;font-size:19px;fill:#fff}
.scarrow{fill:none;stroke:var(--accent);stroke-width:3}
.scarrow + .scarrow{stroke:var(--accent)}
#sl-tre-skaerme marker path{fill:var(--accent)}

/* ── nummereret liste ────────────────────────────────────────────────────── */
.steps{display:flex;flex-direction:column;justify-content:center;gap:16px}
.srow{display:grid;grid-template-columns:52px 600px 1fr;align-items:start;gap:28px;
      padding:20px 26px;background:#fff;border:1px solid var(--line);border-radius:14px;
      border-left:3px solid var(--line);transform:translateY(10px)}
.srow.on{transform:none;border-left-color:var(--accent)}
.srow .num{padding-top:8px;font-size:19px}
.srow h3{font-family:var(--display);font-weight:800;font-size:34px;line-height:1.04;
         text-transform:uppercase}
.srow code{display:inline-block;margin-top:10px;padding:6px 12px;border-radius:7px;
           background:#1b1930;color:#e8e6ff;font-family:var(--mono);font-weight:500;font-size:20px}
.srow > p{padding-top:6px;font-size:21px;line-height:1.5;color:var(--ink-2)}

/* ── casen ───────────────────────────────────────────────────────────────── */
.brief{flex:0 0 auto;margin:auto 0;position:relative;padding:34px 44px 40px;background:#fff;border:1px solid var(--line);
       border-radius:18px;display:flex;flex-direction:column;gap:22px}
.brief-tag{position:absolute;top:-15px;left:44px;padding:5px 14px;border-radius:6px;
           background:var(--accent);color:#fff;font-family:var(--mono);font-weight:700;
           font-size:16px;letter-spacing:.22em;text-transform:uppercase}
.brow{display:grid;grid-template-columns:340px 1fr;gap:40px;align-items:baseline;
      padding-bottom:22px;border-bottom:1px solid var(--line);transform:translateX(-10px)}
.brow:last-child{padding-bottom:0;border-bottom:0}
.brow.on{transform:none}
.brow h3{font-family:var(--mono);font-weight:700;font-size:19px;letter-spacing:.2em;
         text-transform:uppercase;color:var(--accent)}
.brow p{font-size:26px;line-height:1.45}

/* ── prompts ─────────────────────────────────────────────────────────────── */
.prompts{display:flex;flex-direction:column;justify-content:center;gap:22px}
.prow{transform:translateY(10px)}
.prow.on{transform:none}
.phead{display:flex;align-items:baseline;gap:18px}
.phead h3{font-family:var(--display);font-weight:800;font-size:36px;text-transform:uppercase}
.phead span{font-family:var(--mono);font-weight:500;font-size:18px;color:var(--ink-3)}
.prow code{display:block;margin-top:10px;padding:20px 24px;border-radius:12px;
           background:#1b1930;color:#e8e6ff;font-family:var(--mono);font-weight:500;
           font-size:21px;line-height:1.5}

/* ── scener med absolut geometri ─────────────────────────────────────────── */
.scene{position:absolute;inset:0;margin:0}
.scene > *{position:absolute}

/* tidslinje */
.axis{height:2px;background:var(--line);transform:translateY(-50%)}
.tknot{width:20px;height:20px;border-radius:50%;background:var(--line);
       transform:translate(-50%,-50%) scale(.5)}
.tknot.on{background:var(--accent);transform:translate(-50%,-50%) scale(1)}
.tname{transform:translate(-50%,-100%);text-align:center;font-family:var(--display);
       font-weight:800;font-size:30px;line-height:1;text-transform:uppercase;color:var(--ink)}
.ttime{transform:translateX(-50%);font-family:var(--mono);font-weight:700;font-size:19px;
       color:var(--ink-3)}

/* kun den knude vi står på, pulserer — bevægelsen peger på nutiden */
.tknot.on.now::after{content:"";position:absolute;inset:0;border-radius:50%;
  background:var(--accent);animation:halo 3.6s var(--ease) infinite}
@keyframes halo{0%{transform:scale(1);opacity:.22}70%,100%{transform:scale(2.8);opacity:0}}

/* kurve */
.cv .ax{stroke:var(--line);stroke-width:2}
.cv .cvline{fill:none;stroke:var(--accent);stroke-width:4;stroke-linecap:round}
.cv .cvdot{fill:var(--accent)}
.cv .hi{fill:var(--ink-3)}
.cv .cvlab{font-family:var(--mono);font-weight:700;font-size:20px;fill:var(--accent);
            letter-spacing:.16em;text-transform:uppercase}
.cv .hiy{fill:var(--ink-3)}
.cvaxis{font-family:var(--mono);font-weight:500;font-size:18px;letter-spacing:.2em;
        text-transform:uppercase;color:var(--ink-3)}
.cvaxis.y{transform:rotate(-90deg);transform-origin:left top;white-space:nowrap}
.cvnotes{width:700px;display:flex;flex-direction:column;gap:26px}
.cvnote{transform:translateY(10px)}
.cvnote.on{transform:none}
.cvnote h3{font-family:var(--display);font-weight:800;font-size:34px;line-height:1.04;
           text-transform:uppercase}
.cvnote p{margin-top:8px;font-size:21px;line-height:1.45;color:var(--ink-2)}

/* byggeloop */
.ring{left:0;top:0}
.ring .arc{fill:none;stroke:var(--line);stroke-width:3}
.ring .arc.on{stroke:var(--accent)}
.ring marker path{fill:var(--accent)}
.lnode{padding:22px 26px;background:#fff;border:1px solid var(--line);
       border-radius:14px;border-top:3px solid var(--accent);transform:translateY(12px)}
.lnode.on{transform:none}
.larrow,.lback{fill:none;stroke:var(--line);stroke-width:3}
.larrow.on,.lback.on{stroke:var(--accent)}
#sl-loop marker path{fill:var(--accent)}
.lnode h3{margin-top:8px;font-family:var(--display);font-weight:800;font-size:32px;
          line-height:1.04;text-transform:uppercase}
.lnode p{margin-top:6px;font-size:20px;line-height:1.4;color:var(--ink-2)}
.lcenter{transform:translate(-50%,-50%);padding:4px 18px;background:var(--paper);
         text-align:center;font-family:var(--mono);
         font-weight:700;font-size:20px;color:var(--ink-3);line-height:1.5;white-space:nowrap}


/* prikken der kører rundt: loopet gentager sig, og det er hele pointen */
.orbit{width:15px;height:15px;margin:-7.5px 0 0 -7.5px;left:0;top:0;border-radius:50%;
       background:var(--accent);opacity:0;offset-rotate:0deg;
       transition:opacity .5s var(--ease);
       animation:orbit 11s linear infinite;animation-play-state:paused}
.slide.done .orbit{opacity:1;animation-play-state:running}
@keyframes orbit{from{offset-distance:0%}to{offset-distance:100%}}

/* ── vedvarende chrome ───────────────────────────────────────────────────── */
#meta{position:absolute;z-index:10;top:52px;right:130px;display:flex;align-items:baseline;
      gap:26px;font-family:var(--mono);font-weight:500;font-size:19px;color:var(--ink-3)}
#meta #clock{font-weight:700;color:var(--ink)}
#progress{position:fixed;left:0;bottom:0;height:3px;background:var(--accent);width:0;
          transition:width .35s var(--ease);z-index:50}
#chrome{position:fixed;left:0;right:0;bottom:16px;display:flex;justify-content:center;gap:9px;
        opacity:0;transition:opacity .25s;z-index:50}
#viewport:hover #chrome{opacity:1}
#chrome button{font-family:var(--mono);font-size:12px;color:#c8cad6;cursor:pointer;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);
  border-radius:6px;padding:7px 13px}

/* fejlfindings-slidet har sin egen farve — det er den ene advarsel i dækket */
#sl-galt{--accent:#c0620e}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition-duration:.001s!important}
  /* en indikator der forsvinder er en fejl: halo bliver en stående ring */
  .tknot.on.now::after{opacity:.22;transform:scale(2)}
  /* forsiden fryser på slutbilledet: prototypen, ikke en halv skitse */
  .t-anim .sk{opacity:.14}
  .t-anim .sk *{stroke-dashoffset:0}
  .t-anim .ui{opacity:1}
  .t-anim .cur{opacity:0}
  .t-anim-cap .l1{opacity:0}
  .t-anim-cap .l2{opacity:1}
}

</style>
</head>
<body>
<div id="viewport"><div id="stage">
  <div id="meta"><span id="phase"></span><span id="clock"></span><span id="count"></span></div>
  <div id="deck"></div>
</div></div>

<div id="chrome">
  <button id="bPrev" type="button">← tilbage</button>
  <button id="bNext" type="button">frem →</button>
  <button id="bAll" type="button">vis alt (F)</button>
</div>
<div id="progress"></div>

const $ = id => document.getElementById(id);

const phaseEl = $('phase'), clockEl = $('clock'), countEl = $('count'), progress = $('progress');
const bNext = $('bNext'), bPrev = $('bPrev'), bAll = $('bAll');

const esc = s => String(s == null ? '' : s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

/* ── lærredets faste mål: alle tal nedenfor lever i dette rum ────────────── */
const W = 1920, H = 1080, PAD = 130;
const USABLE = W - PAD * 2;                 /* 1660 */

/* ── fælles byggeklodser ─────────────────────────────────────────────────── */
function head(s){
  return `<header class="slide-head">
    <p class="kicker">${esc(s.phase)}</p>
    <h2>${esc(s.title)}</h2>
    ${s.lede ? `<p class="lede">${esc(s.lede)}</p>` : ''}
  </header>`;
}

/* kompakt trinliste — brugt af alle todelte slides */
function stepList(s){
  return `<ol class="tight">` + s.steps.map((x, i) => `
    <li class="rv trow" data-i="${i}">
      <b class="num">${i + 1}</b>
      <div>
        <h3>${esc(x.t)}</h3>
        ${x.cmd ? `<code>${esc(x.cmd)}</code>` : ''}
        <p>${esc(x.d)}</p>
      </div>
    </li>`).join('') + `</ol>`;
}

/* ── layout-tegnere, én pr. kind ─────────────────────────────────────────── */
const render = {

  /* 1 · forsiden: tekst til venstre, en prototype der bygger sig selv til højre */
  title(s){
    return `<div class="t-grid">
      <div class="t-text">
        <p class="kicker">${esc(s.phase)}</p>
        <h1>${esc(DECK.title)}</h1>
        <p class="lede t-lede">${esc(DECK.lede)}</p>
        <p class="t-meta">${esc(DECK.meta)}</p>
        <p class="t-keys">→ næste · ← tilbage · ↓ næste slide · F vis alt</p>
      </div>
      <div class="t-anim">${protoAnim()}</div>
    </div>`;
  },

  /* skærmbillede til højre, trin til venstre */
  shot(s){
    return head(s) + `<div class="body split">
      <div class="col-steps">${stepList(s)}</div>
      <figure class="shotfig">
        <img src="${esc(s.shot)}" alt="">
        <figcaption>${esc(s.shotCap)}</figcaption>
      </figure>
    </div>`;
  },

  /* otte felter, otte minutter */
  crazy8(s){
    return head(s) + `<div class="body split">
      <div class="col-steps">${stepList(s)}</div>
      <div class="scene-box">${crazyGrid()}</div>
    </div>`;
  },

  /* tre skærme med pile imellem */
  screens(s){
    return head(s) + `<div class="body split">
      <div class="col-steps">${stepList(s)}</div>
      <div class="scene-box">${threeScreens()}</div>
    </div>`;
  },

  /* vandret række kort, 3 eller 4 */
  cards(s){
    const n = s.steps.length;
    const gap = 24, w = Math.round((USABLE - gap * (n - 1)) / n);
    return head(s) + `<div class="body cards" style="--gap:${gap}px">` +
      s.steps.map((x, i) => `
        <article class="rv card" data-i="${i}" style="width:${w}px">
          <b class="num">${i + 1}</b>
          <h3>${esc(x.t)}</h3>
          <p>${esc(x.d)}</p>
        </article>`).join('') + `</div>`;
  },

  /* nummereret liste i fuld bredde */
  steps(s){
    return head(s) + `<div class="body steps">` +
      s.steps.map((x, i) => `
        <div class="rv srow" data-i="${i}">
          <b class="num">${i + 1}</b>
          <div class="scol">
            <h3>${esc(x.t)}</h3>
            ${x.cmd ? `<code>${esc(x.cmd)}</code>` : ''}
          </div>
          <p>${esc(x.d)}</p>
        </div>`).join('') + `</div>`;
  },

  /* casen: ét indrammet brief med fire rækker */
  brief(s){
    return head(s) + `<div class="body brief">
      <p class="brief-tag">Spor A</p>` +
      s.steps.map((x, i) => `
        <div class="rv brow" data-i="${i}">
          <h3>${esc(x.t)}</h3>
          <p>${esc(x.d)}</p>
        </div>`).join('') + `</div>`;
  },

  /* tre prompts, stablet, med den rigtige ordlyd i mono */
  prompts(s){
    return head(s) + `<div class="body prompts">` +
      s.steps.map((x, i) => `
        <div class="rv prow" data-i="${i}">
          <div class="phead"><h3>${esc(x.t)}</h3><span>${esc(x.d)}</span></div>
          <code>${esc(x.p)}</code>
        </div>`).join('') + `</div>`;
  },

  /* tidslinje: otte knuder på én akse */
  timeline(s){
    const n = s.steps.length, X0 = 250, X1 = 1670, AY = 640;
    const col = (X1 - X0) / (n - 1);
    const xOf = i => Math.round(X0 + i * col);
    return head(s) + `<div class="body scene">
      <div class="axis" style="left:${X0}px;width:${X1 - X0}px;top:${AY}px"></div>` +
      s.steps.map((x, i) => `
        <div class="rv tknot" data-i="${i}" style="left:${xOf(i)}px;top:${AY}px"></div>
        <div class="rv tname" data-i="${i}" style="left:${xOf(i)}px;top:${AY - 40}px;width:${Math.round(col)}px">${esc(x.t)}</div>
        <div class="rv ttime" data-i="${i}" style="left:${xOf(i)}px;top:${AY + 34}px">${esc(x.d)}</div>`
      ).join('') + `</div>`;
  },

  /* kurven: detaljeringsgrad mod villighed til at lave om */
  curve(s){
    const X = 130, Y = 470, CW = 900, CH = 470;
    const p = `M 70 70 C 300 110, 420 300, 860 400`;
    return head(s) + `<div class="body scene">
      <svg class="cv" viewBox="0 0 ${CW} ${CH}" width="${CW}" height="${CH}"
           style="left:${X}px;top:${Y}px" aria-hidden="true">
        <line class="ax" x1="70" y1="40" x2="70" y2="420"/>
        <line class="ax" x1="70" y1="420" x2="880" y2="420"/>
        <path class="cvline rv" data-i="0" d="${p}"/>
        <circle class="cvdot rv lo" data-i="0" cx="70" cy="70" r="11"/>
        <circle class="cvdot rv hi" data-i="1" cx="860" cy="400" r="11"/>
        <text class="cvlab rv" data-i="0" x="96" y="76">skitse</text>
        <text class="cvlab rv hiy" data-i="1" x="846" y="352" text-anchor="end">færdigt design</text>
      </svg>
      <p class="cvaxis y" style="left:${X - 6}px;top:${Y + 210}px">villighed til at lave om</p>
      <p class="cvaxis x" style="left:${X + 70}px;top:${Y + 432}px">detaljeringsgrad</p>
      <div class="cvnotes" style="left:${X + CW + 40}px;top:${Y - 10}px">` +
      s.steps.map((x, i) => `
        <div class="rv cvnote" data-i="${i}">
          <h3>${esc(x.t)}</h3><p>${esc(x.d)}</p>
        </div>`).join('') + `</div></div>`;
  },

  /* byggeloopet: fire trin på tværs af hele bredden, og en vej tilbage under dem */
  loop(s){
    const n = s.steps.length, GAP = 90, CARD = Math.round((USABLE - GAP * (n - 1)) / n);
    const TOP = 470, CH = 190, ARROW_Y = TOP + 86;
    const xOf = i => PAD + i * (CARD + GAP);
    const midOf = i => xOf(i) + CARD / 2;

    const cards = s.steps.map((x, i) => `
      <div class="rv lnode" data-i="${i}"
           style="left:${xOf(i)}px;top:${TOP}px;width:${CARD}px;min-height:${CH}px">
        <b class="num">${i + 1}</b><h3>${esc(x.t)}</h3><p>${esc(x.d)}</p>
      </div>`).join('');

    const arrows = [0, 1, 2].map(i => `
      <path class="rv larrow" data-i="${i + 1}" marker-end="url(#ah)"
            d="M ${xOf(i) + CARD + 14} ${ARROW_Y} L ${xOf(i + 1) - 16} ${ARROW_Y}"/>`).join('');

    /* vejen tilbage: fra sidste kort, under rækken, op i det første igen */
    const BOT = TOP + CH + 16, LOW = BOT + 130, R = 40;
    const back = `M ${midOf(3)} ${BOT} L ${midOf(3)} ${LOW - R} `
               + `Q ${midOf(3)} ${LOW} ${midOf(3) - R} ${LOW} `
               + `L ${midOf(0) + R} ${LOW} Q ${midOf(0)} ${LOW} ${midOf(0)} ${LOW - R} `
               + `L ${midOf(0)} ${BOT + 6}`;

    return head(s) + `<div class="body scene">
      <svg class="ring" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" aria-hidden="true">
        <defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7"
          orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z"/></marker></defs>
        ${arrows}
        <path class="rv lback" data-i="3" marker-end="url(#ah)" d="${back}"/>
      </svg>
      <div class="orbit" style="offset-path:path('${back}')"></div>
      <p class="lcenter" style="left:${W / 2}px;top:${LOW}px">og forfra · ca. 10 min. pr. runde</p>
      ${cards}</div>`;
  }
};

/* otte felter: rammerne først, så idéerne, så den ene der bliver valgt */
function crazyGrid(){
  const CW = 246, CH = 228, GX = 16, GY = 20, X0 = 10, Y0 = 10;
  let out = '';
  for (let i = 0; i < 8; i++){
    const x = X0 + (i % 4) * (CW + GX), y = Y0 + Math.floor(i / 4) * (CH + GY);
    out += `<g class="c8 rv" data-i="0"><rect x="${x}" y="${y}" width="${CW}" height="${CH}" rx="10"/></g>`;
    out += `<g class="c8i rv" data-i="1">${cellArt(i, x, y, CW)}</g>`;
  }
  const hx = X0 + 1 * (CW + GX), hy = Y0 + 1 * (CH + GY);
  out += `<g class="c8pick rv" data-i="2">
    <rect x="${hx - 9}" y="${hy - 9}" width="${CW + 18}" height="${CH + 18}" rx="14"/>
    <text x="${hx + CW / 2}" y="${hy + CH + 40}" text-anchor="middle">den her</text></g>`;
  return `<svg viewBox="0 0 1040 560" width="1040" height="560" aria-hidden="true">${out}</svg>`;
}

/* otte forskellige krusseduller, så det ligner otte idéer og ikke ét mønster */
function cellArt(i, x, y, w){
  const p = 26, X = x + p, Y = y + p, iw = w - p * 2;
  const bar = `<rect class="k" x="${X}" y="${Y}" width="${iw}" height="18" rx="4"/>`;
  const line = (dy, f) => `<line class="k" x1="${X}" y1="${Y + dy}" x2="${X + iw * f}" y2="${Y + dy}"/>`;
  const btn = dy => `<rect class="k f" x="${X + iw - 88}" y="${Y + dy}" width="88" height="28" rx="6"/>`;
  const box = (dy, hh) => `<rect class="k" x="${X}" y="${Y + dy}" width="${iw}" height="${hh}" rx="6"/>`;
  const circ = dy => `<circle class="k" cx="${X + 20}" cy="${Y + dy}" r="17"/>`;
  return [
    bar + line(48, 1) + line(72, .7) + btn(106),
    bar + box(42, 50) + box(104, 50),
    circ(56) + line(48, .55) + line(72, .4) + btn(112),
    bar + line(48, .9) + line(72, .6) + line(96, .8) + btn(128),
    box(8, 64) + line(96, .8) + line(120, .5) + btn(144),
    bar + circ(72) + line(64, .5) + line(88, .35) + btn(124),
    bar + line(48, .8) + box(66, 44) + btn(130),
    box(2, 40) + box(54, 40) + box(106, 40) + btn(158)
  ][i];
}

/* tre skærme, pile imellem, og ordene på knapperne */

      <rect class="k" x="${X}" y="${Y + 34}" width="${iw}" height="20" rx="5"/>
      <line class="k" x1="${X}" y1="${Y + 96}" x2="${X + iw}" y2="${Y + 96}"/>
      <line class="k" x1="${X}" y1="${Y + 128}" x2="${X + iw * .7}" y2="${Y + 128}"/>
      <line class="k" x1="${X}" y1="${Y + 176}" x2="${X + iw}" y2="${Y + 176}"/>
      <line class="k" x1="${X}" y1="${Y + 208}" x2="${X + iw * .55}" y2="${Y + 208}"/>
      <text class="scnum" x="${x + FW / 2}" y="${Y - 16}" text-anchor="middle">${i + 1} · ${label[i]}</text>
    </g>

  });
  [0, 1].forEach(i => {

    out += `<path class="scarrow rv" data-i="1" marker-end="url(#ah2)"

    <defs><marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7"
      orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z"/></marker></defs>${out}</svg>`;
}

/* ── trinmaskinen ────────────────────────────────────────────────────────── */
let si = 0, n = -1;

const lastStep = i => SLIDES[i].steps.length - 1;
const BEATS = SLIDES.reduce((a, s) => a + s.steps.length + 1, 0);
const beatsBefore = i => SLIDES.slice(0, i).reduce((a, s) => a + s.steps.length + 1, 0);

function apply(){
  si = Math.max(0, Math.min(si, SLIDES.length - 1));
  n  = Math.max(-1, Math.min(n, lastStep(si)));

  slides.forEach((el, i) => {
    el.classList.toggle('is-active', i === si);
    el.classList.toggle('done', i === si && n === lastStep(i) && n > -1);
    if (i === si) revealables[i].forEach(p => {
      p.classList.toggle('on', +p.dataset.i <= n);
      p.classList.toggle('now', +p.dataset.i === n);
    });
  });

  const s = SLIDES[si];
  phaseEl.textContent = s.phase;
  clockEl.textContent = s.clock;
  countEl.textContent = `${si + 1} / ${SLIDES.length}`;
  progress.style.width = ((beatsBefore(si) + n + 2) / BEATS * 100) + '%';
}

function next(){ n < lastStep(si) ? n++ : (si < SLIDES.length - 1 && (si++, n = reduced ? lastStep(si) : -1)); apply(); }
function prev(){ n > -1 ? n-- : (si > 0 && (si--, n = lastStep(si))); apply(); }
function goSlide(d){ si += d; n = reduced ? lastStep(si) : -1; apply(); }

addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  if (k === 'ArrowRight' || k === ' ' || k === 'PageDown'){ e.preventDefault(); next(); }
  else if (k === 'ArrowLeft' || k === 'PageUp'){ e.preventDefault(); prev(); }
  else if (k === 'ArrowDown'){ e.preventDefault(); goSlide(1); }
  else if (k === 'ArrowUp'){ e.preventDefault(); goSlide(-1); }
  else if (k === 'r' || k === 'R'){ n = -1; apply(); }
  else if (k === 'f' || k === 'F'){ n = lastStep(si); apply(); }
  else if (k === 'Home'){ si = 0; n = -1; apply(); }
});

bNext.onclick = next; bPrev.onclick = prev;
bAll.onclick  = () => { n = lastStep(si); apply(); };

/* ── skalér lærredet ─────────────────────────────────────────────────────── */
function fitStage(){
  stage.style.transform =
    `translate(-50%,-50%) scale(${Math.min(innerWidth / W, innerHeight / H)})`;
}
addEventListener('resize', fitStage);
fitStage();

/* dybt link ved indlæsning: #slide.trin — skrives ikke tilbage undervejs */
const m = /^#(\d+)(?:\.(-?\d+))?$/.exec(location.hash);
if (m){ si = +m[1]; n = m[2] === undefined ? -1 : +m[2]; }
apply();

</script>
