<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stepped presentations: style gallery</title>
<link rel="stylesheet" href="fonts/fonts.css">
<!-- Each file is one :root token block. Exactly one theme and one motion is enabled. -->
<link rel="stylesheet" href="themes/house.css" data-theme="house">
<link rel="stylesheet" href="themes/editorial.css" data-theme="editorial">
<link rel="stylesheet" href="themes/swiss.css" data-theme="swiss">
<link rel="stylesheet" href="themes/midnight.css" data-theme="midnight">
<link rel="stylesheet" href="motion/calm.css" data-motion="calm">
<link rel="stylesheet" href="motion/crisp.css" data-motion="crisp">
<link rel="stylesheet" href="motion/playful.css" data-motion="playful">
<link rel="stylesheet" href="motion/drawn.css" data-motion="drawn">
<style>
/* The scene below mirrors the components in starter.html, so what you pick here is what a
   new deck starts as. If you change a component there, change it here too. */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--outside);color:var(--ink);font-family:var(--sans);overflow:hidden}
p,h1,h2,h3,ul,ol,figure{margin:0}
.display{font-family:var(--display);font-weight:var(--display-weight);
  text-transform:var(--display-case);letter-spacing:var(--display-tracking);
  line-height:var(--display-leading)}
.meta{font-family:var(--mono);font-weight:500;text-transform:var(--label-case);
  letter-spacing:var(--label-tracking)}

/* ---- picker bar, outside the stage ---- */
#bar{position:fixed;left:0;right:0;top:0;height:64px;display:flex;align-items:center;gap:28px;
  padding:0 20px;background:#0b0b0f;color:#d9d8d3;font:13px/1 system-ui,sans-serif;z-index:10;
  overflow-x:auto;white-space:nowrap}
#bar .grp{display:flex;align-items:center;gap:6px}
#bar .grp>span{color:#8b8a86;margin-right:4px;font:600 11px/1 ui-monospace,monospace;
  letter-spacing:.16em;text-transform:uppercase}
#bar button{font:inherit;color:inherit;background:none;border:1px solid #2c2c33;border-radius:5px;
  padding:8px 12px;cursor:pointer}
#bar button[aria-pressed="true"]{background:#e9e8e4;color:#111;border-color:#e9e8e4}
#ask{margin-left:auto;font:12px/1 ui-monospace,monospace;color:#a9a8a3}

#viewport{position:fixed;left:0;right:0;top:64px;bottom:0}
#stage{width:1920px;height:1080px;position:absolute;left:50%;top:50%;
       background:var(--paper);overflow:hidden;transform-origin:center}

/* ---- header on the stage ---- */
.head{position:absolute;left:150px;right:150px;top:110px;display:flex;justify-content:space-between;
      align-items:flex-end;gap:60px}
.kicker{display:flex;align-items:center;gap:14px;font-weight:700;font-size:20px;
        letter-spacing:.34em;color:var(--ink-3)}
.kicker::before{content:"";width:14px;height:14px;border-radius:var(--marker-radius);background:var(--accent)}
.head h1{margin-top:22px;font-size:96px;max-width:14ch}
.head .lede{margin-top:20px;max-width:52ch;font-size:21px;line-height:1.55;color:var(--ink-2)}
.spec{text-align:right;font-size:16px;line-height:2;color:var(--ink-3)}
.swatches{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.swatches i{width:30px;height:30px;border-radius:var(--marker-radius);background:var(--c)}

/* ---- the stepped scene, as in starter.html ---- */
.axis{position:absolute;left:150px;right:150px;top:800px;display:flex;
      justify-content:space-between;align-items:center;transform:translateY(-50%)}
.axis s{width:10px;height:10px;border-radius:var(--marker-radius);background:var(--muted);
        text-decoration:none;flex:none}
.knot{position:absolute;top:800px;width:44px;height:44px;border-radius:var(--marker-radius);
      background:var(--c);transform:translate(-50%,-50%) scale(.4);opacity:0;z-index:3;
      transition:transform var(--t-reveal) var(--ease),opacity var(--t-fade) var(--ease)}
.knot.on{transform:translate(-50%,-50%) scale(1);opacity:1}
.knot.now::after{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--c);
                 animation:halo var(--ambient-period) var(--ease-out) infinite}
@keyframes halo{0%{transform:scale(1);opacity:var(--ambient-opacity)}
                70%,100%{transform:scale(var(--ambient-scale));opacity:0}}
.label{position:absolute;top:856px;transform:translate(-50%,var(--rise));font-size:19px;
       color:var(--ink-3);white-space:nowrap;opacity:0;clip-path:inset(0 var(--wipe-from) 0 0);
       transition:opacity var(--t-fade) var(--ease),transform var(--t-reveal) var(--ease),
                  clip-path var(--t-reveal) var(--ease),color var(--t-fade)}
.label.on{opacity:1;color:var(--c);transform:translate(-50%,0);clip-path:inset(0 0 0 0);
          transition-delay:var(--stagger)}
.stem{position:absolute;width:var(--rule);background:var(--c);opacity:.4;
      transform:translateX(-50%) scaleY(0);transform-origin:bottom;
      transition:transform var(--t-reveal) var(--ease)}
.stem.on{transform:translateX(-50%) scaleY(1);transition-delay:var(--stagger)}
.card{position:absolute;width:280px;padding:22px 26px;border-radius:var(--radius);
      text-align:center;background:color-mix(in srgb,var(--c) var(--fill-mix),var(--paper));
      opacity:0;z-index:2;clip-path:inset(0 var(--wipe-from) 0 0);
      transform:translate(calc(-50% + var(--sx,0px) * var(--travel)),
                          calc(var(--sy,0px) * var(--travel) + var(--rise)))
                scale(var(--from-scale));
      transition:opacity var(--t-fade) var(--ease),transform var(--t-reveal) var(--ease),
                 clip-path var(--t-reveal) var(--ease)}
.card.on{opacity:1;transform:translate(-50%,0) scale(1);clip-path:inset(0 0 0 0);
         transition-delay:calc(var(--stagger) * 2)}
.card h3{font-size:40px;color:var(--c)}
/* longhands: in the shorthand, a --title-anim of none is read as the fill mode */
.card.on h3{animation-name:var(--title-anim);animation-duration:var(--t-reveal);
            animation-timing-function:steps(var(--chars,12));animation-fill-mode:both;
            animation-delay:calc(var(--stagger) * 2)}
@keyframes type{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.card p{margin-top:10px;font-family:var(--mono);font-size:15px;line-height:1.5;color:var(--ink-2)}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition-duration:.001s!important}
  .knot.now::after{content:"";position:absolute;inset:-9px;border-radius:inherit;
                   border:2px solid var(--c);background:none;opacity:.5}
}
</style>
</head>
<body>
<div id="bar">
  <div class="grp" id="themes"><span>Theme</span></div>
  <div class="grp" id="motions"><span>Motion</span></div>
  <div class="grp"><button id="play" type="button" aria-pressed="true">autoplay</button></div>
  <div id="ask"></div>
</div>
<div id="viewport"><div id="stage">
  <div class="head">
    <div>
      <p class="kicker meta" id="kicker"></p>
      <h1 class="display" id="name"></h1>
      <p class="lede" id="lede"></p>
    </div>
    <div class="spec meta" id="spec"></div>
  </div>
  <div id="scene"></div>
</div></div>

<script>
const THEMES = {
  house:     ["House", "Documentary and confident. Condensed uppercase display, mono for data, cool paper."],
  editorial: ["Editorial", "A magazine feature. Warm paper, a soft serif display in sentence case, serif prose."],
  swiss:     ["Swiss", "White, black, one red. A tight heavy grotesk, square corners, strong rules."],
  midnight:  ["Midnight", "A keynote stage. Near-black paper, warm ink, a soft palette for dark rooms."]
};
const MOTIONS = {
  calm:    ["Calm", "Soft fades and a small rise. Nothing competes with the speaker."],
  crisp:   ["Crisp", "Fast, clean wipes. No bounce, no travel."],
  playful: ["Playful", "Cards pop out of their marker and overshoot a little."],
  drawn:   ["Drawn", "Lines draw on, titles type in, everything slower."]
};
const ITEMS = [
  { label:"January", name:"Discover", desc:"Talk to the people it is for" },
  { label:"March",   name:"Shape",    desc:"Agree what it is not" },
  { label:"June",    name:"Build",    desc:"Ship the smallest real thing" },
  { label:"October", name:"Grow",     desc:"Measure, then widen" }
];
const X0 = 340, COL = 413, DOTY = 800, CARD_TOP = 560, KNOT_R = 22;

const scene = document.getElementById('scene'), stage = document.getElementById('stage');
scene.innerHTML = '<div class="axis">' + '<s></s>'.repeat(34) + '</div>' +
  ITEMS.map((p, i) => { const x = X0 + i * COL, c = `--c:var(--c${i + 1})`; return `
    <div class="knot" data-i="${i}" style="left:${x}px;${c}"></div>
    <div class="stem" data-i="${i}" style="left:${x}px;${c}"></div>
    <div class="label meta" data-i="${i}" style="left:${x}px;${c}">${p.label}</div>
    <div class="card" data-i="${i}" style="left:${x}px;top:${CARD_TOP}px;${c}">
      <h3 class="display" style="--chars:${p.name.length}">${p.name}</h3><p>${p.desc}</p></div>`; }).join('');

function layout(){
  scene.querySelectorAll('.card').forEach(el => {
    const bottom = CARD_TOP + el.offsetHeight, stem = el.previousElementSibling.previousElementSibling;
    el.style.setProperty('--sy', (DOTY - CARD_TOP - el.offsetHeight / 2) + 'px');
    stem.style.top = bottom + 'px'; stem.style.height = (DOTY - KNOT_R - bottom) + 'px';
  });
}

let step = -1;
function applyStep(n){
  step = n;
  scene.querySelectorAll('.knot,.stem,.label,.card').forEach(el =>
    el.classList.toggle('on', +el.dataset.i <= step));
  scene.querySelectorAll('.knot').forEach(el => el.classList.toggle('now', +el.dataset.i === step));
}

let theme = 'house', motion = 'calm';
function pick(t, m){
  theme = THEMES[t] ? t : theme; motion = MOTIONS[m] ? m : motion;
  document.querySelectorAll('link[data-theme]').forEach(l => l.disabled = l.dataset.theme !== theme);
  document.querySelectorAll('link[data-motion]').forEach(l => l.disabled = l.dataset.motion !== motion);
  document.querySelectorAll('#bar [data-t]').forEach(b => b.setAttribute('aria-pressed', b.dataset.t === theme));
  document.querySelectorAll('#bar [data-m]').forEach(b => b.setAttribute('aria-pressed', b.dataset.m === motion));
  const cs = getComputedStyle(document.documentElement), fam = v => cs.getPropertyValue(v).split(',')[0].replace(/"/g, '').trim();
  kicker.textContent = THEMES[theme][0] + ' · ' + MOTIONS[motion][0];
  document.getElementById('name').textContent = THEMES[theme][0] + ', moving ' + MOTIONS[motion][0].toLowerCase();
  lede.textContent = THEMES[theme][1] + ' ' + MOTIONS[motion][1];
  spec.innerHTML = `${fam('--display')} · display<br>${fam('--sans')} · prose<br>${fam('--mono')} · data
    <div class="swatches">${[1, 2, 3, 4, 5].map(i => `<i style="--c:var(--c${i})"></i>`).join('')}</div>`;
  ask.textContent = `ask for: theme ${THEMES[theme][0]}, motion ${MOTIONS[motion][0]}`;
  history.replaceState(null, '', '#' + theme + '/' + motion);
  /* a newly picked theme's faces load lazily: measure again once they are in */
  requestAnimationFrame(() => { layout(); document.fonts.ready.then(layout); applyStep(-1); clearTimeout(timer); if (playing) timer = setTimeout(tick, 500); });
}

const btn = (grp, key, attr, label) => grp.insertAdjacentHTML('beforeend',
  `<button type="button" data-${attr}="${key}">${label}</button>`);
Object.entries(THEMES).forEach(([k, v]) => btn(themes, k, 't', v[0]));
Object.entries(MOTIONS).forEach(([k, v]) => btn(motions, k, 'm', v[0]));
document.getElementById('bar').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.t) pick(b.dataset.t, motion);
  if (b.dataset.m) pick(theme, b.dataset.m);
});

/* autoplay walks the scene and starts again, so you can watch a style rather than drive it */
let playing = true, timer;
function tick(){
  applyStep(step < ITEMS.length - 1 ? step + 1 : -1);
  timer = setTimeout(tick, step === ITEMS.length - 1 ? 2600 : step === -1 ? 900 : 1500);
}
play.onclick = () => {
  playing = !playing; play.setAttribute('aria-pressed', playing);
  clearTimeout(timer); if (playing) tick();
};
addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' '){ e.preventDefault(); playing = false;
    play.setAttribute('aria-pressed', false); clearTimeout(timer); applyStep(Math.min(step + 1, ITEMS.length - 1)); }
  if (e.key === 'ArrowLeft'){ playing = false; play.setAttribute('aria-pressed', false);
    clearTimeout(timer); applyStep(Math.max(step - 1, -1)); }
});

function fitStage(){
  const vp = document.getElementById('viewport');
  const k = Math.min(vp.clientWidth / 1920, vp.clientHeight / 1080);
  stage.style.transform = `translate(-50%,-50%) scale(${k})`;
}
addEventListener('resize', fitStage);
fitStage();
const [t0, m0] = location.hash.slice(1).split('/');
document.fonts.ready.then(() => pick(t0, m0));
</script>
</body>
</html>
